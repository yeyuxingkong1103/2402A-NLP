# 工单编号：人工智能NLP-RAG-Graph RAG优化任务
#
# 【层面1 优化】实体关系抽取 Prompt v2
#
# 与 08 版（prompts/kg_extract.yaml，version 1）的差异，**每一条都来自实测缺陷**，
# 不是泛泛而谈的「写得更详细」：
#
#   v2 改动 ①  关系方向硬约束
#       08 实测缺陷：`邮储银行 --SHAREHOLDER_OF--> 邮政集团`（方向完全反了，
#       原文是「本行的控股股东邮政集团」）。v2 用正反例对照讲清 head/tail 方向。
#
#   v2 改动 ②  evidence 必须「切题」
#       08 实测缺陷：`储一昀 --SERVES_AS--> 平安银行`，证据却是「储一昀在
#       中国平安/泰豪科技/环旭电子/嘉兴银行任独立董事」—— 证据确实出自平安银行
#       年报，也确实在讲任职，但与平安银行无关。v2 明确要求证据必须点到关系的
#       对象主体，且必须是**同一句话**。
#
#   v2 改动 ③  指代消解规则
#       08 实测缺陷：年报通篇以「本行」「本公司」自称，LLM 原样抽成实体，
#       产生大量无指称对象的代词节点。v2 给出显式替换规则。
#
#   v2 改动 ④  多文档实体对齐与消歧
#       08 实测缺陷：同一主体出现「平安银行 / 平安银行股份有限公司 /
#       深圳发展银行（更名前）」多种写法，被抽成多个割裂节点。
#
#   v2 改动 ⑤  噪声类型黑名单
#       08 实测缺陷：「高级管理人员」被当成 Person、「招商银行股份有限公司
#       高级管理人员薪酬管理办法」被当成 Business。v2 显式排除。
#
#   v2 改动 ⑥  金融领域术语约束
#       年报固有用词（拨备覆盖率、逾期60天以上贷款、大零售/大对公「六四占比」、
#       绿色金融、科技金融…）单列，提示模型优先识别。
#
#   v2 改动 ⑦  输出配额放宽（实体 8→15、关系 6→10）
#       08 实测：年报一页常含多个主体（董监高履历、关联方列表），8 个实体装不下。

version: 2
name: kg_extract_v2
base: 08 的 prompts/kg_extract.yaml（version 1）

# ---------------------------------------------------------------------------
# 实体抽取（两段式①）
# ---------------------------------------------------------------------------
entities_system: |
  你是金融上市公司年报的实体识别专家。从给定年报文本片段中抽取**实体**，输出严格 JSON。

  ## 允许的实体类型（只能从中选择，括号内为判别边界）
  {entity_types}

  ## 硬性规则
  1. 只抽文本中**明确出现**的实体，禁止常识补充或推测。
  2. **最多输出 15 个实体**：优先保留与公司治理、股东、董监高、主营业务、
     财务指标最相关的。年报一页常含多位董监高履历，不要因为配额而丢掉人名。
  3. 每个实体**只列一次**，名称用**规范写法**（见下方规则 5、6）。
  4. 只输出 `entities` 数组，不要输出 relations 或任何其他字段。
  5. **指代消解**：文本中的「本行 / 本公司 / 本集团 / 该公司」**不是实体名**，
     请替换为该公司在文本中的**正式名称**。
     · 例：平安银行年报中的「本行」→ 抽取为「平安银行」
     · 若文本中找不到正式名称，才可保留原词。
  6. **实体名对齐与消歧**：
     · 公司统一到**最常用的规范简称**：「平安银行股份有限公司」→「平安银行」；
       「中国平安保险（集团）股份有限公司」→「中国平安」；
       「中国邮政储蓄银行股份有限公司」→「邮储银行」。
     · **历史名称并入现行主体**：「深圳发展银行」是平安银行更名前的名称 → 抽取为「平安银行」。
     · **集团与子公司必须分开**：「中国平安」是集团，「平安银行」是子公司，
       两者是**不同实体**，不可混为一谈。
  7. **不要抽取下列内容**（它们不是实体）：
     · 职务名：高级管理人员、董事、监事、股东、高管、管理层、员工
     · 文件名/制度名：……管理办法、……章程、……制度、……议案、……公告
     · 纯泛称：公司、集团、银行、机构、部门、市场、客户
  8. 输出到最后一个右大括号 `}}` 就**立即停止**，其后不得再输出任何字符。

  ## 金融领域术语（出现时应优先识别为 Metric 或 Business）
  拨备覆盖率、不良贷款率、逾期60天以上贷款占比、拨贷比、资本充足率、
  核心一级资本充足率、净息差、成本收入比、内含价值、新业务价值、
  综合偿付能力充足率、绿色金融、科技金融、普惠金融、财富管理、
  零售金融、对公业务、资金同业业务、大零售、大对公、「六四占比」

  ## 输出格式
  {{
    "entities": [
      {{"name": "实体规范名", "type": "实体类型", "aliases": ["文中出现的其他写法"], "attrs": {{}}}}
    ]
  }}

  ## 示例
  输入：
  本行董事会于2019年12月聘任谢永林先生为非执行董事、董事长。
  谢永林先生现任中国平安保险（集团）股份有限公司总经理。
  报告期末，本行不良贷款率为1.65%，较上年末下降0.10个百分点。

  输出：
  {{"entities": [
    {{"name": "平安银行", "type": "Company", "aliases": ["本行"], "attrs": {{}}}},
    {{"name": "谢永林", "type": "Person", "aliases": ["谢永林先生"], "attrs": {{}}}},
    {{"name": "中国平安", "type": "Company",
      "aliases": ["中国平安保险（集团）股份有限公司"], "attrs": {{}}}},
    {{"name": "不良贷款率", "type": "Metric", "aliases": [], "attrs": {{}}}}
  ]}}

entities_user_template: |
  文本片段（来源：{source}，第 {page} 页，章节：{heading}）：
  ---
  {text}
  ---

  请只抽取实体（最多 15 个），公司名用规范简称，「本行/本公司」消解为正式名称，输出 JSON。

# ---------------------------------------------------------------------------
# 关系抽取（两段式②）
# ---------------------------------------------------------------------------
relations_system: |
  你是金融上市公司年报的关系抽取专家。给定年报文本片段与**已确认的实体清单**，
  只抽取这些实体之间的关系，输出严格 JSON。

  ## 允许的关系类型（只能从中选择，括号内为合法的「头类型 → 尾类型」）
  {relation_types}

  ## 硬性规则
  1. 关系的 head 与 tail **必须逐字复制**给定实体清单中的名称，不得改写、
     不得引入清单之外的实体。
  2. **方向不得颠倒**（本任务最容易出错之处，务必逐条核对）：
     记法为 `head --关系--> tail`，head 是关系的**发出者**。
     · SHAREHOLDER_OF 是「股东 → 被投资方」：
       原文「本行的控股股东是邮政集团」→ 邮政集团 --SHAREHOLDER_OF--> 邮储银行。
       注意「A 的控股股东是 B」中，**B 才是股东**（head），A 是被投资方（tail）。
     · CONTROLS 是「控制方 → 被控制方」，规则同上。
     · SERVES_AS 是「人物 → 公司」：谢永林 --SERVES_AS--> 平安银行。
     · INVESTS_IN 是「投资方 → 被投资方」。
     · OPERATES 是「公司 → 业务」。
  3. **evidence 必须切题**：每条关系给出原文中**连续**的一段文字（不超过 60 字），
     必须同时满足：
     · 真实出现在给定文本里（逐字照抄，标点也不改）；
     · **提到了该关系的对象（tail）**，或对象即本文件主体公司而原句用「本行/本公司」自称；
     · 是**同一句话**，禁止用分号把不相邻的两句拼在一起。
     · **反例**（这样的输出会被丢弃）：关系写「储一昀 --SERVES_AS--> 平安银行」，
       证据却是「兼任中国平安保险（集团）股份有限公司、泰豪科技股份有限公司、
       环旭电子股份有限公司和嘉兴银行股份有限公司独立董事」—— 该句讲的是
       储一昀在**别的公司**任职，与平安银行无关。
  4. **最多输出 10 条关系**：只保留证据最充分的关系。
  5. 每条关系**只列一次**：禁止重复输出，严禁进入重复循环。
  6. 只输出 `relations` 数组，不要重复输出实体。
  7. 输出到最后一个右大括号 `}}` 就**立即停止**，其后不得再输出任何字符。

  ## 输出格式
  {{
    "relations": [
      {{"head": "头实体名", "type": "关系类型", "tail": "尾实体名",
        "evidence": "原文连续片段", "confidence": 0.9}}
    ]
  }}

  ## 示例一（股东关系 · 注意方向）
  实体清单：邮储银行（Company）、邮政集团（Company）
  文本：截至报告期末，本行的控股股东中国邮政集团有限公司持股比例为 100%。
  输出：
  {{"relations": [
    {{"head": "邮政集团", "type": "SHAREHOLDER_OF", "tail": "邮储银行",
      "confidence": 0.95,
      "evidence": "本行的控股股东中国邮政集团有限公司持股比例为 100%"}}
  ]}}

  ## 示例二（任职关系）
  实体清单：谢永林（Person）、平安银行（Company）
  文本：本行董事会聘任谢永林先生为非执行董事、董事长。
  输出：
  {{"relations": [
    {{"head": "谢永林", "type": "SERVES_AS", "tail": "平安银行",
      "confidence": 0.95,
      "evidence": "本行董事会聘任谢永林先生为非执行董事、董事长"}}
  ]}}

