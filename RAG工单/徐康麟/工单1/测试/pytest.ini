[pytest]
; Test configuration for the RAG QA system (ticket #1).
;
; testpaths : running plain `pytest` collects only tests/.
; addopts   : disable the .pytest_cache directory (keeps the workspace clean).
;
; NOTE on the temporary directory: tests/conftest.py points pytest's temp root
; at a PID-unique directory (tests/.pytest_run_<pid>) through the
; PYTEST_DEBUG_TEMPROOT environment variable.  Two reasons:
;   1. restricted sandboxes may deny access to the system temp dir, which would
;      break every tmp_path fixture with a PermissionError;
;   2. a unique root per process keeps concurrently running pytest sessions
;      (e.g. another engineer running the same suite) from wiping each other's
;      temporary files.
; The directory is removed automatically when the session ends.
testpaths = tests
addopts = -p no:cacheprovider
