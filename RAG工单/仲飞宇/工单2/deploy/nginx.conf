# 负载均衡 + 反向代理：把 /chat、/chat/stream 分发到多个 uvicorn worker。
# 需求里的「负载均衡（http-proxy, nginx）」与「多 worker 横向扩展」。
#
# 用法：
#   1. 一条命令起多个 worker（自动带共享向量库与 redis 记忆的配置）：
#        bash scripts/run_workers.sh          # 默认 8000 / 8002 / 8003
#   2. 把本文件放到 /etc/nginx/conf.d/rag.conf，nginx -s reload。
#
# 注意：
# - **端口不能用 8001**：那是 BGE 重排服务（RERANK_BASE_URL）。本文件早期版本写的
#   是 8000/8001/8002，因为从没真跑过，一直没暴露这个撞车。
# - 多 worker 共享短期记忆要 MEMORY_BACKEND=redis（进程内内存不跨 worker）。
# - 多 worker 共享向量库必须把 MILVUS_DB_URI 换成独立 Milvus（Milvus Lite 独占文件锁，
#   见 deploy/docker-compose.milvus.yml）。scripts/run_workers.sh 已默认处理好这两项。

upstream rag_backend {
    # zone：把轮询状态放进共享内存，跨 worker 共享。
    # 不加的话默认 worker_processes auto（本机 16 个 worker）**每个 worker 各自维护轮询指针、
    # 都从第一台上游起步**——串行发请求时每条新连接被不同 worker 接走，于是一连串请求全落
    # 在 :8000 上，看着像负载均衡没生效（实测串行 6 发 6 个 :8000，并发 12 发才是 3/5/4）。
    zone rag_backend 64k;
    # 默认轮询；可加 least_conn 或 ip_hash（有状态会话时用 ip_hash 保证同一用户打到同一 worker）
    server 127.0.0.1:8000;
    server 127.0.0.1:8002;
    server 127.0.0.1:8003;
}

server {
    listen 80;
    # 必须带上 127.0.0.1：Ubuntu 默认站点是 `listen 80 default_server` + `server_name _`，
    # 只写 localhost 的话，`curl http://127.0.0.1/...`（Host: 127.0.0.1）匹配不上本 server，
    # 会落到默认站点拿到 404——setup_nginx.sh 的自检正是这么 curl 的，会假报失败。
    server_name localhost 127.0.0.1;

    # /knowledge/upload 收扫描件/PDF 走 OCR，应用侧没有大小上限；nginx 默认只有 1m，
    # 不放开的话超过 1MB 的文件会被 nginx 直接 413（根本到不了应用）。
    client_max_body_size 50m;

    location / {
        proxy_pass http://rag_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 回带真正处理请求的 worker（127.0.0.1:800X），用来直接观测轮询分发是否生效；
        # 没有它就只能翻各 worker 的 access log 去推。
        add_header X-Upstream $upstream_addr always;

        # ⚠️ 必须覆写：nginx 默认 proxy_read_timeout 是 **60s**，而真 LLM 单发要 50~125s
        # （实测均值 75.9s / P90 115.3s，见 deploy/jmeter/report/），所以走 nginx 时
        # **大部分正常 /chat 会被 504**，错误日志写作：
        #   upstream timed out (110: Connection timed out) while reading response header
        # 这个坑在 /health 上完全看不出来——健康检查是毫秒级返回的。
        # 600s ≈ 5x P90：并发排队时延迟会显著拉长（重排单实例在并发 32 下单发就 32.6s）。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
    }

    # SSE 流式接口（/chat/stream）：必须关掉缓冲，否则流式增量会被 nginx 攒成一坨才下发
    location /chat/stream {
        proxy_pass http://rag_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header X-Upstream $upstream_addr always;
    }
}
