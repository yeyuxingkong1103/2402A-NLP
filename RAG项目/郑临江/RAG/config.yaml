# ============================================================
# RAG2 在线阶段配置
# 优先级：内置默认值 < 本文件 < RAG2_* 环境变量
# ============================================================

app:
  host: 127.0.0.1          # 服务监听地址
  port: 8090               # 服务端口
  name: "RAG2 在线问答服务"
  env: dev
  log_dir: logs            # 日志目录（相对项目根目录）
  log_level: INFO          # DEBUG / INFO / WARNING / ERROR

llm:
  base_url: http://localhost:11434/v1   # Ollama OpenAI 兼容端点
  api_key: ollama
  model: Qwen3.5:4B
  temperature: 0.2
  max_tokens: 1024
  reasoning_effort: none   # 关闭 Qwen 思考链，避免结构化输出被截断
  timeout: 300

milvus:
  uri: http://localhost:19530
  collection: agriculture_knowledge   # 已入库的知识集合
  dim: 1024
  embed_model: D:/modelscope/bge-m3
  rerank_model: D:/modelscope/bge-reranker-v2-m3
  device: cpu

redis:
  host: 127.0.0.1
  port: 6379
  db: 0
  password: ""             # 本机 Redis 无密码
  prefix: "rag2:"          # 所有 key 的统一前缀（便于隔离与清理）
  history_ttl: 86400       # 会话/消息短期记忆过期时间（秒，24h）
  token_ttl: 43200         # 登录令牌有效期（秒，12h）

retrieval:
  top_k: 6
  mode: hybrid             # dense / bm25 / hybrid
  rerank: true             # 是否用 bge-reranker 交叉编码器精排
  rerank_top_k: 12

memory:
  short_term_turns: 5      # 拼进提示词的最近对话轮数

admin:
  usernames: [admin]       # 管理员用户名列表（登录即管理员，可在线改配置）

roles_path: roles.yaml
