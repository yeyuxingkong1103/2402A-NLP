# 让 Grafana 启动时自动加载下面这个目录里的面板 JSON
apiVersion: 1
providers:
  - name: ragflow
    orgId: 1
    folder: RAGFlow
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
