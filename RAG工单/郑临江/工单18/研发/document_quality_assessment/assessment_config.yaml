# 工单编号：人工智能NLP-RAG-实现文档质量评估Skill并集成至智能体工作流
page_character_threshold: 40
scan_ratio_threshold: 0.70
text_ratio_threshold: 0.80
classification_review_margin: 0.10
simhash_max_hamming: 3
simhash_min_chars: 100
simhash_sample_chars: 30000
length_bins: [0, 1000, 5000, 20000, 100000, 1000000]
context_characters: 40
max_sensitive_matches_per_file: 300
sensitive:
  phone: true
  email: true
  identity_card: true
  bank_card: false
  bank_card_min_digits: 16
  bank_card_max_digits: 19
classification:
  tiny_file_bytes: 0
  title_keywords:
    Patent: ['专利', 'CN1', 'CN2']
    Technical_Document: ['技术', '图纸', '说明书']
