# =============================================================================
# Role RAG_try 主配置
# 优先级：内置默认值 < configs/config.yaml < .env 环境变量
# 模型路径统一指向 D:/modelscope，不依赖任何外网下载。
# =============================================================================

app:
  name: role-rag
  version: 1.0.0
  host: 127.0.0.1
  port: 8020
  env: dev
  debug: true
  warmup: true             # 启动后台预热模型与 BM25 索引（不阻塞服务启动）
  log_dir: ./logs
  log_level: INFO
  cors_origins: ["*"]

# ---------------------------------------------------------------------------
# 路径
# ---------------------------------------------------------------------------
paths:
  models_root: D:/modelscope      # 所有本地模型的根目录
  data_dir: ./data                # 知识库源文件目录（data/kb/<role_id>/*.md）
  cache_dir: ./data_cache         # 运行期缓存（分词过滤表、入库中间产物）
  web_dir: ./web                  # 零依赖前端静态目录

# ---------------------------------------------------------------------------
# 本地模型
# ---------------------------------------------------------------------------
models:
  embedder:
    path: D:/modelscope/bge-m3    # BGE-M3：稠密 1024 维 + 稀疏 lexical 权重
    device: cuda
    dtype: float16
    max_length: 512
    batch_size: 8
    dense_dim: 1024
    sparse_min_weight: 0.02       # 稀疏权重低于该值的 token 直接丢弃
    sparse_top_terms: 192         # 每个入库 chunk 保留的最大稀疏词数
    query_sparse_top_terms: 48    # 查询侧保留的稀疏词数
  llm:
    path: D:/modelscope/Qwen3-0.6B
    device: cuda
    dtype: float16
    max_new_tokens: 700
    temperature: 0.35
    top_p: 0.85
    repetition_penalty: 1.08
    enable_thinking: false        # Qwen3 思考模式，0.6B 下关闭更稳定
    max_input_tokens: 7000
    max_context_chars: 7000       # 拼进提示词的知识片段总字符上限

# ---------------------------------------------------------------------------
# Milvus：向量库（稠密 + 稀疏双字段，原生支持 hybrid_search）
# ---------------------------------------------------------------------------
milvus:
  uri: http://127.0.0.1:19530
  token: ""
  kb_collection: role_kb_chunks      # 知识块
  memory_collection: role_memory     # 长期记忆
  dense_index:
    index_type: HNSW
    metric_type: COSINE
    M: 16
    efConstruction: 200
  sparse_index:
    index_type: SPARSE_INVERTED_INDEX
    metric_type: IP
  search:
    ef: 128
    timeout: 30

# ---------------------------------------------------------------------------
# Redis：聊天记录 + 短期记忆 + 检索缓存 + 用户会话
# 使用的数据结构：String / Hash / List / Set / zSet 五类
# ---------------------------------------------------------------------------
redis:
  host: 127.0.0.1
  port: 6379
  password: "123456"
  db: 0
  prefix: "rolerag:"
  socket_timeout: 5
  history_ttl: 604800       # 会话记录保留 7 天
  summary_ttl: 604800       # 会话摘要同步过期
  cache_ttl: 900            # 检索结果缓存 15 分钟
  online_ttl: 300           # 在线状态心跳窗口（秒）
  rate_limit_per_min: 60    # 单用户每分钟最大提问次数

# ---------------------------------------------------------------------------
# 记忆策略
# ---------------------------------------------------------------------------
memory:
  short_term_turns: 5        # 进上下文的最近轮数（1 轮 = 用户 + 助手）
  summary_trigger_turns: 5   # 会话超过该轮数时触发摘要刷新
  long_term_top_k: 4         # 长期记忆向量召回条数
  long_term_min_score: 0.35  # 长期记忆相似度阈值
  write_back: true           # 是否把抽取到的事实写回长期记忆
  extract_rules: true        # 规则式事实抽取（"我叫..." / "请记住..."）

# ---------------------------------------------------------------------------
# 入库（分块）
# ---------------------------------------------------------------------------
ingest:
  chunk_size: 700            # 目标块长度（字符）
  chunk_overlap: 120         # 相邻块重叠字符
  min_chunk_chars: 80        # 小于该长度且无可合并对象的块丢弃
  max_chunk_chars: 1400      # 硬上限，超长再切
  batch_size: 16             # 向量化批大小
  include_shared: true       # 公共知识库是否对所有角色可见

# ---------------------------------------------------------------------------
# 检索：三路召回 + 加权 RRF 融合
# ---------------------------------------------------------------------------
retrieval:
  top_k_dense: 20
  top_k_sparse: 20
  top_k_bm25: 20
  final_k: 6
  rrf_k: 60
  weights:
    dense: 0.55
    sparse: 0.30
    bm25: 0.15
  per_doc_limit: 3           # 同一文档最多贡献的块数
  min_final_score: 0.0
  cache_enabled: true
  bm25_refresh_seconds: 60   # 内存 BM25 索引的版本检查间隔

# ---------------------------------------------------------------------------
# 问答编排
# ---------------------------------------------------------------------------
rag:
  rewrite_enabled: false     # 查询改写（需要多一轮生成，0.6B 下默认关闭）
  rewrite_max_tokens: 96
  include_references_when_uncited: true   # 模型未标注引用时，仍返回候选参考片段

# ---------------------------------------------------------------------------
# 安全与多用户
# ---------------------------------------------------------------------------
security:
  secret: "change-me-in-production"   # 令牌签名密钥，生产环境必须修改
  token_ttl: 43200                    # 令牌有效期（秒）= 12 小时
  password_iterations: 120000         # PBKDF2 迭代次数
  users_seed:                         # 首次启动时写入 Redis，之后不再覆盖
    - username: admin
      password: "admin123"
      display_name: 管理员
      roles: ["*"]
      is_admin: true
    - username: alice
      password: "alice123"
      display_name: 小艾
      roles: [financial_planner, scientist, lawyer]
    - username: bob
      password: "bob123"
      display_name: 小博
      roles: [scientist, lawyer]
    - username: carol
      password: "carol123"
      display_name: 小卡
      roles: [financial_planner]
