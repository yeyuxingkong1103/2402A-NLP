<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知海 · 法律问答</title>
<style>
:root{
  /* === 海洋色板 === */
  --bg:#ecf5f9;
  --bg-2:#dcebf3;
  --card:#ffffff;
  --card-2:#f5fafd;
  --ink:#13394f;
  --ink-2:#375d74;
  --muted:#6e94a8;
  --muted-2:#9eb6c3;
  --sea:#3e8fb0;
  --sea-deep:#1f5f7f;
  --sea-soft:rgba(62,143,176,.1);
  --foam:#c5e4ee;
  --coral:#ff8b6a;
  --coral-soft:rgba(255,139,106,.1);
  --sand:#f4ead3;
  --danger:#e25c4c;
  --line:rgba(31,95,127,.1);
  --line-2:rgba(31,95,127,.22);
  --shadow:0 10px 30px rgba(31,95,127,.08);
  --shadow-lg:0 20px 50px rgba(31,95,127,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:radial-gradient(circle at 15% 0%,rgba(62,143,176,.08),transparent 45%),var(--bg);
  color:var(--ink);font-size:15px;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}

.app{display:grid;grid-template-columns:260px 1fr 320px;height:100dvh;overflow:hidden}

/* === 左侧栏：碧海潮汐 === */
.side{
  display:flex;flex-direction:column;overflow:hidden;
  background:
    radial-gradient(120% 55% at 50% -10%, rgba(168,218,220,.5), transparent 60%),
    linear-gradient(180deg,#dbedf4 0%,#e8f3f8 35%,#f2f9fc 100%);
  border-right:1px solid var(--line);
  padding:16px 12px 12px;
}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px 14px;flex-shrink:0}
.logo-mark{
  width:36px;height:36px;border-radius:11px;
  background:linear-gradient(135deg,#5bb6d4,#2b7fa3);
  color:#fff;display:grid;place-items:center;
  box-shadow:0 6px 16px rgba(43,127,163,.28);
  position:relative;overflow:hidden;
}
.logo-mark::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.4), transparent 60%);
}
.logo b{font-size:15px;letter-spacing:.03em;display:block}
.logo small{color:var(--muted);font-size:10px;letter-spacing:.15em;text-transform:uppercase}

/* === 用户切换器 === */
.user-switcher{position:relative;flex-shrink:0;margin-bottom:10px}
.user-chip{
  display:grid;grid-template-columns:32px 1fr 16px;align-items:center;gap:9px;
  width:100%;padding:8px 10px;border-radius:12px;
  background:linear-gradient(135deg,#ffffff,rgba(255,255,255,.75));
  border:1px solid rgba(62,143,176,.22);
  box-shadow:0 4px 12px rgba(43,127,163,.08);
  text-align:left;transition:.18s;
}
.user-chip:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(43,127,163,.14);border-color:var(--sea)}
.user-av{
  display:grid;place-items:center;width:32px;height:32px;border-radius:9px;
  background:linear-gradient(135deg,#5bb6d4,#2b7fa3);
  color:#fff;font-weight:700;font-size:13px;
}
.user-txt{min-width:0}
.user-nm{display:block;font-size:13px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-sub{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}
.user-chev{color:var(--muted);transition:.18s}
.user-chip:hover .user-chev{color:var(--sea);transform:translateY(1px)}

.user-pop{
  position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:30;
  background:#fff;border:1px solid var(--line-2);border-radius:12px;
  box-shadow:0 20px 44px rgba(31,95,127,.16);
  padding:6px;display:none;overflow:hidden;
}
.user-pop.on{display:block;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.user-pop-h{padding:6px 10px 4px;font-size:10.5px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.user-pop-list{max-height:220px;overflow-y:auto;display:grid;gap:2px;margin-bottom:4px}
.user-pop-item{
  display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:8px;
  padding:7px 8px;border-radius:9px;text-align:left;width:100%;transition:.14s;
}
.user-pop-item:hover{background:var(--sea-soft)}
.user-pop-item.on{background:var(--sea-soft)}
.user-pop-item .av{
  display:grid;place-items:center;width:26px;height:26px;border-radius:7px;
  background:linear-gradient(135deg,#a8dadc,#5bb6d4);color:#fff;font-size:11.5px;font-weight:700;
}
.user-pop-item.on .av{background:linear-gradient(135deg,#5bb6d4,#2b7fa3)}
.user-pop-item .nm{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-pop-item .ck{color:var(--sea);font-size:13px;opacity:0}
.user-pop-item.on .ck{opacity:1}
.user-add{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;padding:8px;border-radius:9px;
  border:1px dashed var(--line-2);color:var(--sea-deep);font-size:12.5px;
  transition:.16s;
}
.user-add:hover{background:var(--sea-soft);border-style:solid;border-color:var(--sea)}

.btn-new{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;height:40px;border-radius:11px;flex-shrink:0;
  border:1px solid var(--sea);color:#fff;
  background:linear-gradient(135deg,#5bb6d4,#2b7fa3);
  font-weight:500;transition:.18s;
  box-shadow:0 6px 16px rgba(43,127,163,.2);
}
.btn-new:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(43,127,163,.3)}

.sec{margin:16px 8px 7px;color:var(--muted-2);font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;flex-shrink:0}

.list{
  display:grid;gap:3px;overflow-y:auto;min-height:0;
  align-content:start;
  grid-auto-rows:min-content;
}
.list::-webkit-scrollbar{width:5px}
.list::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px}
.list.hist{flex:1;max-height:none}
.list.roles{max-height:170px;flex-shrink:0}
.list.kbs{flex-shrink:0}

.item{
  display:grid;align-items:center;gap:8px;
  padding:8px 9px;border-radius:10px;
  border:1px solid transparent;
  transition:.16s;cursor:pointer;text-align:left;width:100%;min-width:0;
}
.item:hover{background:rgba(62,143,176,.08)}
.item.on{
  background:linear-gradient(135deg,#ffffff,rgba(255,255,255,.7));
  border-color:rgba(62,143,176,.3);
  box-shadow:0 3px 10px rgba(43,127,163,.09);
}

/* 角色 */
.item.role{grid-template-columns:30px 1fr}
.avatar{
  display:grid;place-items:center;width:30px;height:30px;border-radius:9px;
  background:linear-gradient(135deg,#7cc9e0,#3e8fb0);
  color:#fff;font-weight:700;font-size:12.5px;flex-shrink:0;
}
.role .nm{font-size:13px;font-weight:500}
.role .tp{font-size:10.5px;color:var(--muted);margin-top:1px}

/* 历史 */
.item.hist{grid-template-columns:1fr auto;padding:7px 9px;min-height:0}
.hist-ttl{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-meta{font-size:10.5px;color:var(--muted);margin-top:2px;display:flex;gap:6px;overflow:hidden}
.hist-meta .r{color:var(--sea-deep);font-weight:500}
.hist-del{
  width:22px;height:22px;border-radius:6px;display:grid;place-items:center;
  color:var(--muted-2);font-size:13px;opacity:0;transition:.16s;
}
.item.hist:hover .hist-del{opacity:1}
.hist-del:hover{color:var(--danger);background:rgba(226,92,76,.1)}
.empty-tip{padding:10px;color:var(--muted-2);font-size:11.5px;text-align:center}

/* 知识库 */
.item.kb{grid-template-columns:28px 1fr auto}
.kb-ic{
  width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(255,139,106,.16),rgba(255,139,106,.08));
  color:var(--coral);
}
.kb-nm{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kb-ct{font-size:10.5px;color:var(--muted-2)}

.foot{
  margin-top:10px;padding:11px 8px 2px;border-top:1px solid var(--line);flex-shrink:0;
}
.foot .st{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11.5px}
.dot{width:6px;height:6px;border-radius:50%;background:#3fb98a;box-shadow:0 0 0 3px rgba(63,185,138,.15)}
.dot.bad{background:var(--danger);box-shadow:0 0 0 3px rgba(226,92,76,.15)}
.foot .info{margin-top:5px;color:var(--muted-2);font-family:ui-monospace,Consolas,monospace;font-size:10.5px}

/* === 中间主区：晴空海面 === */
.main{
  display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;position:relative;
  background:
    radial-gradient(80% 40% at 50% 100%, rgba(168,218,220,.35), transparent 60%),
    linear-gradient(rgba(62,143,176,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(62,143,176,.045) 1px,transparent 1px),
    linear-gradient(180deg,#f5fbfd 0%,#ffffff 60%);
  background-size:auto,26px 26px,26px 26px,auto;
}
.top{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  height:62px;padding:0 22px;flex-shrink:0;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.75);backdrop-filter:blur(12px);z-index:2;
}
.top .t1{font-size:14.5px;font-weight:600}
.top .t2{font-size:11.5px;color:var(--muted);margin-top:2px}
.acts{display:flex;gap:7px}
.ib{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  border:1px solid var(--line);color:var(--muted);background:rgba(255,255,255,.6);
  transition:.16s;
}
.ib:hover{color:var(--sea-deep);border-color:var(--sea);background:var(--sea-soft)}
.only-m{display:none}

.chat{
  flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:26px clamp(20px,5vw,60px) 170px;
  scroll-behavior:smooth;
}
.chat::-webkit-scrollbar{width:8px}
.chat::-webkit-scrollbar-thumb{background:rgba(62,143,176,.22);border-radius:4px}

.welcome{max-width:720px;margin:0 auto 26px}
.w-tag{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;
  background:linear-gradient(135deg,rgba(62,143,176,.14),rgba(168,218,220,.14));
  color:var(--sea-deep);font-size:11.5px;font-weight:600;
  margin-bottom:14px;
}
.w-tag i{width:5px;height:5px;border-radius:50%;background:var(--sea);display:block}
.welcome h2{
  font-size:clamp(22px,3vw,32px);font-weight:600;line-height:1.35;letter-spacing:-.02em;
  color:var(--ink);font-family:"Songti SC","STSong",serif;
  background:linear-gradient(135deg,#1f5f7f,#3e8fb0 60%,#5bb6d4);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.welcome p{margin:12px 0 20px;color:var(--muted);font-size:13.5px;line-height:1.75;max-width:560px}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.card{
  padding:14px;border-radius:13px;border:1px solid var(--line);
  background:linear-gradient(160deg,#ffffff 0%,#f5fafd 100%);
  text-align:left;line-height:1.5;
  transition:.2s;font-size:12.5px;color:var(--ink-2);
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,#5bb6d4,#a8dadc);
  opacity:.7;
}
.card:hover{transform:translateY(-2px);border-color:rgba(62,143,176,.35);box-shadow:var(--shadow-lg)}
.card span{display:block;color:var(--sea-deep);font-size:11px;font-weight:600;margin-bottom:6px}

.msgs{display:grid;gap:22px;max-width:720px;margin:0 auto}
.msg{display:grid;grid-template-columns:32px 1fr;gap:11px;animation:fade .3s ease both}
.msg.u{grid-template-columns:1fr 32px}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg .av{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  font-size:12px;font-weight:700;color:#fff;flex-shrink:0;
  background:linear-gradient(135deg,#7cc9e0,#3e8fb0);
  box-shadow:0 3px 8px rgba(62,143,176,.18);
}
.msg.u .av{background:linear-gradient(135deg,#8bb4c4,#5f8496)}
.msg.u .bd{justify-self:end}
.bd{min-width:0;max-width:100%}
.bub{
  display:inline-block;max-width:100%;padding:12px 15px;border-radius:4px 14px 14px 14px;
  background:#fff;border:1px solid var(--line);
  font-size:14px;line-height:1.75;color:var(--ink);word-break:break-word;
  box-shadow:0 3px 12px rgba(31,95,127,.06);
}
.msg.u .bub{
  border-radius:14px 4px 14px 14px;
  background:linear-gradient(135deg,#5bb6d4,#3e8fb0);
  color:#fff;border-color:transparent;
  box-shadow:0 6px 16px rgba(62,143,176,.25);
}
.msg.u .bub a,.msg.u .bub p{color:#fff}
.bub p{margin:0}
.bub p+p{margin-top:8px}
.cite{
  display:inline-grid;place-items:center;min-width:18px;height:18px;margin:0 2px;
  border-radius:5px;
  background:linear-gradient(135deg,rgba(255,139,106,.16),rgba(255,139,106,.08));
  color:#d16a4a;
  border:1px solid rgba(255,139,106,.35);font-size:10.5px;font-weight:600;
  vertical-align:1px;cursor:pointer;padding:0 4px;
}
.meta{display:flex;gap:12px;align-items:center;margin-top:7px;color:var(--muted-2);font-size:11px}
.meta button{color:var(--muted-2);font-size:11px}
.meta button:hover{color:var(--sea-deep)}

.typing{display:inline-flex;gap:4px;padding:6px 0}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--sea);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,70%,100%{opacity:.25}35%{opacity:1}}

.compose-wrap{
  position:absolute;left:0;right:0;bottom:0;
  padding:30px clamp(20px,5vw,60px) 18px;
  background:linear-gradient(transparent,#ffffff 40%);
  pointer-events:none;
}
.compose-wrap>*{pointer-events:auto}
.composer{
  max-width:720px;margin:0 auto;padding:8px 10px 8px 14px;
  border:1px solid var(--line-2);border-radius:16px;
  background:#fff;box-shadow:0 8px 28px rgba(31,95,127,.1);
  transition:.2s;
}
.composer:focus-within{
  border-color:var(--sea);
  box-shadow:0 12px 36px rgba(62,143,176,.16),0 0 0 3px var(--sea-soft);
}
textarea{
  display:block;width:100%;min-height:42px;max-height:120px;resize:none;
  border:0;outline:0;background:transparent;line-height:1.55;font-size:14px;
}
textarea::placeholder{color:var(--muted-2)}
.cb{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tools{display:flex;gap:2px}
.tb{
  display:flex;align-items:center;gap:6px;padding:0 8px;height:32px;border-radius:8px;
  color:var(--muted);font-size:12px;transition:.16s;
}
.tb:hover{color:var(--sea-deep);background:var(--sea-soft)}
.send{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,#5bb6d4,#2b7fa3);color:#fff;
  transition:.16s;box-shadow:0 4px 12px rgba(62,143,176,.24);
}
.send:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(62,143,176,.34)}
.send:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.note{margin:6px 0 0;text-align:center;color:var(--muted-2);font-size:10.5px}

/* === 右侧栏：落日沙滩 === */
.side-r{
  overflow-y:auto;border-left:1px solid var(--line);
  padding:20px 16px;min-height:0;
  background:
    radial-gradient(120% 40% at 50% 0%, rgba(255,200,170,.28), transparent 60%),
    linear-gradient(180deg,#fdf7e8 0%,#faf3e0 60%,#f7efda 100%);
}
.side-r::-webkit-scrollbar{width:5px}
.side-r::-webkit-scrollbar-thumb{background:rgba(255,139,106,.25);border-radius:3px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sh h3{font-size:13.5px;font-weight:600;color:#8a5a3f}
.sh .cnt{font-size:11px;color:#b88a68}

.src{
  padding:13px;border-radius:12px;margin-bottom:10px;
  background:#fffdf8;border:1px solid rgba(255,139,106,.22);
  position:relative;overflow:hidden;
  transition:.16s;
}
.src::before{
  content:'';position:absolute;top:0;left:0;bottom:0;width:3px;
  background:linear-gradient(180deg,#ff8b6a,#ffb89a);
}
.src:hover{box-shadow:0 6px 18px rgba(255,139,106,.14)}
.src-top{display:flex;justify-content:space-between;gap:6px;margin-bottom:7px;font-size:10.5px}
.src-top .tp{color:#e07a56;font-weight:700;letter-spacing:.06em}
.src-top .sc{color:#8a5a3f;font-family:ui-monospace,Consolas,monospace;font-weight:600}
.src h4{margin:0 0 6px;font-size:12.5px;font-weight:600;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#5a3a28}
.src p{
  display:-webkit-box;overflow:hidden;margin:0;
  color:#8a6a52;font-size:12px;line-height:1.6;
  -webkit-box-orient:vertical;-webkit-line-clamp:3;
}
.src-foot{display:flex;justify-content:space-between;margin-top:9px;color:#b88a68;font-size:10.5px}

.mask{display:none;position:fixed;inset:0;background:rgba(19,57,79,.35);z-index:10}
.toast{
  position:fixed;right:20px;bottom:20px;padding:10px 14px;border-radius:10px;
  background:linear-gradient(135deg,#1f5f7f,#13394f);color:#fff;font-size:12.5px;z-index:50;
  opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;
  box-shadow:0 10px 26px rgba(19,57,79,.3);
}
.toast.on{opacity:1;transform:none}

@media(max-width:1100px){
  .app{grid-template-columns:240px 1fr}
  .side-r{
    position:fixed;top:0;right:0;bottom:0;width:min(340px,88vw);z-index:11;
    transform:translateX(100%);transition:transform .22s;box-shadow:-16px 0 40px rgba(31,95,127,.15);
  }
  .side-r.on{transform:none}
  .only-m{display:grid}
  .mask.on{display:block}
}
@media(max-width:760px){
  .app{display:block}
  .side{
    position:fixed;top:0;left:0;bottom:0;width:min(280px,86vw);z-index:13;
    transform:translateX(-100%);transition:transform .22s;box-shadow:16px 0 40px rgba(31,95,127,.18);
  }
  .side.on{transform:none}
  .main{height:100dvh}
  .top{height:56px;padding:0 12px}
  .top .t2{display:none}
  .chat{padding:20px 14px 160px}
  .cards{grid-template-columns:1fr}
  .compose-wrap{padding:26px 10px 10px}
  .tb span{display:none}
  .note{display:none}
}

/* === 系统日志查看器 === */
#logMask{display:none;position:fixed;inset:0;z-index:50;background:rgba(15,40,55,.42);backdrop-filter:blur(2px)}
#logMask.on{display:block}
.log-modal{
  display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(860px,94vw);height:min(560px,86vh);z-index:51;
  background:#fff;border-radius:14px;box-shadow:0 30px 80px rgba(15,40,55,.35);
  overflow:hidden;flex-direction:column;
  border:1px solid var(--line-2);
}
.log-modal.on{display:flex}
.log-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 16px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#f5fafd,#ffffff);
  flex-shrink:0;
}
.log-title{display:flex;align-items:center;gap:10px;min-width:0}
.log-ic{
  width:34px;height:34px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,#5bb6d4,#2b7fa3);
  position:relative;
}
.log-ic::before{
  content:'';position:absolute;inset:9px;
  background:
    linear-gradient(#fff 1.5px,transparent 1.5px) 0 4px/100% 6px,
    linear-gradient(#fff 1.5px,transparent 1.5px) 0 14px/70% 6px,
    linear-gradient(#fff 1.5px,transparent 1.5px) 0 24px/85% 6px;
}
.log-head h3{font-size:15px;font-weight:600;color:var(--ink)}
.log-head small{color:var(--muted);font-size:11.5px;font-family:ui-monospace,Consolas,monospace}
.log-ctrl{display:flex;align-items:center;gap:6px;flex-shrink:0}
.log-ctrl select,.log-ctrl input{
  height:30px;padding:0 8px;border-radius:7px;border:1px solid var(--line-2);
  background:#fff;font-size:12px;color:var(--ink);
}
.log-ctrl input{width:64px}
.log-btn{
  height:30px;min-width:30px;padding:0 10px;border-radius:7px;
  border:1px solid var(--line-2);background:#fff;color:var(--sea-deep);
  font-size:13px;transition:.16s;display:grid;place-items:center;
}
.log-btn:hover{background:var(--sea-soft);border-color:var(--sea)}
.log-btn.on{background:linear-gradient(135deg,#5bb6d4,#2b7fa3);color:#fff;border-color:transparent}
.log-close{font-size:18px;color:var(--danger)}
.log-body{
  flex:1;overflow:auto;margin:0;padding:14px 16px;
  background:#0e2230;color:#cde6f2;font-family:ui-monospace,"Cascadia Code",Consolas,monospace;
  font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word;
}
.log-body::-webkit-scrollbar{width:8px;height:8px}
.log-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:4px}
.log-body .lv-ERROR{color:#ff8b8b;background:rgba(255,80,80,.08)}
.log-body .lv-WARNING{color:#ffd08a}
.log-body .lv-INFO{color:#9ed8ee}
.log-body .lv-DEBUG{color:#7fa8bd}
.log-foot{
  flex-shrink:0;padding:8px 16px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;
  background:#f5fafd;font-size:11.5px;color:var(--muted);
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="logo">
      <div class="logo-mark">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M5 4h9a5 5 0 015 5v11h-9a5 5 0 01-5-5V4Z" stroke="currentColor" stroke-width="2"/><path d="M9 9h6M9 13h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <div><b>知海</b><small>Legal AI</small></div>
    </div>

    <!-- 用户切换器 -->
    <div class="user-switcher" id="userSwitcher">
      <button class="user-chip" id="userChip" type="button">
        <span class="user-av" id="userAv">U</span>
        <span class="user-txt">
          <span class="user-nm" id="userNm">默认用户</span>
          <span class="user-sub">点击切换用户</span>
        </span>
        <svg class="user-chev" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="user-pop" id="userPop">
        <div class="user-pop-h">切换用户</div>
        <div class="user-pop-list" id="userPopList"></div>
        <button class="user-add" id="userAdd" type="button">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          添加新用户
        </button>
      </div>
    </div>

    <button class="btn-new" id="btnNew">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      新建对话
    </button>

    <div class="sec">历史对话</div>
    <div class="list hist" id="histList"><div class="empty-tip">暂无历史对话</div></div>

    <div class="sec">角色</div>
    <div class="list roles" id="roleList"><div class="empty-tip">加载中…</div></div>

    <div class="sec">知识库</div>
    <div class="list kbs" id="kbList">
      <button class="item kb on" data-n="中国裁判文书数据集">
        <span class="kb-ic">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 5.5A2.5 2.5 0 016.5 3H20v16H6.5A2.5 2.5 0 004 21.5v-16Z" stroke="currentColor" stroke-width="1.8"/><path d="M4 21.5A2.5 2.5 0 016.5 19H20" stroke="currentColor" stroke-width="1.8"/></svg>
        </span>
        <span class="kb-nm">裁判文书数据集</span>
        <span class="kb-ct">500</span>
      </button>
    </div>

    <div class="foot">
      <div class="st"><span class="dot" id="dot"></span><span id="status">初始化中…</span></div>
      <div class="info">embedding / bge-m3</div>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <div style="display:flex;align-items:center;gap:9px;min-width:0">
        <button class="ib only-m" id="btnMenu" aria-label="菜单">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div style="min-width:0">
          <div class="t1" id="ttl">正在加载…</div>
          <div class="t2" id="sub">连接中…</div>
        </div>
      </div>
      <div class="acts">
        <button class="ib only-m" id="btnSrc" aria-label="来源">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 12h6M9 8h6M9 16h4M5 3h14v18H5z" stroke="currentColor" stroke-width="1.8"/></svg>
        </button>
        <button class="ib" id="btnLogs" title="系统日志" aria-label="日志">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h10M4 18h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="18" cy="12" r="2" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
        <button class="ib" id="btnClear" title="新对话">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <section class="chat" id="chat">
      <div class="welcome" id="welcome">
        <div class="w-tag"><i></i><span id="wtag">RAG 智能检索已就绪</span></div>
        <h2>于法理之间，寻一叶风帆的答案。</h2>
        <p>先检索相关裁判文书，再基于原文生成回答。每一处结论都可追溯到具体出处。</p>
        <div class="cards">
          <button class="card" data-q="请概括这批裁判文书涉及的主要案件类型"><span>快速了解</span>请概括这批裁判文书涉及的主要案件类型</button>
          <button class="card" data-q="有哪些常见的法律争议焦点？"><span>查找争议</span>有哪些常见的法律争议焦点？</button>
          <button class="card" data-q="整理一份裁判要点的关键清单"><span>生成清单</span>整理一份裁判要点的关键清单</button>
        </div>
      </div>
      <div class="msgs" id="msgs"></div>
    </section>

    <div class="compose-wrap">
      <form class="composer" id="form">
        <textarea id="input" rows="1" placeholder="输入问题，按 Enter 发送…" disabled></textarea>
        <div class="cb">
          <div class="tools">
            <button class="tb" type="button" id="btnAttach">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M9 12l5.2-5.2a3 3 0 114.2 4.2l-7.8 7.8a5 5 0 11-7.1-7.1l8.2-8.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              <span>添加文件</span>
            </button>
            <button class="tb" type="button" id="btnMode">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M10 14v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              <span id="modeLbl">混合检索</span>
            </button>
          </div>
          <button class="send" type="submit" id="btnSend" disabled aria-label="发送">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12l7-7 7 7M12 5v14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </form>
      <p class="note">Enter 发送 · Shift + Enter 换行 · 回答请结合原文判断</p>
    </div>
  </main>

  <aside class="side-r" id="sideR">
    <div class="sh"><h3>检索来源</h3><span class="cnt" id="cnt">等待提问</span></div>
    <div id="srcList">
      <p style="color:#b88a68;font-size:12px;line-height:1.7">提问后此处将展示命中的裁判文书片段及其相似度。</p>
    </div>
  </aside>
</div>

<div class="mask" id="mask"></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" hidden multiple accept=".pdf,.doc,.docx,.txt,.md">

<!-- 系统日志查看器 -->
<div class="mask" id="logMask"></div>
<div class="log-modal" id="logModal">
  <div class="log-head">
    <div class="log-title">
      <span class="log-ic"></span>
      <div>
        <h3>系统日志</h3>
        <small id="logMeta">日志文件: logs/app.log</small>
      </div>
    </div>
    <div class="log-ctrl">
      <select id="logLevel">
        <option value="">全部级别</option>
        <option value="DEBUG">DEBUG</option>
        <option value="INFO">INFO</option>
        <option value="WARNING">WARNING</option>
        <option value="ERROR">ERROR</option>
      </select>
      <input type="number" id="logN" value="200" min="20" max="2000" title="显示行数">
      <button class="log-btn" id="logRefresh" title="刷新">↻</button>
      <button class="log-btn" id="logAuto" title="自动刷新（每3秒）">Auto</button>
      <button class="log-btn log-close" id="logClose" title="关闭">×</button>
    </div>
  </div>
  <pre class="log-body" id="logBody">点击「刷新」或「Auto」开始查看日志…</pre>
  <div class="log-foot">
    <span id="logCount">0 条</span>
    <span class="log-tip">提示: 大量日志时建议调小行数或选择级别过滤</span>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const el={chat:$('chat'),msgs:$('msgs'),welcome:$('welcome'),input:$('input'),send:$('btnSend'),
  form:$('form'),side:$('side'),sideR:$('sideR'),mask:$('mask'),toast:$('toast'),
  histList:$('histList'),roleList:$('roleList'),ttl:$('ttl'),sub:$('sub'),
  dot:$('dot'),status:$('status'),wtag:$('wtag'),cnt:$('cnt'),srcList:$('srcList'),
  userChip:$('userChip'),userPop:$('userPop'),userPopList:$('userPopList'),
  userNm:$('userNm'),userAv:$('userAv'),userAdd:$('userAdd'),userSwitcher:$('userSwitcher'),
  btnLogs:$('btnLogs'),logMask:$('logMask'),logModal:$('logModal'),logBody:$('logBody'),
  logMeta:$('logMeta'),logCount:$('logCount'),logLevel:$('logLevel'),logN:$('logN'),
  logRefresh:$('logRefresh'),logAuto:$('logAuto'),logClose:$('logClose')};

/* === 内置兜底角色（/roles 拿不到时使用） === */
const DEF_ROLES=[
  {id:'lawyer_friend',name:'金牌律师',type:'律师朋友',greeting:'嘿，我在。先别急，把情况慢慢说给我听。'},
  {id:'npc_opponent',name:'律师知识库',type:'全能律师知识库',greeting:'请说出你想要了解的法律知识吧！'},
  {id:'case_analyst',name:'案例分析师',type:'类案检索与裁判观点分析',greeting:'你好，我是案例分析师。请把案情、争议焦点和证据情况告诉我。'}
];

const uid=()=>(crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2));
const S={
  users:[],currentUserId:'',
  roles:[],role:null,
  sid:'',mode:'hybrid',ready:false
};

const esc=t=>{const d=document.createElement('div');d.textContent=t==null?'':t;return d.innerHTML};
const ini=n=>n?String(n).trim().charAt(0).toUpperCase():'U';
const scrollEnd=()=>requestAnimationFrame(()=>el.chat.scrollTop=el.chat.scrollHeight);

function toast(t){el.toast.textContent=t;el.toast.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.toast.classList.remove('on'),1800)}

function fmt(iso){
  if(!iso)return'';
  const d=new Date(iso);if(isNaN(d))return iso;
  const now=new Date(),pad=n=>String(n).padStart(2,'0');
  if(d.toDateString()===now.toDateString())return pad(d.getHours())+':'+pad(d.getMinutes());
  return (d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}

const roleName=()=>S.role?S.role.name:'AI';
const roleById=id=>S.roles.find(r=>r.id===id)||null;
const userById=id=>S.users.find(u=>u.id===id)||null;
const currentUser=()=>userById(S.currentUserId)||{id:'',name:'默认用户'};

/* ==== 用户 & 会话-用户映射（前端隔离） ==== */
function loadUsers(){
  try{S.users=JSON.parse(localStorage.getItem('rag_users')||'[]')}catch(e){S.users=[]}
  if(!Array.isArray(S.users)||!S.users.length){
    S.users=[{id:uid(),name:'默认用户'}];
  }
  S.currentUserId=localStorage.getItem('rag_current_user')||'';
  if(!S.users.find(u=>u.id===S.currentUserId)){
    S.currentUserId=S.users[0].id;
  }
  localStorage.setItem('rag_users',JSON.stringify(S.users));
  localStorage.setItem('rag_current_user',S.currentUserId);
}
function saveUsers(){
  localStorage.setItem('rag_users',JSON.stringify(S.users));
  localStorage.setItem('rag_current_user',S.currentUserId);
}
function getSessionsMap(){
  try{return JSON.parse(localStorage.getItem('rag_user_sessions')||'{}')||{}}catch(e){return{}}
}
function saveSessionsMap(m){localStorage.setItem('rag_user_sessions',JSON.stringify(m))}
function userSessions(uidKey){
  const m=getSessionsMap();
  return Array.isArray(m[uidKey])?m[uidKey]:[];
}
function rememberSession(sid){
  if(!sid)return;
  const m=getSessionsMap();
  const list=Array.isArray(m[S.currentUserId])?m[S.currentUserId]:[];
  if(!list.includes(sid)){list.unshift(sid);}
  m[S.currentUserId]=list;
  saveSessionsMap(m);
}
function forgetSession(sid){
  const m=getSessionsMap();
  const list=Array.isArray(m[S.currentUserId])?m[S.currentUserId]:[];
  m[S.currentUserId]=list.filter(x=>x!==sid);
  saveSessionsMap(m);
}

function renderUserChip(){
  const u=currentUser();
  el.userAv.textContent=ini(u.name);
  el.userNm.textContent=u.name;
}
function renderUserPop(){
  el.userPopList.innerHTML=S.users.map(u=>
    `<button class="user-pop-item ${u.id===S.currentUserId?'on':''}" data-id="${esc(u.id)}">
      <span class="av">${esc(ini(u.name))}</span>
      <span class="nm">${esc(u.name)}</span>
      <span class="ck">✓</span>
    </button>`).join('');
  el.userPopList.querySelectorAll('.user-pop-item').forEach(b=>{
    b.onclick=()=>switchUser(b.dataset.id);
  });
}
function switchUser(id){
  if(id===S.currentUserId){el.userPop.classList.remove('on');return;}
  S.currentUserId=id;saveUsers();
  renderUserChip();renderUserPop();
  el.userPop.classList.remove('on');
  toast('已切换用户：'+currentUser().name);
  newSession(S.role,{silentToast:true});
}

/* ==== 消息 ==== */
function pushUser(t){
  el.msgs.insertAdjacentHTML('beforeend',
    `<article class="msg u"><div class="bd"><div class="bub"><p>${esc(t)}</p></div></div><div class="av">你</div></article>`);
}
function pushTyping(){
  el.msgs.insertAdjacentHTML('beforeend',
    `<article class="msg" id="tmsg"><div class="av">${esc(ini(roleName()))}</div><div class="bd"><div class="bub"><span class="typing"><i></i><i></i><i></i></span></div></div></article>`);
}
function pushAI(html,srcCnt,sec){
  $('tmsg')?.remove();
  let meta='';
  if(srcCnt!=null&&sec!=null)meta=`<div class="meta"><span>${srcCnt} 个来源 · ${Number(sec).toFixed(1)} 秒</span><button class="cp">复制回答</button></div>`;
  el.msgs.insertAdjacentHTML('beforeend',
    `<article class="msg"><div class="av">${esc(ini(roleName()))}</div><div class="bd"><div class="bub"><p>${html}</p></div>${meta}</div></article>`);
}

function renderSrc(list){
  el.srcList.innerHTML='';
  if(!list||!list.length){
    el.cnt.textContent='无命中';
    el.srcList.innerHTML='<p style="color:#b88a68;font-size:12px;line-height:1.7">本次检索未命中相关片段。</p>';
    return;
  }
  el.cnt.textContent='TOP '+list.length;
  list.forEach((s,i)=>{
    const nm=s.source?String(s.source).split(/[\\/]/).pop():'法律文书';
    const ext=nm.includes('.')?nm.split('.').pop().toUpperCase():'PDF';
    el.srcList.insertAdjacentHTML('beforeend',
      `<article class="src" id="src-${i+1}">
        <div class="src-top"><span class="tp">${esc(ext)}</span><span class="sc">${Number(s.score||0).toFixed(3)}</span></div>
        <h4>${esc(nm)}</h4>
        <p>${esc(s.text||'')}</p>
        <div class="src-foot"><span>片段 #${i+1}</span><span>rank ${i+1}</span></div>
      </article>`);
  });
}

/* ==== 角色 ==== */
async function loadRoles(){
  let loaded=[];
  try{
    const r=await fetch('/roles',{cache:'no-store'}).then(x=>x.json());
    loaded=(Array.isArray(r)&&r.length)?r:[];
  }catch(e){loaded=[]}

  /* 合并策略：以后端为准，但如果后端缺少“案例分析师”，自动补上 */
  const byId={};
  loaded.forEach(r=>{if(r&&r.id)byId[r.id]=r});
  DEF_ROLES.forEach(r=>{if(!byId[r.id])byId[r.id]=r});

  /* 保持展示顺序：律师朋友 → 律师知识库 → 案例分析师 → 其他 */
  const order=['lawyer_friend','npc_opponent','case_analyst'];
  const result=[];
  order.forEach(id=>{if(byId[id]){result.push(byId[id]);delete byId[id];}});
  Object.keys(byId).forEach(id=>result.push(byId[id]));
  S.roles=result;

  const box=el.roleList;
  if(!S.roles.length){box.innerHTML='<div class="empty-tip">暂无角色</div>';return}
  box.innerHTML=S.roles.map(r=>
    `<button class="item role" data-id="${esc(r.id)}">
      <span class="avatar">${esc(ini(r.name))}</span>
      <span><span class="nm">${esc(r.name)}</span><div class="tp">${esc(r.type||'')}</div></span>
    </button>`).join('');
  box.querySelectorAll('.item').forEach(b=>b.onclick=()=>pickRole(b.dataset.id));
  pickRole(S.roles[0].id,true);
}
function pickRole(id,silent){
  const r=roleById(id);if(!r)return;
  S.role=r;
  el.roleList.querySelectorAll('.item').forEach(x=>x.classList.toggle('on',x.dataset.id===id));
  el.ttl.textContent=r.name;
  el.sub.textContent=(r.type||'AI 助手')+' · RAG 智能检索';
  if(silent)return;
  newSession(r);
}
function newSession(r,opt){
  S.sid=uid();rememberSession(S.sid);
  el.msgs.innerHTML='';el.welcome.hidden=false;renderSrc([]);
  if(r&&r.greeting){
    pushAI(esc(r.greeting).replace(/\n/g,'<br>'));
    el.welcome.hidden=true;
  }
  refreshHist();closePanels();
  if(!opt||!opt.silentToast)el.input.focus();
}

/* ==== 历史（按用户隔离） ==== */
async function refreshHist(){
  try{
    const all=await fetch('/conversations',{cache:'no-store'}).then(r=>r.json());
    const mine=userSessions(S.currentUserId);
    const list=(Array.isArray(all)?all:[]).filter(it=>mine.includes(it.session_id));
    renderHist(list);
  }catch(e){renderHist([])}
}
function renderHist(list){
  if(!list.length){el.histList.innerHTML='<div class="empty-tip">该用户暂无历史对话</div>';return}
  el.histList.innerHTML=list.map(it=>{
    const r=roleById(it.role_id);
    return `<div class="item hist ${it.session_id===S.sid?'on':''}" data-id="${esc(it.session_id)}">
      <div style="min-width:0">
        <div class="hist-ttl">${esc(it.title||'新对话')}</div>
        <div class="hist-meta"><span class="r">${esc(r?r.name:(it.role_id||''))}</span><span>· ${fmt(it.updated_at||it.created_at)}</span><span>· ${it.message_count||0}条</span></div>
      </div>
      <button class="hist-del" data-id="${esc(it.session_id)}" title="删除">✕</button>
    </div>`;
  }).join('');
  el.histList.querySelectorAll('.item').forEach(x=>{
    x.onclick=e=>{if(e.target.closest('.hist-del'))return;loadConv(x.dataset.id)};
  });
  el.histList.querySelectorAll('.hist-del').forEach(b=>{
    b.onclick=async e=>{
      e.stopPropagation();
      const sid=b.dataset.id;
      if(!confirm('删除这条对话？不可恢复。'))return;
      await fetch('/conversations/'+encodeURIComponent(sid),{method:'DELETE'});
      forgetSession(sid);
      toast('已删除');
      if(sid===S.sid)newSession(S.role);else refreshHist();
    };
  });
}
async function loadConv(sid){
  try{
    const c=await fetch('/conversations/'+encodeURIComponent(sid),{cache:'no-store'}).then(r=>r.json());
    if(!c||c.error||!c.messages){toast('加载失败');return}
    S.sid=c.session_id;rememberSession(S.sid);
    const r=roleById(c.role_id);
    if(r){
      S.role=r;
      el.roleList.querySelectorAll('.item').forEach(x=>x.classList.toggle('on',x.dataset.id===r.id));
      el.ttl.textContent=r.name;el.sub.textContent=(r.type||'AI 助手')+' · RAG 智能检索';
    }
    el.msgs.innerHTML='';el.welcome.hidden=true;renderSrc([]);
    c.messages.forEach(m=>{
      if(m.role==='user')pushUser(m.content);
      else pushAI(esc(m.content||'').replace(/\n/g,'<br>'));
    });
    const last=[...c.messages].reverse().find(m=>m.role==='assistant'&&m.sources);
    if(last&&last.sources.length)renderSrc(last.sources);
    refreshHist();closePanels();scrollEnd();
  }catch(e){toast('加载失败')}
}

/* ==== 状态 ==== */
function setStatus(t,bad){
  el.status.textContent=t;el.dot.classList.toggle('bad',!!bad);el.wtag.textContent=t;
}
async function checkStatus(){
  try{
    const d=await fetch('/status',{cache:'no-store'}).then(r=>r.json());
    if(d.ready){
      S.ready=true;setStatus('RAG 智能检索已就绪');
      el.input.disabled=false;el.input.placeholder='输入问题，按 Enter 发送…';el.input.focus();
      return;
    }
    if(d.error){setStatus('初始化失败：'+d.error,true);return}
    setStatus(d.step||'初始化中…');
    setTimeout(checkStatus,1500);
  }catch(e){setStatus('连接后端失败',true);setTimeout(checkStatus,2000)}
}

/* ==== 提问 ==== */
async function ask(q){
  if(!q||!q.trim())return;
  if(!S.ready){toast('系统尚未就绪');return}
  if(!S.role){toast('请先选择角色');return}
  el.welcome.hidden=true;pushUser(q);pushTyping();
  el.input.value='';el.input.style.height='auto';el.send.disabled=true;scrollEnd();

  const t0=performance.now();
  let d;
  try{
    d=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:q,role_id:S.role.id,session_id:S.sid,user_id:S.currentUserId,mode:S.mode})}).then(r=>r.json());
  }catch(e){pushAI('请求失败：'+esc(String(e)),0,0);scrollEnd();return}

  if(d.error&&!d.answer){pushAI('处理出错：'+esc(d.error),0,0);scrollEnd();return}
  if(d.session_id&&d.session_id!==S.sid){S.sid=d.session_id;rememberSession(S.sid)}

  const sec=(performance.now()-t0)/1000;
  const list=d.sources||[];
  let html=esc(d.answer||'').replace(/\n/g,'<br>');
  if(list.length){
    html+='<br>'+list.map((_,i)=>`<button class="cite" data-s="src-${i+1}">${i+1}</button>`).join('');
  }
  pushAI(html,list.length,sec);
  renderSrc(list);
  el.send.disabled=!el.input.value.trim();scrollEnd();
  refreshHist();
}

/* ==== 事件 ==== */
el.form.onsubmit=e=>{e.preventDefault();ask(el.input.value)};
el.input.oninput=()=>{
  el.send.disabled=!el.input.value.trim();
  el.input.style.height='auto';
  el.input.style.height=Math.min(el.input.scrollHeight,120)+'px';
};
el.input.onkeydown=e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(el.input.value.trim())el.form.requestSubmit()}
};
document.querySelectorAll('.card').forEach(b=>b.onclick=()=>ask(b.dataset.q));

$('kbList').onclick=e=>{
  const b=e.target.closest('.item.kb');if(!b)return;
  document.querySelectorAll('.item.kb').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');toast('已切换到：'+b.dataset.n);closePanels();
};
$('btnNew').onclick=()=>newSession(S.role);
$('btnClear').onclick=()=>{newSession(S.role);toast('已开始新对话')};

/* ==== 系统日志查看器 ==== */
let _logTimer=null;
function openLogs(){
  el.logMask.classList.add('on');
  el.logModal.classList.add('on');
  fetchLogs();
}
function closeLogs(){
  el.logMask.classList.remove('on');
  el.logModal.classList.remove('on');
  if(_logTimer){clearInterval(_logTimer);_logTimer=null;el.logAuto.classList.remove('on')}
}
async function fetchLogs(){
  const n=parseInt(el.logN.value||'200',10);
  const lv=el.logLevel.value||'';
  try{
    const url=`/logs?n=${encodeURIComponent(n)}${lv?'&level='+encodeURIComponent(lv):''}`;
    const d=await fetch(url,{cache:'no-store'}).then(r=>r.json());
    el.logMeta.textContent=`日志文件: ${d.file||'logs/app.log'}`;
    el.logCount.textContent=`${d.count||0} 条`;
    const lines=d.lines||[];
    if(!lines.length){el.logBody.textContent='（暂无日志）';return}
    /* 高亮级别 */
    const html=lines.map(ln=>{
      const m=/\|\s*(DEBUG|INFO|WARNING|ERROR|CRITICAL)\s*\|/.exec(ln);
      const lvCls=m?`lv-${m[1]}`:'';
      return `<span class="${lvCls}">${esc(ln)}</span>`;
    }).join('\n');
    el.logBody.innerHTML=html;
    el.logBody.scrollTop=el.logBody.scrollHeight;
  }catch(e){
    el.logBody.textContent='加载失败：'+String(e);
    el.logCount.textContent='0 条';
  }
}
el.btnLogs.onclick=openLogs;
el.logClose.onclick=closeLogs;
el.logRefresh.onclick=fetchLogs;
el.logLevel.onchange=fetchLogs;
el.logN.onchange=fetchLogs;
el.logAuto.onclick=()=>{
  if(_logTimer){clearInterval(_logTimer);_logTimer=null;el.logAuto.classList.remove('on');toast('已停止自动刷新');return}
  fetchLogs();
  _logTimer=setInterval(fetchLogs,3000);
  el.logAuto.classList.add('on');
  toast('已开启自动刷新（每3秒）');
};
el.logMask.onclick=closeLogs;
$('btnAttach').onclick=()=>$('file').click();
$('file').onchange=e=>{if(e.target.files.length)toast('已选择 '+e.target.files.length+' 个文件')};
$('btnMode').onclick=()=>{
  S.mode=S.mode==='hybrid'?'vector':'hybrid';
  $('modeLbl').textContent=S.mode==='hybrid'?'混合检索':'向量检索';
  toast('已切换为'+(S.mode==='hybrid'?'混合检索':'向量检索'));
};

el.msgs.onclick=e=>{
  const c=e.target.closest('.cite');
  if(c){
    const t=$(c.dataset.s);if(!t)return;
    el.sideR.classList.add('on');el.mask.classList.add('on');
    t.scrollIntoView({behavior:'smooth',block:'center'});
    t.animate([{outline:'2px solid rgba(255,139,106,.7)'},{outline:'2px solid transparent'}],{duration:1200});
  }
  const cp=e.target.closest('.cp');
  if(cp){
    navigator.clipboard?.writeText(cp.closest('.msg').querySelector('.bub').innerText);
    toast('回答已复制');
  }
};

function closePanels(){el.side.classList.remove('on');el.sideR.classList.remove('on');el.mask.classList.remove('on')}
$('btnMenu').onclick=()=>{closePanels();el.side.classList.add('on');el.mask.classList.add('on')};
$('btnSrc').onclick=()=>{closePanels();el.sideR.classList.add('on');el.mask.classList.add('on')};
el.mask.onclick=closePanels;

/* ==== 用户切换器交互 ==== */
el.userChip.onclick=e=>{
  e.stopPropagation();
  const open=el.userPop.classList.toggle('on');
  if(open)renderUserPop();
};
el.userAdd.onclick=()=>{
  const name=prompt('请输入新用户名：','用户 '+ (S.users.length+1));
  if(!name)return;
  const u={id:uid(),name:name.trim().slice(0,20)||('用户'+(S.users.length+1))};
  S.users.push(u);saveUsers();
  switchUser(u.id);
};
document.addEventListener('click',e=>{
  if(!el.userSwitcher.contains(e.target))el.userPop.classList.remove('on');
});

/* ==== 启动 ==== */
(async()=>{
  loadUsers();
  renderUserChip();
  renderUserPop();
  S.sid=uid();rememberSession(S.sid);
  await checkStatus();
  await loadRoles();
  refreshHist();
})();
</script>
</body>
</html>
