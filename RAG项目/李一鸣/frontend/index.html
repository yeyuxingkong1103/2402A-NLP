<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roleplay Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #17212b;
        --muted: #73808c;
        --line: #e3e7ea;
        --paper: #fbfcfc;
        --panel: #ffffff;
        --navy: #203a4a;
        --teal: #267f82;
        --teal-soft: #e7f2f1;
        --coral: #c96e58;
        --shadow: 0 18px 42px rgba(23, 33, 43, 0.08);
      }
      * { box-sizing: border-box; }
      body { margin: 0; color: var(--ink); background: var(--paper); font-family: "DM Sans", "Noto Sans SC", sans-serif; }
      button, textarea, input { font: inherit; }
      button { cursor: pointer; }
      .app-shell { min-height: 100vh; display: grid; grid-template-columns: 280px minmax(0, 1fr) 300px; }
      .sidebar, .inspector { background: var(--panel); border-color: var(--line); }
      .sidebar { border-right: 1px solid var(--line); padding: 24px 18px; display: flex; flex-direction: column; gap: 24px; }
      .brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px; }
      .brand-mark { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: white; background: var(--navy); font-weight: 700; letter-spacing: 0; }
      .brand strong { display: block; font-size: 15px; letter-spacing: 0; }
      .brand span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
      .section-label { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 0 8px; }
      .role-list { display: grid; gap: 6px; }
      .role-button { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; border-radius: 8px; background: transparent; color: var(--ink); padding: 10px 9px; text-align: left; }
      .role-button:hover { background: #f1f5f5; }
      .role-button.active { color: var(--teal); background: var(--teal-soft); }
      .role-icon { width: 30px; height: 30px; flex: 0 0 auto; border-radius: 8px; display: grid; place-items: center; background: #f0f2f1; color: var(--navy); font-size: 14px; }
      .role-button.active .role-icon { background: white; color: var(--teal); }
      .role-copy { min-width: 0; }
      .role-copy strong, .role-copy span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .role-copy strong { font-size: 13px; }
      .role-copy span { color: var(--muted); font-size: 11px; margin-top: 3px; }
      .sidebar-footer { margin-top: auto; border-top: 1px solid var(--line); padding: 18px 8px 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
      .main { min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
      .topbar { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 34px; border-bottom: 1px solid var(--line); background: rgba(251,252,252,.86); }
      .topbar-title { min-width: 0; }
      .topbar-title h1 { margin: 0; font-size: 19px; letter-spacing: 0; }
      .topbar-title p { margin: 5px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .topbar-actions { display: flex; gap: 8px; }
      .icon-button, .new-chat { border: 1px solid var(--line); background: white; color: var(--navy); border-radius: 7px; min-height: 36px; padding: 0 12px; font-size: 12px; }
      .icon-button:hover, .new-chat:hover { border-color: var(--teal); color: var(--teal); }
      .chat-scroll { flex: 1; overflow: auto; padding: 34px max(24px, 7vw) 22px; }
      .welcome { max-width: 720px; margin: 5vh auto 34px; }
      .eyebrow { display: inline-flex; align-items: center; gap: 7px; color: var(--teal); font-size: 12px; font-weight: 700; }
      .eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--coral); }
      .welcome h2 { margin: 14px 0 9px; font-size: clamp(25px, 3vw, 38px); line-height: 1.18; letter-spacing: 0; }
      .welcome p { color: var(--muted); max-width: 560px; line-height: 1.7; margin: 0; font-size: 14px; }
      .message-list { max-width: 760px; margin: 0 auto; display: grid; gap: 20px; }
      .message { display: flex; gap: 12px; align-items: flex-start; }
      .message.user { flex-direction: row-reverse; }
      .avatar { width: 30px; height: 30px; flex: 0 0 auto; border-radius: 9px; display: grid; place-items: center; color: white; background: var(--navy); font-size: 12px; font-weight: 700; }
      .message.user .avatar { background: var(--coral); }
      .message-content { max-width: min(680px, 82%); }
      .message-meta { color: var(--muted); font-size: 11px; margin: 0 4px 5px; }
      .message.user .message-meta { text-align: right; }
      .bubble { border: 1px solid var(--line); background: white; border-radius: 4px 12px 12px 12px; padding: 13px 15px; line-height: 1.7; font-size: 14px; white-space: pre-wrap; box-shadow: 0 5px 18px rgba(23,33,43,.03); }
      .message.user .bubble { border-color: transparent; border-radius: 12px 4px 12px 12px; color: white; background: var(--navy); }
      .composer-wrap { padding: 14px max(24px, 7vw) 24px; background: linear-gradient(var(--paper), #f5f8f8); }
      .composer { max-width: 760px; margin: 0 auto; border: 1px solid #cfd9da; background: white; border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
      .composer textarea { display: block; width: 100%; min-height: 78px; resize: vertical; border: 0; outline: 0; padding: 15px 16px 8px; color: var(--ink); line-height: 1.6; }
      .composer textarea::placeholder { color: #a5afb5; }
      .composer-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px 10px 15px; }
      .composer-hint { color: var(--muted); font-size: 11px; }
      .send-button { border: 0; border-radius: 7px; background: var(--teal); color: white; min-width: 80px; min-height: 34px; font-size: 12px; font-weight: 700; }
      .send-button:hover { background: #1f6d70; }
      .send-button:disabled { opacity: .5; cursor: wait; }
      .inspector { border-left: 1px solid var(--line); padding: 24px 18px; }
      .inspector h3 { margin: 2px 6px 22px; font-size: 13px; }
      .info-block { border-top: 1px solid var(--line); padding: 16px 6px; }
      .info-block h4 { margin: 0 0 10px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
      .role-profile { display: flex; gap: 10px; align-items: flex-start; }
      .profile-dot { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; background: var(--teal-soft); color: var(--teal); font-weight: 700; }
      .role-profile strong { display: block; font-size: 14px; }
      .role-profile span { display: block; color: var(--muted); font-size: 11px; margin-top: 4px; line-height: 1.5; }
      .status-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; padding: 6px 0; }
      .status-row span:first-child { color: var(--muted); }
      .status-value { color: var(--teal); font-weight: 600; text-align: right; }
      .citations { display: grid; gap: 8px; }
      .citation { border-left: 3px solid var(--coral); padding: 8px 9px; background: #fff8f5; font-size: 11px; line-height: 1.5; }
      .citation strong { display: block; font-size: 11px; margin-bottom: 3px; }
      .empty-note { color: var(--muted); font-size: 12px; line-height: 1.6; }
      .toast { position: fixed; right: 22px; bottom: 22px; max-width: 330px; background: var(--navy); color: white; padding: 11px 14px; border-radius: 7px; box-shadow: var(--shadow); font-size: 12px; opacity: 0; transform: translateY(8px); transition: .2s ease; pointer-events: none; }
      .toast.show { opacity: 1; transform: translateY(0); }
      @media (max-width: 1050px) { .app-shell { grid-template-columns: 235px minmax(0, 1fr); } .inspector { display: none; } }
      @media (max-width: 680px) { .app-shell { display: block; } .sidebar { border-right: 0; border-bottom: 1px solid var(--line); padding: 14px; } .sidebar .section-label, .sidebar-footer { display: none; } .role-list { display: flex; overflow-x: auto; padding-bottom: 2px; } .role-button { min-width: 185px; } .topbar { padding: 15px 16px; } .chat-scroll { padding: 23px 16px 16px; } .welcome { margin: 3vh auto 28px; } .composer-wrap { padding: 10px 16px 17px; } .message-content { max-width: 86%; } }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><div class="brand-mark">R</div><div><strong>Roleplay Studio</strong><span>RAG conversation workspace</span></div></div>
        <div><div class="section-label">角色</div><div id="roleList" class="role-list"></div></div>
        <div class="sidebar-footer">知识库检索、角色设定与多轮记忆均由当前后端服务提供。<br />当前模式：本地演示模型</div>
      </aside>
      <main class="main">
        <header class="topbar"><div class="topbar-title"><h1 id="roleTitle">正在连接角色...</h1><p id="roleDescription">正在读取角色配置</p></div><div class="topbar-actions"><button class="icon-button" id="apiButton" title="打开接口文档">API 文档</button><button class="new-chat" id="newChatButton">新会话</button></div></header>
        <section class="chat-scroll" id="chatScroll"><div class="welcome" id="welcome"><div class="eyebrow">READY TO TALK</div><h2>把问题交给一个<br />真正有设定的角色。</h2><p>选择左侧角色开始对话。每次回答都会结合角色提示词、知识库检索和当前会话记忆。</p></div><div class="message-list" id="messageList"></div></section>
        <div class="composer-wrap"><form class="composer" id="chatForm"><textarea id="messageInput" placeholder="输入你的问题，按 Enter 发送，Shift + Enter 换行" maxlength="10000"></textarea><div class="composer-toolbar"><span class="composer-hint" id="composerHint">连接中...</span><button class="send-button" id="sendButton" type="submit">发送</button></div></form></div>
      </main>
      <aside class="inspector"><h3>会话信息</h3><div class="info-block"><h4>当前角色</h4><div class="role-profile"><div class="profile-dot" id="profileDot">R</div><div><strong id="profileName">-</strong><span id="profileExpertise">-</span></div></div></div><div class="info-block"><h4>运行状态</h4><div class="status-row"><span>API 服务</span><span class="status-value" id="apiStatus">检测中</span></div><div class="status-row"><span>向量库</span><span class="status-value" id="vectorStatus">检测中</span></div><div class="status-row"><span>短期记忆</span><span class="status-value" id="memoryStatus">检测中</span></div></div><div class="info-block"><h4>本轮引用</h4><div id="citations" class="citations"><div class="empty-note">发送消息后，这里会显示召回的知识片段。</div></div></div></aside>
    </div>
    <div class="toast" id="toast"></div>
    <script>
      const API_BASE = new URLSearchParams(location.search).get("api") || "http://127.0.0.1:8000";
      const state = { roles: [], role: null, userId: localStorage.getItem("rag_user_id") || "demo-user", conversationId: localStorage.getItem("rag_conversation_id") || crypto.randomUUID(), busy: false };
      const $ = (id) => document.getElementById(id);
      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[char]));
      function toast(message) { const el = $("toast"); el.textContent = message; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 3200); }
      function roleInitial(role) { return (role?.name || "R").slice(0, 1); }
      function setStatus(id, value, good = true) { const el = $(id); el.textContent = value; el.style.color = good ? "var(--teal)" : "var(--coral)"; }
      function renderRoles() { $("roleList").innerHTML = state.roles.map((role) => `<button class="role-button ${state.role?.id === role.id ? "active" : ""}" data-role-id="${role.id}"><span class="role-icon">${escapeHtml(roleInitial(role))}</span><span class="role-copy"><strong>${escapeHtml(role.name)}</strong><span>${escapeHtml(role.category)}</span></span></button>`).join(""); document.querySelectorAll("[data-role-id]").forEach((button) => button.addEventListener("click", () => selectRole(button.dataset.roleId))); }
      function renderRole() { const role = state.role; if (!role) return; $("roleTitle").textContent = role.name; $("roleDescription").textContent = role.description || role.expertise; $("profileName").textContent = role.name; $("profileExpertise").textContent = role.expertise || role.description; $("profileDot").textContent = roleInitial(role); renderRoles(); }
      function addMessage(kind, content, pending = false) { $("welcome").style.display = "none"; const row = document.createElement("div"); row.className = `message ${kind}`; row.innerHTML = `<div class="avatar">${kind === "user" ? "你" : escapeHtml(roleInitial(state.role))}</div><div class="message-content"><div class="message-meta">${kind === "user" ? "你" : escapeHtml(state.role?.name || "角色")}</div><div class="bubble ${pending ? "pending" : ""}">${escapeHtml(content)}</div></div>`; $("messageList").appendChild(row); $("chatScroll").scrollTop = $("chatScroll").scrollHeight; return row.querySelector(".bubble"); }
      function renderCitations(citations = []) { $("citations").innerHTML = citations.length ? citations.map((item) => `<div class="citation"><strong>${escapeHtml(item.filename || item.source || "知识库片段")}</strong><span>${escapeHtml((item.content || "").slice(0, 160))}${(item.content || "").length > 160 ? "..." : ""}</span></div>`).join("") : `<div class="empty-note">本轮没有召回知识片段。</div>`; }
      async function loadHealth() { try { const response = await fetch(`${API_BASE}/api/v1/health`); if (!response.ok) throw new Error(); const data = await response.json(); setStatus("apiStatus", "在线"); setStatus("vectorStatus", data.components?.vector_store?.backend || "可用"); setStatus("memoryStatus", data.components?.memory || "本地"); $("composerHint").textContent = `已连接 · ${data.components?.llm || "模型"}`; } catch { setStatus("apiStatus", "离线", false); setStatus("vectorStatus", "未连接", false); setStatus("memoryStatus", "未连接", false); $("composerHint").textContent = "请先启动后端服务"; } }
      async function loadRoles() { try { const response = await fetch(`${API_BASE}/api/v1/roles`); if (!response.ok) throw new Error(); state.roles = await response.json(); state.role = state.roles[0]; renderRole(); } catch { $("roleList").innerHTML = `<div class="empty-note" style="padding:8px">角色列表加载失败，请确认后端已启动。</div>`; toast("无法读取角色列表"); } }
      async function selectRole(roleId) { const role = state.roles.find((item) => item.id === roleId); if (!role || state.busy) return; state.role = role; state.conversationId = crypto.randomUUID(); localStorage.setItem("rag_conversation_id", state.conversationId); $("messageList").innerHTML = ""; $("welcome").style.display = "block"; renderRole(); renderCitations([]); }
      async function sendMessage(event) { event.preventDefault(); if (state.busy) return; const input = $("messageInput"); const message = input.value.trim(); if (!message || !state.role) return; state.busy = true; $("sendButton").disabled = true; input.value = ""; addMessage("user", message); const bubble = addMessage("assistant", "正在检索知识库并准备回答..."); try { const response = await fetch(`${API_BASE}/api/v1/chat`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ user_id: state.userId, role_id: state.role.id, conversation_id: state.conversationId, message, stream: true }) }); if (!response.ok || !response.body) throw new Error(`请求失败 ${response.status}`); const reader = response.body.getReader(); const decoder = new TextDecoder(); let buffer = ""; let answer = ""; while (true) { const { value, done } = await reader.read(); if (done) break; buffer += decoder.decode(value, { stream: true }); const events = buffer.split("\n\n"); buffer = events.pop(); for (const eventText of events) { const line = eventText.split("\n").find((line) => line.startsWith("data:")); if (!line) continue; const eventData = JSON.parse(line.slice(5).trim()); if (eventData.type === "meta") renderCitations(eventData.citations || []); if (eventData.type === "token") { answer += eventData.content || ""; bubble.textContent = answer; $("chatScroll").scrollTop = $("chatScroll").scrollHeight; } } } if (!answer) bubble.textContent = "本轮没有生成回答。"; } catch (error) { bubble.textContent = "暂时无法完成回答，请检查后端服务和日志。"; toast(error.message || "聊天请求失败"); } finally { state.busy = false; $("sendButton").disabled = false; input.focus(); } }
      $("chatForm").addEventListener("submit", sendMessage); $("messageInput").addEventListener("keydown", (event) => { if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); $("chatForm").requestSubmit(); } }); $("newChatButton").addEventListener("click", () => { if (state.busy) return; state.conversationId = crypto.randomUUID(); localStorage.setItem("rag_conversation_id", state.conversationId); $("messageList").innerHTML = ""; $("welcome").style.display = "block"; renderCitations([]); }); $("apiButton").addEventListener("click", () => window.open(`${API_BASE}/docs`, "_blank")); loadRoles(); loadHealth();
    </script>
  </body>
</html>
