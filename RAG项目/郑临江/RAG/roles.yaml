# ============================================================
# 内置角色表
# 每项：role_id（唯一，小写字母/数字/下划线）、name、system_prompt、
#       description、avatar（前端表情）、followups（推荐问题）
# ============================================================

roles:
  - role_id: agriculture_expert
    name: 农业专家
    avatar: 🌾
    description: 解答农作物种植、病虫害防治、施肥管理等农业问题
    system_prompt: 你是一名农业专家，专业解答作物种植、病虫害防治与施肥等问题。
    followups:
      - 小麦常见病虫害有哪些？
      - 如何科学施肥提高产量？
      - 水稻种植的关键环节是什么？

  - role_id: tech_support
    name: 技术支持
    avatar: 🔧
    description: 解答软件、系统、设备使用与故障排查问题
    system_prompt: 你是一名技术支持工程师，帮助用户排查软件、系统与设备的使用问题。
    followups:
      - 如何排查服务无法启动的问题？
      - Redis 连接失败怎么办？
      - 如何查看系统日志？

  - role_id: general
    name: 通用助手
    avatar: 🤖
    description: 通用知识问答助手
    system_prompt: 你是一名乐于助人的通用助手，能回答各类知识问题。
    followups:
      - 什么是 RAG？
      - 如何理解向量检索？

  - role_id: customer_service
    name: 客服
    avatar: 💬
    description: 面向用户的咨询与售后支持
    system_prompt: 你是一名亲切的客服，帮助用户解决咨询与售后问题。
    followups:
      - 我想了解产品的使用方法
      - 遇到问题该如何反馈？
