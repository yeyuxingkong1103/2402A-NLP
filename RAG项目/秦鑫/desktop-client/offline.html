<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>法衡桌面端</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(180deg, #22352d, #16211d);
        color: #f4efe3;
      }
      main {
        width: min(560px, calc(100vw - 32px));
        padding: 28px;
        border: 1px solid rgba(244, 239, 227, .18);
        border-radius: 14px;
        background: rgba(10, 18, 15, .78);
        box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
      }
      h1 { margin: 0 0 10px; font-size: 22px; }
      p { margin: 0 0 14px; color: rgba(244, 239, 227, .78); line-height: 1.7; }
      label { display: grid; gap: 8px; margin-top: 14px; font-size: 12px; font-weight: 700; }
      input {
        width: 100%;
        padding: 12px 14px;
        color: #1f241f;
        border: 1px solid rgba(255, 255, 255, .18);
        border-radius: 10px;
        background: #fff;
        font-size: 14px;
      }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
      button {
        padding: 11px 14px;
        border: 0;
        border-radius: 10px;
        background: #c5a45f;
        color: #18211c;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
      }
      button.secondary { background: transparent; color: #eadbb7; border: 1px solid rgba(234, 219, 183, .22); }
      .meta { margin-top: 14px; color: rgba(244, 239, 227, .56); font-size: 12px; word-break: break-all; }
      .status { min-height: 18px; margin-top: 10px; color: #f0d89f; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>无法连接到法衡服务</h1>
      <p>后端没有在当前地址响应。确认 Docker 服务已启动，再把下面的地址改成正确的后端入口。</p>
      <label for="server-url">后端地址</label>
      <input id="server-url" type="url" placeholder="http://127.0.0.1:7294" spellcheck="false" />
      <div class="actions">
        <button id="connect-button" type="button">重新连接</button>
        <button id="browser-button" type="button" class="secondary">用浏览器打开</button>
      </div>
      <div class="status" id="status"></div>
      <div class="meta" id="meta"></div>
    </main>
    <script>
      const serverUrlInput = document.getElementById("server-url");
      const statusNode = document.getElementById("status");
      const metaNode = document.getElementById("meta");
      const connectButton = document.getElementById("connect-button");
      const browserButton = document.getElementById("browser-button");

      function setStatus(message) {
        if (statusNode) statusNode.textContent = message || "";
      }

      function setMeta(text) {
        if (metaNode) metaNode.textContent = text || "";
      }

      async function refreshConfig() {
        if (!window.lawragDesktop?.getConfig) return;
        const config = await window.lawragDesktop.getConfig();
        if (serverUrlInput && config?.serverUrl) serverUrlInput.value = config.serverUrl;
        if (config?.configFile) setMeta(`配置文件：${config.configFile}`);
      }

      async function reconnect() {
        const value = serverUrlInput?.value || "";
        setStatus("正在重新连接…");
        try {
          if (!window.lawragDesktop?.applyServerUrl) throw new Error("桌面桥不可用");
          await window.lawragDesktop.applyServerUrl(value);
        } catch (error) {
          setStatus(error?.message || "重新连接失败");
          return;
        }
      }

      connectButton?.addEventListener("click", reconnect);
      browserButton?.addEventListener("click", async () => {
        const value = serverUrlInput?.value || "";
        if (!window.lawragDesktop?.openExternal) return;
        await window.lawragDesktop.openExternal(value || "http://127.0.0.1:7294");
      });
      serverUrlInput?.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          reconnect();
        }
      });

      refreshConfig().then(() => setStatus(""));
    </script>
  </body>
</html>
