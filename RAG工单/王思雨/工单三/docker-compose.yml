# 工单编号：人工智能NLP-RAG-PDF文档的表格解析及检索优化
# 文件说明：仅编排本系统依赖的 Milvus（etcd + minio + milvus）与 Redis。
# 注意：本机 19530/6379 已被既有容器占用，请勿重复 up；直接复用现成服务即可（见 docs/05_deploy.md）。
services:
  etcd:                                            # Milvus 的元数据存储
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes: ["./volumes/etcd:/etcd"]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:                                           # Milvus 的对象存储
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes: ["./volumes/minio:/minio_data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:                                          # 向量库
    image: milvusdb/milvus:v2.6.2
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports: ["19530:19530", "9091:9091"]            # gRPC 与健康检查端口
    volumes: ["./volumes/milvus:/var/lib/milvus"]
    depends_on: [etcd, minio]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  redis:                                           # 结果缓存
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes         # 开启 AOF，重启后缓存仍在
    volumes: ["./volumes/redis:/data"]
