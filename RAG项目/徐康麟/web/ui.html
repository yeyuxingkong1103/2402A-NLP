        target.streaming = false;
        if (failure) target.error = failure;
      }

      why.textContent = "知识库归属暂时查不到（资料列表取数失败），无法判断该角色有没有资料。" +

      $("kbScopeNote").textContent = "这个角色有没有资料暂时查不到（资料列表取数失败）；" +
        "点上面的「重试」重新取一次，或在下面直接点「添加」选文件。";
    } else if (!has) {
      $("kbAdd").disabled = true;
      why.hidden = false;
      why.textContent = "当前角色「" + (r ? r.name : state.role) + "」的知识库尚未接入" +
        "：可以先在「角色」里换一个已接入知识库的角色，或把资料判定后归到其它角色。";
      $("kbScopeNote").textContent = "这个角色还没有资料；要新增资料，点下面的「添加」选文件（入库时可选归到哪个角色）。";
    } else {
      $("kbAdd").disabled = $("kbAdd").getAttribute("data-busy") === "1";
      why.hidden = true; why.textContent = "";
      $("kbScopeNote").textContent = "当前角色已入库 " + state.kbRoles[state.role] +
        " 份资料。要新增资料，点下面的「添加」选文件。";
    }
    renderAssignOptions();
  }
  function renderAssignOptions() {
    var sel = $("kbAssignRole");
    if (sel.options.length !== state.roles.length) {
      sel.innerHTML = state.roles.map(function (r) {
        return '<option value="' + esc(r.role_id) + '">' + esc(r.name + "（" + r.role_id + "）") + '</option>';
      }).join("");
    }
    if (state.role) sel.value = state.role;
  }
  /* t81：单出口 —— 失败态优先，且**不看面板开没开**：之前失败文案写在 `#kbDocsState` 上，
     而 `openKb()` 里的本函数会立刻把它覆盖成"这个角色还没有资料" ⇒ 错误从未被看见、
     重试永不可达（t74 判定的死路）。现在失败态由 `state.docsError` 承载，
     面板一打开就能看到「失败 + 重试」；走哪条分支都刷新一次按钮上的失败标记。 */
  function renderKbDocs() {
    if (state.docsError) {
      /* t111/F-01：**去掉内层 `role=alert`**。外层 `#kbDocsState` 已是 `role=status`
         （见 HTML），内层再挂一个 live region ⇒ 同一句话被**两个嵌套 live region** 覆盖，
         读屏会播两遍（t106 抓到的 F-01）。这里只让外层播报。 */
      /* t111：`<br>` 做结构性分隔 —— 否则 5xx 的问题编号会与「重试」连读。 */
      $("kbDocsState").innerHTML = '<span>' + esc(state.docsError) + '</span><br>' +
        retryButtonHtml("重试");
      $("kbDocs").innerHTML = "";
      bindKbDocsRetry();
    } else {
      renderKbDocsNormal();
    }
    applyKbBtnMark();
  }
  function renderKbDocsNormal() {
    if (!state.user) {
      $("kbDocsState").textContent = "登录后可查看已入库资料。";
      $("kbDocs").innerHTML = "";
      return;
    }
    if (!state.role) {
      $("kbDocsState").textContent = "先在工具栏点「角色」选一个角色，再查看该角色的资料。";
      $("kbDocs").innerHTML = "";
      return;
    }
    var rows = state.docs.filter(function (d) { return d.role_id === state.role; });
    if (!rows.length) {
      $("kbDocsState").textContent = "这个角色还没有资料；要新增资料，点上面的「添加」选文件。";
      $("kbDocs").innerHTML = "";
      return;
    }
    /* 资料按角色共享（所有用户都能看到），但**删除只由维护者在服务器上做**：
       这里不提供任何删除控件，并把这句原因写在列表上方（AC-P-1）。 */
    $("kbDocsState").textContent = "共 " + rows.length +
      " 份资料，所有登录用户都可以检索；资料由维护者统一管理，普通用户不能删除。";
    $("kbDocs").innerHTML = rows.map(function (d) {
      var name = d.original_name || d.source || d.doc_id;
      return '<div class="kb-doc">' +
        '<span class="dname">' + esc(name) + '</span>' +
        '<span class="dmeta">' + esc(d.doc_id) + ' · ' + esc(d.chunks || 0) + ' 段</span>' +
        '</div>';
    }).join("");
  }
  /* t81：知识库取数失败的重试——成功后必须真的回到**正常列表/空态**，不是"又能重试了"。 */
  function bindKbDocsRetry() {    var btn = $("kbDocsState").querySelector('[data-role="retry"]');
    if (!btn) return;
    btn.onclick = function () {
      btn.disabled = true;
      btn.textContent = "重试中…";
      loadDocuments().then(function () {
        renderKbDocs();                  /* 无论成功/再次失败，都由 state 决定呈现 */
        renderRoles();
      });
    };
  }
  function refreshKbCounts() {
    var map = {};
    state.docs.forEach(function (d) { if (d.role_id) map[d.role_id] = (map[d.role_id] || 0) + 1; });
    state.kbRoles = map;
    renderRoles();
    updateKbHeader();
    setComposerState();
  }

  $("kbBtn").onclick = openKb;
  $("kbClose").onclick = function () { closeKb(true); };
  $("kbScrim").onclick = function () { closeKb(true); };
  $("kbPanel").addEventListener("keydown", function (e) {
    if (e.key === "Escape") { e.preventDefault(); closeKb(true); return; }
    if (e.key !== "Tab") return;
    var list = focusables($("kbPanel"));
    if (!list.length) return;
    var first = list[0], last = list[list.length - 1];
    if (document.activeElement === $("kbPanel")) {
      e.preventDefault(); (e.shiftKey ? last : first).focus();
    } else if (e.shiftKey && document.activeElement === first) {
      e.preventDefault(); last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault(); first.focus();
    }
  });

  /* ---- 添加：文件选择 → 三档判定 → 归属 → 上传 ----
     文件控件**不常驻**：点「添加」时才 document.createElement('input') 建一个、点开原生文件框；
     面板一关就把它从 DOM 里移除。这样「面板未展开时页面里没有 file 节点」在**任何时刻**都成立
     （AC-L-15 的 input[type=file] 计数），而不是只在首屏成立。 */
  function onFilePicked() {
    var input = $("kbFile");
    var files = Array.prototype.slice.call((input && input.files) || []);
    if (!files.length) return;
    state.fitFiles = files;
    runFitCheck(files);
  }
  function ensureFileInput() {
    var input = $("kbFile");
    if (input) return input;
    var host = $("kbFileHost");
    input = document.createElement("input");
    input.type = "file";
    input.id = "kbFile";
    input.name = "files";
    input.multiple = true;
    input.hidden = true;
    input.setAttribute("accept", ".pdf,.txt,.md,.json,.docx,.csv,.html,.htm");
    input.setAttribute("aria-label", "选择要添加的资料文件");
    input.addEventListener("change", onFilePicked);
    host.appendChild(input);
    return input;
  }
  function releaseFileInput() {
    var host = $("kbFileHost");
    if (host) host.innerHTML = "";        /* 连 label 一起移除，不留悬空的 for=kbFile */
  }
  $("kbAdd").onclick = function () {
    if ($("kbAdd").disabled) return;
    var input = ensureFileInput();
    input.value = "";
    input.click();
  };

  function runFitCheck(files) {
    setBusy("fit", true);
    $("kbAdd").setAttribute("data-busy", "1");
    $("kbAdd").disabled = true;
    $("kbAdd").textContent = "判定中…";
    $("kbState").hidden = false;
    $("kbState").textContent = "正在判定这份资料是否符合「" + (currentRole() ? currentRole().name : state.role) +
      "」的设定（只判定，不入库）…";
    var fd = new FormData();
    files.forEach(function (f) { fd.append("files", f); });
    fetch("/documents/fit-check?role_id=" + encodeURIComponent(state.role), {
      method: "POST", body: fd, credentials: "same-origin", headers: { Accept: "application/json" }
    }).then(function (res) {
      return res.json().catch(function () { return null; }).then(function (body) {
        if (!res.ok) throw Object.assign(new Error(apiMessage(body, res.status)), { status: res.status });
        return body;
      });
    }).then(function (body) {
      state.fit = body;
      renderVerdicts(body, files);
      $("kbState").hidden = false;
      $("kbState").textContent = "判定完成。是否入库、入到哪个角色，由你在下面决定。";
      $("kbAssignField").hidden = false;
    }).catch(function (err) {
      state.fit = null;
      $("kbVerdicts").innerHTML = '<div class="verdict bad"><span class="tag">无法判定</span>' +
        '<span class="muted">这次没能完成判定——' + esc(err.message) + ' 本次不会自动入库，你点「添加」可以重试。</span></div>';
      $("kbState").hidden = false;
      $("kbState").textContent = "判定没能完成，本次不会入库。";
      $("kbAssignField").hidden = false;
    }).then(function () {
      setBusy("fit", false);
      $("kbAdd").removeAttribute("data-busy");
      $("kbAdd").textContent = "添加";
      updateKbHeader();
    });
  }

  /* 三档结论与 fit 三值一一对应：true=相符 / false=不符合（给建议角色）/ null=无法判定（绝不显示为通过） */
  function verdictCardHtml(r, i, files) {
    var name = r.filename || (files[i] && files[i].name) || "资料";
    var judge = r.judge_model || (r.judge && r.judge !== "none" ? r.judge : "");
    var head, cls;
    if (r.fit === true) { cls = "ok"; head = "相符"; }
    else if (r.fit === false) { cls = "bad"; head = "不符合该角色设定"; }
    else { cls = "unk"; head = "无法判定"; }
    var reason = r.reason || "";
    var extra = "";
    if (r.fit === false && r.suggested_role) {
      extra = '建议归到：<b>' + esc(r.suggested_role_name || r.suggested_role) + '</b>（' +
        esc(r.suggested_role) + '）；也可以坚持入到当前角色，二选一由你决定。';
    } else if (r.fit === null) {
      extra = "不自动入库：请你自己决定入到哪个角色（也可以放弃这次添加）。";
    } else if (r.fit === true) {
      extra = "可以入到当前角色「" + esc(currentRole() ? currentRole().name : state.role) + "」。";
    }
    if (r.degraded && judge === "") judge = "无可用裁判";
    if (judge) extra += " 裁判：" + esc(judge) + "。";
    return '<div class="verdict ' + cls + '" data-verdict="' +
      (r.fit === true ? "true" : (r.fit === false ? "false" : "null")) + '">' +
      '<span class="tag">' + esc(head) + '</span>' +
      '<span class="muted">' + esc(name) + '：' + esc(reason) + '</span>' +
      '<span class="muted">' + extra + '</span>' +
      '<div class="row"><button type="button" class="primary" data-ingest="' + i + '">入库</button>' +
      '<span class="muted">' + (r.fit === null ? "无法判定时不会自动入库，点「入库」是你明确确认" : "入到上面选定的归属角色") + '</span></div>' +
      '</div>';
  }

  function renderVerdicts(body, files) {
    var results = (body && body.results) || [];
    if (!results.length) {
      $("kbVerdicts").innerHTML = '<div class="verdict unk"><span class="tag">无法判定</span>' +
        '<span class="muted">判定服务没有返回结果，本次不会自动入库。点「添加」可以重试。</span></div>';
      return;
    }
    $("kbVerdicts").innerHTML = results.map(function (r, i) {
      return verdictCardHtml(r, i, files);
    }).join("");
    /* 不符合且有建议角色：预选建议角色，让用户只需确认 */
    var bad = results.filter(function (r) { return r.fit === false && r.suggested_role; })[0];
    if (bad) $("kbAssignRole").value = bad.suggested_role;
    else if (state.role) $("kbAssignRole").value = state.role;
    Array.prototype.forEach.call($("kbVerdicts").querySelectorAll("[data-ingest]"), function (b) {
      b.onclick = function () { ingestDocument(Number(b.dataset.ingest), files); };
    });
  }

  function ingestDocument(index, files) {
    var r = (state.fit && state.fit.results && state.fit.results[index]) || {};
    var roleId = $("kbAssignRole").value || state.role;
    var file = files[index];
    if (!file) return;
    var fd = new FormData();
    fd.append("files", file);
    var btn = $("kbVerdicts").querySelector('[data-ingest="' + index + '"]');
    if (btn) { btn.disabled = true; btn.textContent = "入库中…"; }
    $("kbState").hidden = false;
    $("kbState").textContent = "正在把「" + (r.filename || file.name) + "」入到 " + roleId + "…";
    setBusy("upload", true);
    fetch("/documents/upload?role_id=" + encodeURIComponent(roleId), {
      method: "POST", body: fd, credentials: "same-origin", headers: { Accept: "application/json" }
    }).then(function (res) {
      return res.json().catch(function () { return null; }).then(function (body) {
        if (!res.ok) throw Object.assign(new Error(apiMessage(body, res.status)), { status: res.status });
        return body;
      });
    }).then(function (body) {
      var accepted = (body && body.accepted) || [];
      var n = accepted.length;
      $("kbState").textContent = "已入库 " + n + " 个文件（归属：" + (roleNameOf(roleId) || "角色待载入") + "）。";
      if (btn) { btn.textContent = "已入库"; btn.classList.remove("primary"); btn.classList.add("ghost"); }
      return loadDocuments().then(function () { renderKbDocs(); });
    }).catch(function (err) {
      $("kbState").textContent = "入库失败：" + err.message + "（文件已保留在上一步，可重试或换一个角色）";
      if (btn) { btn.disabled = false; btn.textContent = "重试入库"; }
    }).then(function () { setBusy("upload", false); });
  }

  /* ================= 确认模态（页内浮层，替代原生 confirm） ================= */
  var confirmAction = null, confirmTrigger = null;
  function askConfirm(text, target, okText, onOk) {
    confirmAction = onOk;
    confirmTrigger = document.activeElement;      /* 记下触发它的元素，关闭后焦点回原处（AC-K-3） */
    $("confirmText").textContent = text;
    $("confirmTarget").textContent = target || "";
    $("confirmOk").textContent = okText || "确认";
    $("confirmScrim").hidden = false;
    $("confirmModal").hidden = false;
    $("confirmOk").focus();
  }
  function closeConfirm(returnFocus) {
    var wasOpen = !$("confirmModal").hidden;
    var back = confirmTrigger;
    $("confirmModal").hidden = true;
    $("confirmScrim").hidden = true;
    confirmAction = null;
    confirmTrigger = null;
    if (!returnFocus || !wasOpen) return;
    if (back && back.isConnected && !back.disabled && back.offsetParent !== null) back.focus();
    else $("kbBtn").focus();                      /* 触发元素已被移除/不可见时的兜底 */
  }
  $("confirmOk").onclick = function () {
    var fn = confirmAction;
    closeConfirm(false);
    if (fn) fn();
  };
  $("confirmCancel").onclick = function () { closeConfirm(true); };
  $("confirmScrim").onclick = function () { closeConfirm(true); };
  $("confirmModal").addEventListener("keydown", function (e) {
    if (e.key === "Escape") { e.preventDefault(); closeConfirm(true); return; }
    if (e.key !== "Tab") return;
    var list = focusables($("confirmModal"));
    if (!list.length) return;
    var first = list[0], last = list[list.length - 1];
    if (document.activeElement === $("confirmModal")) { e.preventDefault(); (e.shiftKey ? last : first).focus(); }
    else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  /* ================= 输入模态（重命名；页内浮层 + 焦点管理） ================= */
  var promptAction = null, promptTrigger = null;
  function openPrompt(title, text, value, onOk) {
    promptAction = onOk;
    promptTrigger = document.activeElement;
    $("promptTitle").textContent = title;
    $("promptText").textContent = text;
    $("promptInput").value = value || "";
    $("promptScrim").hidden = false;
    $("promptModal").hidden = false;
    $("promptInput").focus();
    $("promptInput").select();
  }
  function closePrompt(returnFocus) {
    var wasOpen = !$("promptModal").hidden;
    var back = promptTrigger;
    $("promptModal").hidden = true;
    $("promptScrim").hidden = true;
    promptAction = null;
    promptTrigger = null;
    if (!returnFocus || !wasOpen) return;
    if (back && back.isConnected && !back.disabled && back.offsetParent !== null) back.focus();
    else $("newSession").focus();
  }
  $("promptOk").onclick = function () {
    var fn = promptAction, val = $("promptInput").value;
    closePrompt(false);
    if (fn) fn(val);
  };
  $("promptCancel").onclick = function () { closePrompt(true); };
  $("promptCancelX").onclick = function () { closePrompt(true); };
  $("promptScrim").onclick = function () { closePrompt(true); };
  $("promptInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); $("promptOk").click(); }
  });
  $("promptModal").addEventListener("keydown", function (e) {
    if (e.key === "Escape") { e.preventDefault(); closePrompt(true); return; }
    if (e.key !== "Tab") return;
    var list = focusables($("promptModal"));
    if (!list.length) return;
    var first = list[0], last = list[list.length - 1];
    if (document.activeElement === $("promptModal")) { e.preventDefault(); (e.shiftKey ? last : first).focus(); }
    else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  /* ================= 窄屏会话抽屉 ================= */
  function openDrawer() {
    document.body.classList.add("drawer-open");
    $("drawerClose").hidden = false;
    $("drawerScrim").hidden = false;
    setExpanded("drawerBtn", true);
    var list = focusables($("sidebar"));
    if (list.length) list[0].focus();                 /* 焦点移入抽屉内第一个可聚焦元素（§7 细则 / F5） */
    else $("sidebar").focus();                        /* 抽屉内暂无可聚焦元素时的兜底（AC-N-12 仍要求焦点在抽屉内） */
  }
  function closeDrawer(returnFocus) {
    if (!document.body.classList.contains("drawer-open")) return;
    document.body.classList.remove("drawer-open");
    $("drawerClose").hidden = true;
    $("drawerScrim").hidden = true;
    setExpanded("drawerBtn", false);
    if (returnFocus) $("drawerBtn").focus();
  }
  $("drawerBtn").onclick = openDrawer;
  $("drawerClose").onclick = function () { closeDrawer(true); };
  $("roleClose").onclick = function () { closeRoles(true); };
  $("drawerScrim").onclick = function () { closeDrawer(true); };

  /* ================= 全局 Esc：按"最上层"依次关闭浮层，焦点回到触发按钮 ================= */
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (!$("sessionMenu").hidden) { closeSessionMenu(true); return; }
    if (!$("promptModal").hidden) { closePrompt(true); return; }
    if (!$("confirmModal").hidden) { closeConfirm(true); return; }
    if (!$("kbPanel").hidden) { closeKb(true); return; }
    if (!$("rolePop").hidden) { closeRoles(true); return; }
    closeDrawer(true);
  });
  document.addEventListener("pointerdown", function (e) {
    if (!$("sessionMenu").hidden && !$("sessionMenu").contains(e.target) &&
        !e.target.closest("[data-manage]")) {
      closeSessionMenu(false);
    }
    if ($("rolePop").hidden) return;
    if ($("rolePop").contains(e.target) || $("roleBtn").contains(e.target)) return;
    closeRoles(false);
  });

  /* ================= 只读请求：服务状态徽标（给用户看的文字 + 技术细节放 title/aria-label） ================= */
  function loadHealth() {
    return getJson("/health").then(function (h) {
      var eng = h.engine || {};
      var store = eng.store_actual || eng.store || "?";
      var ok = h.status === "ok" && !eng.degraded;
      var el = $("health");
      var detail = "服务状态：" + (ok ? "正常" : "降级") + "；知识库存储：" + store + "（来源 GET /health）";
      el.className = "badge " + (ok ? "ok" : "bad");
      el.textContent = ok ? "服务正常" : "服务已降级";
      el.setAttribute("aria-label", detail);
      el.title = detail + "\n" + JSON.stringify({ status: h.status, degraded: !!eng.degraded,
        store_actual: store, chunks: eng.chunks, llm_chain: eng.llm_chain }, null, 1);
    }).catch(function (err) {
      var el = $("health");
      var detail = "服务状态不可用（来源 GET /health）：" + (err && err.message ? err.message : String(err));
      el.className = "badge bad";
      el.textContent = "服务暂时不可用";
      el.setAttribute("aria-label", detail);
      el.title = detail;
    });
  }
  function loadJudge() {
    return getJson("/documents/fit-check").then(function (j) {
      var el = $("judge");
      var detail = "智能判定（判定器）状态：" + (j.available ? "已启用" : "不可用") +
        "；当前判定模型：" + (j.judge || "无") + "（来源 GET /documents/fit-check）";
      el.className = "badge " + (j.available ? "ok" : "bad");
      el.textContent = j.available ? "智能判定已启用" : "智能判定暂不可用";
      el.setAttribute("aria-label", detail);
      el.title = detail + "\n" + JSON.stringify(j, null, 1);
    }).catch(function (err) {
      var el = $("judge");
      var detail = "智能判定（判定器）状态未知（来源 GET /documents/fit-check）：" +
        (err && err.message ? err.message : String(err));
      el.className = "badge bad";
      el.textContent = "智能判定暂不可用";
      el.setAttribute("aria-label", detail);
      el.title = detail;
    });
  }

  /* ================= 启动：先判登录态，再决定首屏 ================= */
  /* 登录态判定失败分两档，**判错就会无限往返**（F-A2）：
     · **401 / 200 无 user_id** ⇒ 登录态确实失效 ⇒ 跳 /login（由服务端守卫收口，不会往返）；
     · **超时 / 网络错误 / 5xx** ⇒ **留在 /ui**，退避重试最多 3 次（间隔 ≥5s），
       之后停在**终态错误态 + 「重试」**，**绝不跳转**、**绝不自动整页重载**。 */
  function loadSession() {
    var seq = ++bootSeq;
    bootAttempts = 0;
    clearBootError();
    renderBooting();
    bootRetryClickable(false);
    checkSession(seq);
  }
  function checkSession(seq) {
    if (seq !== bootSeq) return;
    getJson("/auth/me", { timeoutMs: 5000 }).then(function (info) {
      if (seq !== bootSeq) return;
      if (!info || !info.user_id) { bootAuthFailed("未返回用户信息"); return; }
      applySession(info);
    }).catch(function (err) {
      if (seq !== bootSeq) return;
      if (err && err.status === 401) { bootAuthFailed("登录态已失效"); return; }
      bootAttempts++;
      if (bootAttempts <= BOOT_RETRY_MAX) {
        var note = $("bootNote");
        var wait = BOOT_RETRY_DELAY_MS;
        if (note) {
          note.textContent = bootErrorReason(err) + "；正在重试（第 " + bootAttempts + " / " +
            BOOT_RETRY_MAX + " 次，约 " + Math.round(wait / 1000) + " 秒后）…";
        }
        bootTimer = setTimeout(function () { checkSession(seq); }, wait);
        return;
      }
      showBootError(bootErrorReason(err) + "。请点下面的「重试」；一直失败的话，请确认服务已经启动。");
    });
  }
  function boot() {
    setAccountUI();
    loadHealth();
    loadJudge();
    loadSession();
    setInterval(loadHealth, 20000);  /* 服务状态 20s 轮询（§2.5）；不计入整页加载次数 */
  }
  $("bootRetry").onclick = function () {
    reqLog("RETRY", "/auth/me", "用户点击「重试」，重新确认登录状态");
    bootRetryClickable(false);
    loadSession();
  };
  /* ---- 标签页图标（AC-FAV-1..15）：6 角色 + 默认法锤 ----
     同一图形 + 两种填充色（亮→黑 / 暗→白）+ **1px 反向描边**（白图标黑边 / 黑图标白边）；
     viewBox 32 + stroke-width 2 ⇒ 16×16 渲染时描边正好 1px；全部自绘、无第三方、无外链；
     资源是内联 data-URI ⇒ 零额外页面请求、恒 200/image。 */
  var DEFAULT_ROLE = "lawyer";
  var ROLE_ICONS = {
    lawyer: "M6 4 h20 v5 H6 z M14 9 h4 v13 h-4 z M5 25 h22 v3 H5 z",
    doctor: "M12 5 h8 v7 h7 v8 h-7 v7 h-8 v-7 H5 v-8 h7 z",
    tcm: "M5 15 h22 a11 7 0 0 1 -22 0 z M20 4 c6 2 8 6 8 9 c-5 0 -8 -4 -8 -9 z",
    psychologist: "M4 4 h24 v15 H16 l-6 6 v-6 H4 z M16 8 a4.5 4.5 0 0 1 4.5 4.5 a4.5 4.5 0 0 1 -4.5 4.5 a4.5 4.5 0 0 1 -4.5 -4.5 A4.5 4.5 0 0 1 16 8 z",
    financial_planner: "M16 2 a14 14 0 1 0 0 28 a14 14 0 1 0 0 -28 z M16 6 a10 10 0 1 1 0 20 a10 10 0 1 1 0 -20 z M15 9 h3 v3 h2 v7 h-3 v-3 h-2 z",
    stock_advisor: "M4 5 h4 v16 H4 z M12 9 h4 v12 h-4 z M20 3 h4 v18 h-4 z M3 23 h26 v3 H3 z"
  };
  function buildFavicon(roleId, theme) {
    var d = ROLE_ICONS[roleId] || ROLE_ICONS[DEFAULT_ROLE];
    var ink = (theme === "light") ? "#000000" : "#FFFFFF";     /* 亮→黑 / 暗→白（AC-FAV-11） */
    var ring = (theme === "light") ? "#FFFFFF" : "#000000";    /* 反向描边（AC-FAV-8） */
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">' +
      '<path d="' + d + '" fill="' + ink + '" stroke="' + ring + '" stroke-width="2" ' +
      'stroke-linejoin="round" fill-rule="evenodd"></path></svg>';
    return "data:image/svg+xml," + encodeURIComponent(svg);
  }
  /* 只改 href：元素个数恒 1（AC-FAV-1/4/14） */
  function syncFavicon(roleId) {
    var link = document.querySelector('link[rel~="icon"]');
    if (!link) return;
    link.setAttribute("href", buildFavicon(roleId || DEFAULT_ROLE, window.__theme.current()));
  }

  /* ---- 主题开关（r12 §18）：两态切换 + 持久化；值只有 dark/light，不存任何凭据 ---- */
  var THEME_LABEL = { dark: "深色", light: "浅色" };
  function syncThemeBtn() {
    var t = window.__theme.current();
    var btn = $("themeBtn");
    var lab = $("themeLabel");
    btn.setAttribute("aria-pressed", t === "light" ? "true" : "false");
    btn.setAttribute("aria-label", "切换主题（当前：" + THEME_LABEL[t] + "）");
    btn.setAttribute("title", "切换暗色 / 亮色主题（当前：" + THEME_LABEL[t] + "）");
    if (lab) lab.textContent = THEME_LABEL[t];
  }
  $("themeBtn").onclick = function () {
    var next = window.__theme.current() === "light" ? "dark" : "light";
    window.__theme.set(next, true);    /* ① 本地立即生效（AC-PR-8①） */
    syncThemeBtn();
    syncFavicon(state.role);           /* 切主题同步换色，无需刷新（AC-FAV-11） */
    window.__prefs.save({ theme: next });   /* ② 随后异步上报；未登录(401)只当"只写本地" */
  };
  syncThemeBtn();
  syncFavicon(state.role);             /* 未选角色 ⇒ 默认法锤（AC-FAV-15） */
  try {
    window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", function () {
      if (!window.__theme.read()) {                 /* 未显式选择过 ⇒ 继续跟随系统 */
        window.__theme.apply(window.__theme.system());
        syncThemeBtn();
        syncFavicon(state.role);
      }
    });
  } catch (e) { /* 老引擎没有 addEventListener：保持初始值 */ }

  /* B-8：`GET /prefs` 回来后把**角色偏好**落到界面。
     ⚠️ 刻意**不校验知识库有无**：偏好指向的角色当前没有知识库时要**保留 + 同屏提示**
     （`AC-PR-4③` 明禁"静默改回 lawyer"）；只有该角色**不在角色库里**才算偏好失效。 */
  window.__prefsApply = function (p) {
    var roleId = p && p.role_id;
    if (roleId && roleId !== state.role) {
      state.role = roleId;
      state.rolePref = roleId;
      if (typeof syncFavicon === "function") syncFavicon(state.role);
      if (typeof renderRoles === "function") renderRoles();
      if (typeof updateRoleUI === "function") updateRoleUI();
      if (typeof updateKbHeader === "function") updateKbHeader();
      if (typeof renderKbDocs === "function") renderKbDocs();
      if (typeof setComposerState === "function") setComposerState();
    } else if (typeof syncFavicon === "function") {
      syncFavicon(state.role);
    }
  };
  window.__syncThemeBtn = syncThemeBtn;
  window.__syncFavicon = syncFavicon;
  boot();
})();
</script>
</body>
</html>
