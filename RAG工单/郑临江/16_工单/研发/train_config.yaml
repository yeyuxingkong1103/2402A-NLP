# 工单编号：人工智能NLP-RAG-微调专用视觉语言模型工单
# LLaMA-Factory LoRA 微调配置
model_name_or_path: Qwen/Qwen2-VL-7B-Instruct
stage: sft
finetuning_type: lora
template: qwen_vl

# LoRA 参数
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

# 数据集与图像预处理
dataset: imdr_vlm
cutoff_len: 2048
image_max_pixels: 1474560
image_min_pixels: 32768

# 训练超参数
learning_rate: 2.0e-4
num_train_epochs: 3
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
warmup_ratio: 0.1
lr_scheduler_type: cosine
logging_steps: 10
save_steps: 200
output_dir: ./output/vlm_lora
bf16: true
gradient_checkpointing: true
