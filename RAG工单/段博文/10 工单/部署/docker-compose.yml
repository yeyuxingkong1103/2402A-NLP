# -*- coding: utf-8 -*-
# 工单编号：人工智能NLP-RAG-金融问答系统部署
# ============================================================
# RAG 金融问答系统 docker-compose.yml
# ============================================================
# 启动：docker-compose up -d
# 停止：docker-compose down
# 查看日志：docker-compose logs -f rag-app
# 重建：docker-compose up -d --build
# ============================================================

services:
  # ==================== Milvus 向量数据库 ====================
  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: rag-milvus
    command: ["milvus", "run", "standalone"]
    restart: unless-stopped
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"   # Milvus gRPC 端口
      - "9091:9091"     # Milvus HTTP 端口
    volumes:
      - milvus-data:/var/lib/milvus   # 持久化向量数据
    networks:
      - rag-net
    depends_on:
      - etcd
      - minio

  # ==================== etcd（Milvus 元数据存储）====================
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: rag-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - rag-net

  # ==================== MinIO（Milvus 对象存储）====================
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: rag-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - rag-net

  # ==================== RAG 金融问答应用 ====================
  rag-app:
    build:
      context: ..
      dockerfile: 部署/Dockerfile
    container_name: rag-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MILVUS_URI=http://milvus:19530
      - MILVUS_COLLECTION=rag_pdf_qa_v4
      - EMBED_MODEL_PATH=/models/bge-m3
      - RERANK_MODEL=/models/bge-reranker-large
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
      - LLM_MODEL=deepseek-chat
    volumes:
      - rag-data:/app/data            # 持久化 PDF 与索引数据
      - rag-models:/models            # 模型权重卷
      - rag-logs:/app/logs            # 日志卷
    networks:
      - rag-net
    depends_on:
      - milvus
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# ==================== Docker 卷 ====================
volumes:
  milvus-data:
    driver: local
  etcd-data:
    driver: local
  minio-data:
    driver: local
  rag-data:
    driver: local
  rag-models:
    driver: local
  rag-logs:
    driver: local

# ==================== 网络 ====================
networks:
  rag-net:
    driver: bridge
    name: rag-net
