<!doctype html><html lang="zh"><meta charset="utf-8"><title>赵振 · LightRAG工单12</title>
<style>body{font:16px "Microsoft YaHei",sans-serif;background:#f3f6fa;color:#173449;margin:32px auto;max-width:1180px}h1{font-size:28px}section{background:white;border-radius:12px;padding:22px;margin:18px 0}button,select,input{font:inherit;padding:10px;border:1px solid #ccd6df;border-radius:6px}button{background:#174664;color:white;cursor:pointer}input{width:70%}pre{white-space:pre-wrap;line-height:1.6;max-height:480px;overflow:auto}table{border-collapse:collapse;width:100%}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}.hint{color:#577087}#graph{max-height:420px;overflow:auto}</style>
<h1>招股书问答 · RAG / LightRAG</h1><p class="hint">作者：赵振。知识库：招股说明书1、2。显示真实检索原文和出处，参考答案与模型回答分开保存。</p>
<section><select id="mode"><option>LightRAG</option><option>RAG</option></select> <input id="q" value="武汉力源信息技术股份有限公司本次发行股数是多少，占发行后总股本的比例是多少？"> <button id="ask">检索</button><pre id="output">选择知识库后点击检索。</pre></section>
<section><h2>16题实测对比</h2><p class="hint">RAGAS 0.3.9：页级ID指标与本机模型评判的上下文指标。它们衡量检索证据，不代表回答准确率。</p><select id="case"></select> <button id="show">查看此题</button><pre id="result"></pre><table id="summary"></table></section>
<section><h2>知识图谱</h2><p class="hint">LightRAG实际存储实体和关系；图表补充明确标注为人工核验。实体关系只抽取题库相关候选段落，全文均进入向量库。</p><button id="loadgraph">查看实体与关系</button><div id="graph"></div></section>
<script>
let rows=[];const $=id=>document.getElementById(id);
$('ask').onclick=async()=>{ $('output').textContent='检索中…';try{const r=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:$('q').value,mode:$('mode').value})});const x=await r.json();$('output').textContent=r.ok?(x.data?.chunks||[]).map(c=>c.file_path+'\n'+c.content).join('\n\n'):JSON.stringify(x)}catch(e){$('output').textContent=e.message}};
fetch('/results').then(r=>r.json()).then(x=>{if(!Array.isArray(x))return;rows=x;for(const id of [...new Set(x.map(r=>r.id))]){const o=document.createElement('option');o.value=id;o.textContent='问题 '+id;$('case').append(o)}$('show').click();const table=$('summary');let head=document.createElement('tr');for(const v of ['模式','页级Precision','页级Recall','上下文Precision','上下文Recall']){let c=document.createElement('th');c.textContent=v;head.append(c)}table.append(head);for(const mode of ['RAG','LightRAG']){let a=x.filter(r=>r.mode===mode),tr=document.createElement('tr');for(const v of [mode,...['id_based_context_precision','id_based_context_recall','context_precision','context_recall'].map(k=>(a.reduce((s,r)=>s+r.ragas[k],0)/a.length).toFixed(4))]){let td=document.createElement('td');td.textContent=v;tr.append(td)}table.append(tr)}});
$('show').onclick=()=>{$('result').textContent=rows.filter(r=>String(r.id)===$('case').value).map(r=>r.mode+'\n'+r.question+'\n检索页：'+r.retrieved_pages.join('，')+'\n原始模型回答：'+r.answer+'\nRAGAS：'+JSON.stringify(r.ragas)+'\n\n单列参考答案：'+r.reference).join('\n\n')};
$('loadgraph').onclick=async()=>{const x=await(await fetch('/graph')).json();$('graph').replaceChildren();const p=document.createElement('p');p.textContent=x.entities.length+'个实体；'+x.relationships.length+'条关系';$('graph').append(p);for(const r of x.relationships){const p=document.createElement('p');p.textContent=r.src_id+' → '+r.keywords+' → '+r.tgt_id+'\n'+r.description;$('graph').append(p)}};
</script></html>
