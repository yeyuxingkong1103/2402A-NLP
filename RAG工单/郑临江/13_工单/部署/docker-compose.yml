# 工单编号：人工智能NLP-RAG项目-RAG性能瓶颈识别与优化
# 监控与追踪基础设施：Prometheus（指标采集）+ Grafana（仪表盘）+ Jaeger（分布式追踪）
version: "3.8"

services:
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "6831:6831/udp"   # Thrift（OpenTelemetry exporter 对接）
      - "16686:16686"     # Jaeger UI
