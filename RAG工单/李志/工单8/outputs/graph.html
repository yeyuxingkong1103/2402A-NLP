<!doctype html><meta charset='utf-8'><title>GraphRAG 知识图谱</title><style>body{font:14px sans-serif;background:#08111f;color:#e8f0ff}svg{width:100%;height:90vh}.edge{stroke:#49647e}.node{fill:#41d1a6}.label{fill:white;font-size:12px}</style><h1>金融知识图谱</h1><svg id='g'></svg><script>const nodes=[{"id": "电子元器件代理分销", "weight": 1}, {"id": "芯片解决方案及技术服", "weight": 1}, {"id": "有限公司主营业务包括", "weight": 1}, {"id": "武汉力源信息技术股份", "weight": 1}, {"id": "包括大客户销售部", "weight": 1}, {"id": "区域销售部和销售支持", "weight": 1}, {"id": "公司组织结构中销售部", "weight": 1}, {"id": "用于研发中心升级项目", "weight": 1}, {"id": "营销网络建设项目和补", "weight": 1}, {"id": "充流动资金", "weight": 1}, {"id": "本次发行募集资金主要", "weight": 1}, {"id": "公司法定代表人为赵佳", "weight": 1}, {"id": "招股说明书披露为准", "weight": 1}, {"id": "注册资本及股本信息以", "weight": 1}, {"id": "汇率变化以及技术迭代", "weight": 1}, {"id": "市场竞争", "weight": 1}, {"id": "风险", "weight": 1}, {"id": "风险因素包括供应链波", "weight": 1}],edges=[{"source": "有限公司主营业务包括", "target": "武汉力源信息技术股份", "weight": 1}, {"source": "有限公司主营业务包括", "target": "电子元器件代理分销", "weight": 1}, {"source": "电子元器件代理分销", "target": "芯片解决方案及技术服", "weight": 1}, {"source": "公司组织结构中销售部", "target": "包括大客户销售部", "weight": 1}, {"source": "包括大客户销售部", "target": "区域销售部和销售支持", "weight": 1}, {"source": "本次发行募集资金主要", "target": "用于研发中心升级项目", "weight": 1}, {"source": "用于研发中心升级项目", "target": "营销网络建设项目和补", "weight": 1}, {"source": "充流动资金", "target": "营销网络建设项目和补", "weight": 1}, {"source": "公司法定代表人为赵佳", "target": "注册资本及股本信息以", "weight": 1}, {"source": "招股说明书披露为准", "target": "注册资本及股本信息以", "weight": 1}, {"source": "市场竞争", "target": "风险因素包括供应链波", "weight": 1}, {"source": "市场竞争", "target": "汇率变化以及技术迭代", "weight": 1}, {"source": "汇率变化以及技术迭代", "target": "风险", "weight": 1}],svg=document.querySelector('#g'),W=innerWidth,H=innerHeight*.85;nodes.forEach((n,i)=>{n.x=W/2+Math.cos(i*2.4)*Math.min(W,H)*.38*(.2+i/nodes.length);n.y=H/2+Math.sin(i*2.4)*Math.min(W,H)*.38*(.2+i/nodes.length)});edges.forEach(e=>{let a=nodes.find(n=>n.id==e.source),b=nodes.find(n=>n.id==e.target);if(a&&b)svg.innerHTML+=`<line class=edge x1=${a.x} y1=${a.y} x2=${b.x} y2=${b.y}/>`});nodes.forEach(n=>svg.innerHTML+=`<circle class=node cx=${n.x} cy=${n.y} r=${4+Math.min(n.weight,8)}/><text class=label x=${n.x+8} y=${n.y}>${n.id}</text>`)</script>
