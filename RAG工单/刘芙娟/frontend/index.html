<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>医知源 · 医疗知识问答</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/panels.css">
</head>
<body>

<!--
  ⚠️ 品牌名与失败提示直接写在 HTML 里，不依赖外部资源。

  理由（规格 Edge Case）：styles.css 或 js/ 加载失败时，页面 MUST NOT 呈现为
  空白页。若品牌名是 JS 渲染出来的，脚本一挂页面就完全空白 —— 用户看到的
  是"网站坏了"，而不是"资源没加载上"，排查方向一开始就错了。
-->

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">医</span>
      <span class="brand-text">
        <strong>医知源</strong>
        <small>医疗知识问答</small>
      </span>
    </div>

    <!-- 导航项由 js/nav.js 的配置渲染。新增功能界面只需改那份配置。 -->
    <nav class="nav" id="nav" aria-label="功能导航"></nav>

    <div class="sidebar-foot">
      <p>基于自有权威语料作答</p>
      <p>每句话都可回原文核对</p>
    </div>
  </aside>

  <main class="main">

    <!-- ============ 医疗问答 ============ -->
    <section class="panel" id="panel-qa">

      <header class="panel-head">
        <h1>医疗问答</h1>
        <p>输入你的问题，按回车或点击发送。</p>
      </header>

      <!--
        ⚠️ 输入框在**上方**，结果区在下方。

        这与占位文案"在上方输入框中提出你的问题"必须一致 —— 二者曾经不一致
        （文案说"上方"、控件却在底部），是肉眼可见的自相矛盾。

        版面上的顺序是：输入框 → 提示 → 答案正文区 → 引用片段区。
        其中"答案在引用之上"是 FR-027 的硬约束，不能动。
      -->
      <form class="composer" id="composer" autocomplete="off">
        <label class="sr-only" for="question">你的问题</label>
        <!-- maxlength 刻意设为 400 而非上限 200：
             它只用于兜住极端粘贴，不承担业务约束。若也设成 200，输入框会
             静默截断，用户永远碰不到"超长"这条路径 —— 那条提示就成了
             从没执行过的死代码，而真正的边界（服务端 422）也无从被触发。 -->
        <textarea
          id="question"
          name="question"
          rows="1"
          maxlength="400"
          placeholder="例如：我最近血压有点高，多少算高血压？"
        ></textarea>
        <button type="submit" id="send" aria-label="发送">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M3.4 20.4 21 12 3.4 3.6l.01 6.53L15 12 3.41 13.87z"
                  fill="currentColor"/>
          </svg>
        </button>
      </form>

      <p class="notice" id="notice" role="alert" hidden></p>

      <div class="panel-body" id="qa-scroll">

        <!-- 答案正文区（在引用区之上）-->
        <section class="card answer-card" aria-live="polite">
          <h2 class="card-title">回答</h2>
          <div class="answer-body" id="answer-body">
            <p class="placeholder">在上方输入框中提出你的问题。</p>
          </div>
        </section>

        <!-- 引用片段区（在下）—— FR-027：必须在答案区之后 -->
        <section class="card citation-card">
          <h2 class="card-title">
            引用来源
            <span class="card-hint">按相似度排序</span>
          </h2>
          <div class="citation-body" id="citation-body">
            <p class="placeholder">暂无引用。</p>
          </div>
        </section>

      </div>

    </section>

    <!-- ============ 新增功能界面 ============
         加一个界面只需两步：
           1. 在此处加一个 <section class="panel" id="panel-xxx" hidden>
           2. 在 js/nav.js 的 NAV_ITEMS 里追加一行
         问答面板的代码无需改动（SC-005）。

         ⚠️ 这里刻意**不再放一个占位面板**。原先放过一个「用药助手」的占位
         区块，它的用途（验证"新增导航项只需改配置"）在 S7 验收时已经用过，
         留着只剩两个副作用：
           · 侧栏多一个点进去只有一句话的死导航项；
           · 面板本身 height:100%，点开后是一整屏空白。
         一个已经完成的验证步骤不该长期留在用户界面上。 -->

  </main>

</div>

<noscript>
  <p class="fatal">医知源需要启用 JavaScript 才能提交问题。</p>
</noscript>

<script src="/js/nav.js"></script>
<script src="/js/transcript.js"></script>
<script src="/js/sse.js"></script>
<script src="/js/app.js"></script>

</body>
</html>
