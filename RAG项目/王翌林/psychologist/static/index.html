<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心灵陪伴 · 心理医生聊天</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #f6f4ef; color: #33384a; display: flex; overflow: hidden;
  }
  /* ---------- 左侧栏 ---------- */
  #sidebar {
    width: 300px; min-width: 300px; background: #3f6b6b; color: #eef4f2;
    display: flex; flex-direction: column; height: 100vh;
  }
  #sidebar h1 { font-size: 18px; padding: 18px 16px 4px; letter-spacing: 1px; }
  #sidebar .sub { font-size: 12px; opacity: .7; padding: 0 16px 12px; border-bottom: 1px solid rgba(255,255,255,.12); }
  .sec-title { font-size: 12px; opacity: .65; padding: 14px 16px 6px; }
  #persona-list { overflow-y: auto; max-height: 42vh; padding: 0 8px; }
  .persona-card {
    display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px;
    cursor: pointer; transition: background .15s;
  }
  .persona-card:hover { background: rgba(255,255,255,.1); }
  .persona-card.active { background: rgba(255,255,255,.18); }
  .persona-avatar {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; color: #fff;
  }
  .persona-info .p-name { font-size: 14px; font-weight: 600; }
  .persona-info .p-type { font-size: 11px; opacity: .7; }
  #conv-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .conv-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .conv-item:hover { background: rgba(255,255,255,.1); }
  .conv-item.active { background: rgba(255,255,255,.18); }
  .conv-item .c-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .conv-del {
    display: none; border: none; background: none; color: #ffb3b3; cursor: pointer;
    font-size: 15px; padding: 0 2px; flex-shrink: 0;
  }
  .conv-item:hover .conv-del { display: inline; }
  #user-bar {
    padding: 12px 16px; font-size: 13px; border-top: 1px solid rgba(255,255,255,.12);
    display: flex; justify-content: space-between; align-items: center;
  }
  #user-bar button {
    border: none; background: rgba(255,255,255,.15); color: #fff; border-radius: 6px;
    padding: 4px 10px; cursor: pointer; font-size: 12px;
  }
  /* ---------- 右侧 ---------- */
  #main { flex: 1; display: flex; flex-direction: column; height: 100vh; min-width: 0; }
  #disclaimer {
    background: #fdf3e3; color: #8a6d3b; font-size: 12px; text-align: center;
    padding: 6px 12px; border-bottom: 1px solid #f0e2c8;
  }
  #chat-head {
    padding: 14px 24px; background: #fff; border-bottom: 1px solid #e8e4da;
    display: flex; align-items: baseline; gap: 10px;
  }
  #chat-head .doc-name { font-size: 17px; font-weight: 700; color: #3f6b6b; }
  #chat-head .doc-type { font-size: 12px; color: #999; }
  #chat-area { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 76%; display: flex; flex-direction: column; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 11px 14px; border-radius: 14px; font-size: 14px; line-height: 1.75;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: #5b8a8a; color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: #fff; border: 1px solid #e8e4da; border-bottom-left-radius: 4px; }
  .msg.error .bubble { background: #fdecec; border-color: #f2b8b8; color: #a33; }
  .bubble .cursor { display: inline-block; width: 7px; height: 15px; background: #5b8a8a;
    vertical-align: text-bottom; animation: blink 1s infinite; margin-left: 2px; }
  @keyframes blink { 50% { opacity: 0; } }
  .refs { font-size: 11px; color: #8a8f7e; margin-top: 5px; max-width: 76%; }
  .refs summary { cursor: pointer; outline: none; }
  .crisis-tip {
    background: #fff4e5; border: 1px solid #f0c987; color: #8a5a1a; border-radius: 10px;
    padding: 10px 14px; font-size: 13px; line-height: 1.7; white-space: pre-wrap; max-width: 76%;
    align-self: flex-start;
  }
  .empty-hint { text-align: center; color: #b0aa9c; font-size: 13px; margin-top: 40px; line-height: 2; }
  /* ---------- 输入区 ---------- */
  #input-bar { display: flex; gap: 10px; padding: 14px 24px 18px; background: #fff; border-top: 1px solid #e8e4da; }
  #msg-input {
    flex: 1; resize: none; border: 1px solid #ddd8cc; border-radius: 12px; padding: 11px 14px;
    font-size: 14px; font-family: inherit; outline: none; height: 46px; max-height: 130px; line-height: 1.5;
  }
  #msg-input:focus { border-color: #5b8a8a; }
  #send-btn {
    border: none; background: #5b8a8a; color: #fff; border-radius: 12px; padding: 0 26px;
    font-size: 14px; cursor: pointer; flex-shrink: 0;
  }
  #send-btn:disabled { background: #b9c9c9; cursor: not-allowed; }
  /* ---------- 登录卡片 ---------- */
  #auth-mask { position: absolute; inset: 0; background: rgba(63,107,107,.35); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; z-index: 10; }
  #auth-card { background: #fff; border-radius: 16px; padding: 30px 34px; width: 340px; box-shadow: 0 12px 40px rgba(0,0,0,.18); }
  #auth-card h2 { text-align: center; color: #3f6b6b; margin-bottom: 18px; font-size: 20px; }
  .auth-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .auth-tabs button { flex: 1; border: none; padding: 8px; border-radius: 8px; cursor: pointer;
    background: #f0ede5; color: #666; font-size: 13px; }
  .auth-tabs button.on { background: #5b8a8a; color: #fff; }
  #auth-card input {
    width: 100%; border: 1px solid #ddd8cc; border-radius: 8px; padding: 10px 12px;
    font-size: 14px; margin-bottom: 12px; outline: none;
  }
  #auth-card input:focus { border-color: #5b8a8a; }
  #auth-card .auth-submit { width: 100%; border: none; background: #5b8a8a; color: #fff;
    border-radius: 8px; padding: 11px; font-size: 14px; cursor: pointer; }
  #auth-err { color: #c0392b; font-size: 12px; min-height: 16px; margin-bottom: 6px; text-align: center; }
  .hidden { display: none !important; }
  @media (max-width: 760px) { #sidebar { width: 240px; min-width: 240px; } }
</style>
</head>
<body>
  <!-- 左侧栏 -->
  <div id="sidebar">
    <h1>🌿 心灵陪伴</h1>
    <div class="sub">多角色心理医生 · RAG 知识增强</div>
    <div class="sec-title">选择你的心理医生</div>
    <div id="persona-list"></div>
    <div class="sec-title">历史会话</div>
    <div id="conv-list"></div>
    <div id="user-bar">
      <span id="user-name">未登录</span>
      <button id="logout-btn" class="hidden" onclick="logout()">退出</button>
    </div>
  </div>

  <!-- 右侧主区 -->
  <div id="main" style="position:relative">
    <div id="disclaimer">本系统仅提供心理陪伴与心理教育，不进行医学诊断、不开药、不替代线下就医。如有紧急情况请拨打 120 / 心理援助热线 12356。</div>
    <div id="chat-head"><span class="doc-name" id="head-name">欢迎</span><span class="doc-type" id="head-type"></span></div>
    <div id="chat-area"></div>
    <div id="input-bar">
      <textarea id="msg-input" placeholder="写下你想说的…（Enter 发送，Shift+Enter 换行）" disabled></textarea>
      <button id="send-btn" onclick="send()" disabled>发送</button>
    </div>

    <!-- 登录/注册 -->
    <div id="auth-mask">
      <div id="auth-card">
        <h2>心灵陪伴</h2>
        <div class="auth-tabs">
          <button id="tab-login" class="on" onclick="switchTab('login')">登录</button>
          <button id="tab-reg" onclick="switchTab('reg')">注册</button>
        </div>
        <input id="in-user" placeholder="用户名" autocomplete="username">
        <input id="in-pass" type="password" placeholder="密码（至少 8 位）" autocomplete="current-password">
        <input id="in-nick" class="hidden" placeholder="昵称（可选）" autocomplete="nickname">
        <div id="auth-err"></div>
        <button class="auth-submit" id="auth-submit" onclick="submitAuth()">登 录</button>
      </div>
    </div>
  </div>

<script>
const API = '/api/v1';
const AVATAR_COLORS = ['#7fa8a0', '#c0996b', '#9a86b8', '#b87f92', '#7f9fb8'];
const PERSONA_ICONS = { humanistic_lin: '🌷', cbt_chen: '🧩', mindfulness_zhou: '🍃' };

const state = {
  token: localStorage.getItem('token') || '',
  username: localStorage.getItem('username') || '',
  personas: [],
  persona: null,          // 当前选中的角色
  conversations: [],
  convId: null,           // 当前会话 ID
  streaming: false,
};

const $ = (id) => document.getElementById(id);
const chatArea = $('chat-area');

/* ================= 认证 ================= */
function switchTab(tab) {
  $('tab-login').classList.toggle('on', tab === 'login');
  $('tab-reg').classList.toggle('on', tab === 'reg');
  $('in-nick').classList.toggle('hidden', tab === 'login');
  $('auth-submit').textContent = tab === 'login' ? '登 录' : '注 册';
  $('auth-err').textContent = '';
}
$('in-pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitAuth(); });

async function submitAuth() {
  const username = $('in-user').value.trim();
  const password = $('in-pass').value;
  const err = $('auth-err');
  if (!username || !password) { err.textContent = '请输入用户名和密码'; return; }
  const isReg = $('tab-reg').classList.contains('on');
  const body = isReg
    ? { username, password, nickname: $('in-nick').value.trim() || username }
    : { username, password };
  try {
    if (isReg) await api('POST', '/auth/register', body, false);
    const login = await api('POST', '/auth/login', { username, password }, false);
    state.token = login.data.access_token;
    state.username = username;
    localStorage.setItem('token', state.token);
    localStorage.setItem('username', username);
    $('auth-mask').classList.add('hidden');
    $('user-name').textContent = username;
    $('logout-btn').classList.remove('hidden');
    await loadPersonas();
    await loadConversations();
    greet();
  } catch (e) {
    err.textContent = e.message || '操作失败';
  }
}

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('username');
  location.reload();
}

/* ================= API 帮助函数 ================= */
async function api(method, path, body, auth = true) {
  const headers = { 'Content-Type': 'application/json' };
  if (auth && state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const resp = await fetch(API + path, {
    method, headers, body: body ? JSON.stringify(body) : undefined,
  });
  if (resp.status === 401) { logout(); throw new Error('登录已过期，请重新登录'); }
  const json = await resp.json().catch(() => ({}));
  if (!resp.ok || json.code !== 0) throw new Error(json.message || ('请求失败 ' + resp.status));
  return json;
}

/* ================= 初始化 ================= */
window.addEventListener('DOMContentLoaded', async () => {
  if (!state.token) return; // 停留在登录卡片
  $('user-name').textContent = state.username;
  $('logout-btn').classList.remove('hidden');
  try {
    await loadPersonas();
    await loadConversations();
    $('auth-mask').classList.add('hidden');
    greet();
  } catch (e) {
    console.error(e);
  }
});

function greet() {
  chatArea.innerHTML = '';
  const hint = document.createElement('div');
  hint.className = 'empty-hint';
  hint.innerHTML = '左侧选择一位心理医生，开始你们的对话。<br>你可以聊聊情绪、压力、睡眠、人际关系…';
  chatArea.appendChild(hint);
  $('head-name').textContent = '欢迎';
  $('head-type').textContent = '';
}

/* ================= 角色 ================= */
async function loadPersonas() {
  const resp = await api('GET', '/personas', null, false);
  state.personas = resp.data.items || [];
  const box = $('persona-list');
  box.innerHTML = '';
  state.personas.forEach((p) => {
    const card = document.createElement('div');
    card.className = 'persona-card';
    card.onclick = () => newConversation(p);
    const avatar = document.createElement('div');
    avatar.className = 'persona-avatar';
    avatar.style.background = AVATAR_COLORS[(p.id - 1) % AVATAR_COLORS.length];
    avatar.textContent = PERSONA_ICONS[p.persona_code] || p.name.charAt(0);
    const info = document.createElement('div');
    info.className = 'persona-info';
    info.innerHTML = '<div class="p-name"></div><div class="p-type"></div>';
    info.querySelector('.p-name').textContent = p.name;
    info.querySelector('.p-type').textContent = p.therapy_type || '';
    card.appendChild(avatar); card.appendChild(info);
    box.appendChild(card);
  });
}

/* ================= 会话 ================= */
async function loadConversations() {
  const resp = await api('GET', '/conversations?limit=30');
  state.conversations = resp.data.items || resp.data || [];
  renderConversations();
}

function renderConversations() {
  const box = $('conv-list');
  box.innerHTML = '';
  state.conversations.forEach((c) => {
    const item = document.createElement('div');
    item.className = 'conv-item' + (c.id === state.convId ? ' active' : '');
    item.onclick = () => openConversation(c);
    const title = document.createElement('span');
    title.className = 'c-title';
    title.textContent = c.title || ('会话 #' + c.id);
    const del = document.createElement('button');
    del.className = 'conv-del';
    del.textContent = '✕';
    del.title = '删除会话';
    del.onclick = (e) => { e.stopPropagation(); deleteConversation(c); };
    item.appendChild(title); item.appendChild(del);
    box.appendChild(item);
  });
}

async function newConversation(persona) {
  state.persona = persona;
  state.convId = null;
  document.querySelectorAll('.persona-card').forEach((el, i) =>
    el.classList.toggle('active', state.personas[i] && state.personas[i].id === persona.id));
  $('head-name').textContent = persona.name;
  $('head-type').textContent = persona.therapy_type || '';
  renderConversations();
  chatArea.innerHTML = '';
  addBubble('assistant', persona.greeting || '你好，我在听。');
  enableInput();
}

async function openConversation(c) {
  const persona = state.personas.find((p) => p.id === c.persona_id) ||
    { id: c.persona_id, name: c.persona_name || '医生', therapy_type: c.persona_code || '' };
  state.persona = persona;
  state.convId = c.id;
  document.querySelectorAll('.persona-card').forEach((el, i) =>
    el.classList.toggle('active', state.personas[i] && state.personas[i].id === persona.id));
  document.querySelectorAll('.conv-item').forEach((el) => el.classList.remove('active'));
  event.currentTarget && event.currentTarget.classList && event.currentTarget.classList.add('active');
  $('head-name').textContent = persona.name;
  $('head-type').textContent = persona.therapy_type || '';
  chatArea.innerHTML = '';
  try {
    const resp = await api('GET', `/conversations/${c.id}/messages?limit=50&offset=0`);
    (resp.data.items || []).forEach((m) => addBubble(m.role, m.content));
    if (!(resp.data.items || []).length) addBubble('assistant', persona.greeting || '你好，我在听。');
  } catch (e) {
    addError(e.message);
  }
  enableInput();
  scrollBottom();
}

async function deleteConversation(c) {
  if (!confirm('确定删除会话「' + (c.title || c.id) + '」吗？')) return;
  try {
    await api('DELETE', `/conversations/${c.id}`);
    if (state.convId === c.id) { state.convId = null; greet(); disableInput(); }
    await loadConversations();
  } catch (e) { alert('删除失败：' + e.message); }
}

/* ================= 消息渲染 ================= */
function addBubble(role, text) {
  chatArea.querySelector('.empty-hint') && chatArea.querySelector('.empty-hint').remove();
  const msg = document.createElement('div');
  msg.className = 'msg ' + (role === 'user' ? 'user' : role === 'error' ? 'error assistant' : 'assistant');
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  msg.appendChild(bubble);
  chatArea.appendChild(msg);
  scrollBottom();
  return bubble;
}

function addCrisisTip(text) {
  const tip = document.createElement('div');
  tip.className = 'crisis-tip';
  tip.textContent = text.trim();
  chatArea.appendChild(tip);
  scrollBottom();
}

function addRefs(references) {
  if (!references || !references.length) return;
  const details = document.createElement('details');
  details.className = 'refs msg assistant';
  const summary = document.createElement('summary');
  summary.textContent = '📚 知识来源（' + references.length + ' 条）';
  details.appendChild(summary);
  references.forEach((r) => {
    const line = document.createElement('div');
    line.textContent = '· ' + (r.source || '未知来源') + '（相关度 ' + (r.score ?? '-') + '）';
    line.style.marginTop = '3px';
    details.appendChild(line);
  });
  chatArea.appendChild(details);
}

function addError(text) { addBubble('error', '⚠ ' + text); scrollBottom(); }

function scrollBottom() { chatArea.scrollTop = chatArea.scrollHeight; }

function enableInput() { $('msg-input').disabled = false; $('send-btn').disabled = false; }
function disableInput() { $('msg-input').disabled = true; $('send-btn').disabled = true; }

/* ================= 发送与流式解析 ================= */
$('msg-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('msg-input').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 130) + 'px';
});

async function send() {
  const input = $('msg-input');
  const text = input.value.trim();
  if (!text || state.streaming) return;
  if (!state.persona) { alert('请先在左侧选择一位心理医生'); return; }

  input.value = ''; input.style.height = 'auto';
  addBubble('user', text);
  state.streaming = true;
  $('send-btn').disabled = true;

  // 助手气泡（流式追加）
  const bubble = addBubble('assistant', '');
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  bubble.appendChild(cursor);
  let got = false;

  try {
    const resp = await fetch(API + '/chat/stream', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + state.token,
      },
      body: JSON.stringify({
        persona_id: state.persona.id,
        conversation_id: state.convId,
        message: text,
      }),
    });
    if (resp.status === 401) { logout(); return; }
    if (!resp.ok) {
      const j = await resp.json().catch(() => ({}));
      throw new Error(j.message || ('请求失败 ' + resp.status));
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let crisisNotice = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const raw = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        let eventType = 'message', dataStr = '';
        raw.split('\n').forEach((line) => {
          if (line.startsWith('event:')) eventType = line.slice(6).trim();
          else if (line.startsWith('data:')) dataStr += line.slice(5).trim();
        });
        if (!dataStr) continue;
        let payload;
        try { payload = JSON.parse(dataStr); } catch { continue; }

        if (eventType === 'meta') {
          if (state.convId !== payload.conversation_id) {
            state.convId = payload.conversation_id;
            loadConversations(); // 新会话出现，刷新列表
          }
        } else if (eventType === 'delta') {
          got = true;
          cursor.remove();
          bubble.textContent += payload.content;
          bubble.appendChild(cursor);
          scrollBottom();
        } else if (eventType === 'error') {
          throw new Error(payload.message || '生成失败');
        } else if (eventType === 'done') {
          cursor.remove();
          if (payload.crisis_detected) {
            crisisNotice = '如果此刻你有伤害自己或他人的想法，请立即联系心理援助热线 12356、急救 120 或报警 110，也可以前往当地精神卫生中心急诊。';
          }
          addRefs(payload.references);
        }
      }
    }
    if (!got) bubble.textContent = bubble.textContent || '（服务没有返回内容，请稍后再试）';
    if (crisisNotice) addCrisisTip(crisisNotice);
    if (!bubble.textContent.trim()) bubble.textContent = '（本次回复为空，请重试）';
  } catch (e) {
    cursor.remove();
    if (!bubble.textContent) bubble.textContent = '';
    addError(e.message || '网络异常，请稍后再试');
  } finally {
    state.streaming = false;
    $('send-btn').disabled = false;
    $('msg-input').focus();
    scrollBottom();
  }
}
</script>
</body>
</html>
