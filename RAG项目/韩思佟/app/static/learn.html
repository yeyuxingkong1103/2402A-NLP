de": "    return run_query(database, sql, values, fetch)  # run_query负责执行；成功commit，失败rollback，最后一定close。", "explanation": "这行真正执行井号左边的代码。它的用途是：run_query负责执行；成功commit，失败rollback，最后一定close。井号右边只是中文说明，不会参与程序运行。", "section": "query()"}, {"line": 51, "code": "def init_database():", "explanation": "这里定义init_database函数；括号里的空参数是调用方交进来的输入，下面缩进代码负责处理，return负责把结果交回去。", "section": "init_database()"}, {"line": 52, "code": "    \"\"\"服务启动时创建用户表、角色表和唯一的医生角色。\"\"\"", "explanation": "这是给人看的函数说明：“服务启动时创建用户表、角色表和唯一的医生角色。”。它说明本步骤的输入、处理或输出；Python会保存这段说明，但不会把它当业务步骤执行。", "section": "init_database()"}, {"line": 53, "code": "    prepare_database(query, DOCTOR_PROMPT)", "explanation": "把统一query函数和医生提示词交给辅助模块，用来创建用户表、角色表，并保证MySQL里存在唯一医生角色。", "section": "init_database()"}, {"line": 54, "code": "# Redis部分：键中带用户ID和角色ID，所以多个用户的聊天不会混在一起。", "explanation": "这是阅读提示：“Redis部分：键中带用户ID和角色ID，所以多个用户的聊天不会混在一起”。井号表示本行只给人看，Python不会执行；它帮助你知道接下来进入哪一步。", "section": "init_database()"}, {"line": 55, "code": "class Memory:", "explanation": "这里定义Memory类，相当于把相关数据和操作装进一个工具箱；下面缩进的函数都属于它。", "section": "class Memory"}, {"line": 56, "code": "    def __init__(self):", "explanation": "这里定义__init__函数；括号里的self是调用方交进来的输入，下面缩进代码负责处理，return负责把结果交回去。", "section": "__init__()"}, {"line": 57, "code": "        \"\"\"按RAG_REDIS_URL连接；decode_responses=True让Redis字节自动变成中文字符串。\"\"\"", "explanation": "这是给人看的函数说明：“按RAG_REDIS_URL连接；decode_responses=True让Redis字节自动变成中文字符串。”。它说明本步骤的输入、处理或输出；Python会保存这段说明，但不会把它当业务步骤执行。", "section": "__init__()"}, {"line": 58, "code": "        self.client = redis.Redis.from_url(", "explanation": "这行先计算等号右边，再把结果保存到“self.client”；后面的代码可以继续使用这个值。", "section": "__init__()"}, {"line": 59, "code": "            setting(\"RAG_REDIS_URL\", \"redis://127.0.0.1:6379/0\"),", "explanation": "这是Redis连接地址参数：优先用环境变量，未配置时连接本机6379端口的0号数据库。", "section": "__init__()"}, {"line": 60, "code": "            decode_responses=True, socket_timeout=5,", "explanation": "这是多行函数定义或调用中的“decode_responses”参数；调用者不传时默认使用True, socket_timeout=5。末尾逗号表示后面还有参数，本行本身不会单独运行。", "section": "__init__()"}, {"line": 61, "code": "        )", "explanation": "这是上一条多行结构的收尾符号，用来告诉Python列表、调用或字典到这里结束。", "section": "__init__()"}, {"line": 62, "code": "    def key(self, user_id, role_id):", "explanation": "这里定义key函数；括号里的self, user_id, role_id是调用方交进来的输入，下面缩进代码负责处理，return负责把结果交回去。", "section": "key()"}, {"line": 63, "code": "        \"\"\"参数：用户ID、角色ID；返回：例如 chat:1:1 的Redis键。\"\"\"", "explanation": "这是给人看的函数说明：“参数：用户ID、角色ID；返回：例如 chat:1:1 的Redis键。”。它说明本步骤的输入、处理或输出；Python会保存这段说明，但不会把它当业务步骤执行。", "section": "key()"}, {"line": 64, "code": "        return f\"chat:{user_id}:{role_id}\"", "explanation": "这行结束当前函数，并把后面的结果交回调用它的上一层；后续同级代码不会再执行。", "section": "key()"}, {"line": 65, "code": "    def history(self, user_id, role_id):", "explanation": "这里定义history函数；括号里的self, user_id, role_id是调用方交进来的输入，下面缩进代码负责处理，return负责把结果交回去。", "section": "history()"}, {"line": 66, "code": "        \"\"\"LRANGE的-20到-1表示最后20条，也就是最近10轮一问一答。\"\"\"", "explanation": "这是给人看的函数说明：“LRANGE的-20到-1表示最后20条，也就是最近10轮一问一答。”。它说明本步骤的输入、处理或输出；Python会保存这段说明，但不会把它当业务步骤执行。", "section": "history()"}, {"line": 67, "code": "        messages = self.client.lrange(self.key(user_id, role_id), -20, -1)", "explanation": "先由用户ID和角色ID生成Redis键，再从列表倒数第20条读到最后一条；输入是会话身份，输出是最近十轮问答字符串列表。", "section": "history()"}, {"line": 68, "code": "        history_text = \"\\n\".join(messages)[-1600:]  # 再限制为最后1600字，避免历史把提示词挤得过长。", "explanation": "这行真正执行井号左边的代码。它的用途是：再限制为最后1600字，避免历史把提示词挤得过长。井号右边只是中文说明，不会参与程序运行。", "section": "history()"}, {"line": 69, "code": "        return history_text or \"（无历史对话）\"", "explanation": "这行结束当前函数，并把后面的结果交回调用它的上一层；后续同级代码不会再执行。", "section": "history()"}, {"line": 70, "code": "    def add(self, user_id, role_id, question, answer):", "explanation": "这里定义add函数；括号里的self, user_id, role_id, question, answer是调用方交进来的输入，下面缩进代码负责处理，return负责把结果交回去。", "section": "add()"}, {"line": 71, "code": "        \"\"\"输入一问一答；用Redis事务追加、裁剪并把TTL刷新为默认86400秒（1天）。\"\"\"", "explanation": "这是给人看的函数说明：“输入一问一答；用Redis事务追加、裁剪并把TTL刷新为默认86400秒（1天）。”。它说明本步骤的输入、处理或输出；Python会保存这段说明，但不会把它当业务步骤执行。", "section": "add()"}, {"line": 72, "code": "        memory_key = self.key(user_id, role_id)", "explanation": "这行先计算等号右边，再把结果保存到“memory_key”；后面的代码可以继续使用这个值。", "section": "add()"}, {"line": 73, "code": "        pipe = self.client.pipeline(transaction=True)  # pipeline把下面命令打包发送；transaction=True保证一起执行。", "explanation": "这行真正执行井号左边的代码。它的用途是：pipeline把下面命令打包发送；transaction=True保证一起执行。井号右边只是中文说明，不会参与程序运行。", "section": "add()"}, {"line": 74, "code": "        pipe.rpush(memory_key, f\"用户：{question}\", f\"助手：{answer}\")  # RPUSH把“用户问题、助手回答”追加到列表尾部。", "explanation": "这行真正执行井号左边的代码。它的用途是：RPUSH把“用户问题、助手回答”追加到列表尾部。井号右边只是中文说明，不会参与程序运行。", "section": "add()"}, {"line": 75, "code": "        pipe.ltrim(memory_key, -20, -1)  # LTRIM只保留最后20条，旧消息自动丢弃。", "explanation": "这行真正执行井号左边的代码。它的用途是：LTRIM只保留最后20条，旧消息自动丢弃。井号右边只是中文说明，不会参与程序运行。", "section": "add()"}, {"line": 76, "code": "        pipe.expire(memory_key, int(setting(\"RAG_MEMORY_TTL_SECONDS\", \"86400\")))  # EXPIRE设置过期秒数，默认86400秒=1天。", "explanation": "这行真正执行井号左边的代码。它的用途是：EXPIRE设置过期秒数，默认86400秒=1天。井号右边只是中文说明，不会参与程序运行。", "section": "add()"}, {"line": 77, "code": "        pipe.execute()  # EXECUTE真正把上面三个Redis命令提交。", "explanation": "这行真正执行井号左边的代码。它的用途是：EXECUTE真正把上面三个Redis命令提交。井号右边只是中文说明，不会参与程序运行。", "section": "add()"}, {"line": 78, "code": "    def clear(self, user_id, role_id):", "explanation": "这里定义clear函数；括号里的self, user_id, role_id是调用方交进来的输入，下面缩进代码负责处理，return负责把结果交回去。", "section": "clear()"}, {"line": 79, "code": "        \"\"\"只删除指定用户和角色的短期记忆。\"\"\"", "explanation": "这是给人看的函数说明：“只删除指定用户和角色的短期记忆。”。它说明本步骤的输入、处理或输出；Python会保存这段说明，但不会把它当业务步骤执行。", "section": "clear()"}, {"line": 80, "code": "        self.client.delete(self.key(user_id, role_id))", "explanation": "先用用户ID和角色ID算出Redis键，再删除这一个会话；不会清掉其他用户或Milvus医学知识。", "section": "clear()"}, {"line": 81, "code": "def tokens(text):", "explanation": "这里定义tokens函数；括号里的text是调用方交进来的输入，下面缩进代码负责处理，return负责把结果交回去。", "section": 导入与配置"}, {"line": 32, "code": "# retrieved是系统实际返回的块号；relevant是人工提前标好的正确块号。", "explanation": "这是阅读提示：“retrieved是系统实际返回的块号；relevant是人工提前标好的正确块号”。井号表示本行只给人看，Python不会执行；它帮助你知道接下来进入哪一步。", "section": "导入与配置"}, {"line": 33, "code": "# 例：retrieved=[9, 21, 19, 3]、relevant=[19, 21]、K=4：命中两个正确块，", "explanation": "这是阅读提示：“例：retrieved=[9, 21, 19, 3]、relevant=[19, 21]、K=4：命中两个正确块，”。井号表示本行只给人看，Python不会执行；它帮助你知道接下来进入哪一步。", "section": "导入与配置"}, {"line": 34, "code": "# 所以hit=1、recall=2/2=1、precision=2/4=0.5，首个正确块排第2，所以MRR=1/2=0.5。", "explanation": "这是阅读提示：“所以hit=1、recall=2/2=1、precision=2/4=0.5，首个正确块排第2，所以MRR=1/2=0.5”。井号表示本行只给人看，Python不会执行；它帮助你知道接下来进入哪一步。", "section": "导入与配置"}, {"line": 35, "code": "# row表示“某一道题在某一种方案下的一条结果”；同一道题做前后对比会有两条row。", "explanation": "这是阅读提示：“row表示“某一道题在某一种方案下的一条结果”；同一道题做前后对比会有两条row”。井号表示本行只给人看，Python不会执行；它帮助你知道接下来进入哪一步。", "section": "导入与配置"}, {"line": 36, "code": "# variant=hybrid表示混合检索，variant=hybrid_rerank表示混合检索后再用BGE精排。", "explanation": "这是阅读提示：“variant=hybrid表示混合检索，variant=hybrid_rerank表示混合检索后再用BGE精排”。井号表示本行只给人看，Python不会执行；它帮助你知道接下来进入哪一步。", "section": "导入与配置"}, {"line": 37, "code": "# 检索row的status为ok/failed；RAGAS row会依次经历pending、generated、evaluated，", "explanation": "这是阅读提示：“检索row的status为ok/failed；RAGAS row会依次经历pending、generated、evaluated，”。井号表示本行只给人看，Python不会执行；它帮助你知道接下来进入哪一步。", "section": "导入与配置"}, {"line": 38, "code": "# 指标部分失败为partial_failure，检索或回答失败为generation_failed，裁判失败为evaluation_failed。", "explanation": "这是阅读提示：“指标部分失败为partial_failure，检索或回答失败为generation_failed，裁判失败为evaluation_failed”。井号表示本行只给人看，Python不会执行；它帮助你知道接下来进入哪一步。", "section": "导入与配置"}, {"line": 41, "code": "# ---------- 1. 检索指标：用人工标注检查找回的知识块 ----------", "explanation": "这是阅读提示：“---------- 1. 检索指标：用人工标注检查找回的知识块 ----------”。井号表示本行只给人看，Python不会执行；它帮助你知道接下来进入哪一步。", "section": "导入与配置"}, {"line": 42, "code": "def retrieval_score_case(retrieved, relevant, top_k=4):", "explanation": "这里定义retrieval_score_case函数；括号里的retrieved, relevant, top_k=4是调用方交进来的输入，下面缩进代码负责处理，return负责把结果交回去。", "section": "retrieval_score_case()"}, {"line": 43, "code": "    \"\"\"输入系统块号、正确块号和K；处理匹配关系；输出一道题的四项指标。\"\"\"", "explanation": "这是给人看的函数说明：“输入系统块号、正确块号和K；处理匹配关系；输出一道题的四项指标。”。它说明本步骤的输入、处理或输出；Python会保存这段说明，但不会把它当业务步骤执行。", "section": "retrieval_score_case()"}, {"line": 44, "code": "    if top_k < 1:  # K表示只看前几个结果，必须至少为1。", "explanation": "这行真正执行井号左边的代码。它的用途是：K表示只看前几个结果，必须至少为1。井号右边只是中文说明，不会参与程序运行。", "section": "retrieval_score_case()"}, {"line": 45, "code": "        raise ValueError(\"top_k必须为正整数\")", "explanation": "这行主动停止当前流程并抛出错误，让接口把失败原因返回，而不是继续产生错误结果。", "section": "retrieval_score_case()"}, {"line": 46, "code": "    ranked, seen = [], set()  # ranked保持名次；seen用于去掉重复知识块。", "explanation": "这行真正执行井号左边的代码。它的用途是：ranked保持名次；seen用于去掉重复知识块。井号右边只是中文说明，不会参与程序运行。", "section": "retrieval_score_case()"}, {"line": 47, "code": "    for chunk_id in retrieved:", "explanation": "这行开始循环：每次取出一个元素交给临时变量，再重复执行下面缩进的处理。", "section": "retrieval_score_case()"}, {"line": 48, "code": "        if chunk_id not in seen:", "explanation": "这行判断冒号前的条件；条件成立才执行下面缩进的代码，否则跳过该分支。", "section": "retrieval_score_case()"}, {"line": 49, "code": "            ranked.append(chunk_id)", "explanation": "这行调用append函数。括号里的值是输入；函数执行后可能返回结果，或直接更新列表、文件、数据库等对象，随后流程继续向下。", "section": "retrieval_score_case()"}, {"line": 50, "code": "            seen.add(chunk_id)", "explanation": "这行调用add函数。括号里的值是输入；函数执行后可能返回结果，或直接更新列表、文件、数据库等对象，随后流程继续向下。", "section": "retrieval_score_case()"}, {"line": 51, "code": "        if len(ranked) == top_k:  # 收够前K个唯一结果后停止。", "explanation": "这行真正执行井号左边的代码。它的用途是：收够前K个唯一结果后停止。井号右边只是中文说明，不会参与程序运行。", "section": "retrieval_score_case()"}, {"line": 52, "code": "            break", "explanation": "满足前面的条件后立刻结束当前循环；程序接着执行循环后面的代码。", "section": "retrieval_score_case()"}, {"line": 54, "code": "    expected = set(relevant)  # 集合适合做交集，也会去掉重复标注。", "explanation": "这行真正执行井号左边的代码。它的用途是：集合适合做交集，也会去掉重复标注。井号右边只是中文说明，不会参与程序运行。", "section": "retrieval_score_case()"}, {"line": 55, "code": "    if not expected:  # 空正确答案表示知识库范围外的问题。",  67, "code": "        \"recall_at_k\": len(matched) / len(expected),  # 找回正确数÷应找回数。", "explanation": "Recall@K公式：已找回正确块数量÷人工标注正确块总数；越接近1说明漏掉的正确资料越少。", "section": "retrieval_score_case()"}, {"line": 68, "code": "        \"precision_at_k\": len(matched) / top_k,  # 找回正确数÷K个位置。", "explanation": "Precision@K公式：已找回正确块数量÷展示位置K；越接近1说明混入的无关资料越少。", "section": "retrieval_score_case()"}, {"line": 69, "code": "        \"mrr\": 1 / first_rank if first_rank else 0.0,  # 首个正确名次的倒数。", "explanation": "MRR公式：第一个正确块在第几名就算1÷名次；第一名1分、第二名0.5分，完全没命中为0。", "section": "retrieval_score_case()"}, {"line": 70, "code": "        \"out_of_scope_correct\": None,", "explanation": "这是多行文字的一部分，会与相邻内容一起组成提示词或配置文本。", "section": "retrieval_score_case()"}, {"line": 71, "code": "        \"matched\": sorted(matched),", "explanation": "这是多行文字的一部分，会与相邻内容一起组成提示词或配置文本。", "section": "retrieval_score_case()"}, {"line": 72, "code": "    }", "explanation": "这是上一条多行结构的收尾符号，用来告诉Python列表、调用或字典到这里结束。", "section": "retrieval_score_case()"}, {"line": 75, "code": "def retrieval_summarize(results):", "explanation": "这里定义retrieval_summarize函数；括号里的results是调用方交进来的输入，下面缩进代码负责处理，return负责把结果交回去。", "section": "retrieval_summarize()"}, {"line": 76, "code": "    \"\"\"输入所有逐题结果；按方案只平均成功题；输出重排前后汇总。\"\"\"", "explanation": "这是给人看的函数说明：“输入所有逐题结果；按方案只平均成功题；输出重排前后汇总。”。它说明本步骤的输入、处理或输出；Python会保存这段说明，但不会把它当业务步骤执行。", "section": "retrieval_summarize()"}, {"line": 77, "code": "    summary, variants = {}, set()", "explanation": "这行先计算等号右边，再把结果保存到“summary, variants”；后面的代码可以继续使用这个值。", "section": "retrieval_summarize()"}, {"line": 78, "code": "    for row in results:", "explanation": "这行开始循环：每次取出一个元素交给临时变量，再重复执行下面缩进的处理。", "section": "retrieval_summarize()"}, {"line": 79, "code": "        variants.add(row[\"variant\"])  # variant是hybrid或hybrid_rerank。", "explanation": "这行真正执行井号左边的代码。它的用途是：variant是hybrid或hybrid_rerank。井号右边只是中文说明，不会参与程序运行。", "section": "retrieval_summarize()"}, {"line": 80, "code": "    for variant in sorted(variants):", "explanation" ction": "导入与配置"}, {"line": 11, "code": "from datetime import datetime, timezone  # 给报告记录带时区的生成时间。", "explanation": "这行真正执行井号左边的代码。它的用途是：给报告记录带时区的生成时间。井号右边只是中文说明，不会参与程序运行。", "section": "导入与配置"}, {"line": 12, "code": "from pathlib import Path  # 兼容Windows和Ubuntu的文件路径写法。", "explanation": "这行真正执行井号左边的代码。它的用途是：兼容Windows和Ubuntu的文件路径写法。井号右边只是中文说明，不会参与程序运行。", "section": "导入与配置"}, {"line": 14, "code": "BASE = Path(__file__).resolve().parents[1]  # 当前文件向上两级得到项目根目录。", "explanation": "这行真正执行井号左边的代码。它的用途是：当前文件向上两级得到项目根目录。井号右边只是中文说明，不会参与程序运行。", "section": "导入与配置"}, {"line": 15, "code": "JTL_COLUMNS = {  # 这些列共同描述开始时间、耗时、并发、HTTP结果和断言结果。", "explanation": "这行真正执行井号左边的代码。它的用途是：这些列共同描述开始时间、耗时、并发、HTTP结果和断言结果。井号右边只是中文说明，不会参与程序运行。", "section": "导入与配置"}, {"line": 16, "code": "    \"timeStamp\", \"elapsed\", \"label\", \"responseCode\",", "explanation": "这是多行文字的一部分，会与相邻内容一起组成提示词或配置文本。", "section": "导入与配置"}, {"line": 17, "code": "    \"success\", \"failureMessage\", \"grpThreads\", \"URL\",", "explanation": "这是多行文字的一部分，会与相邻内容一起组成提示词或配置文本。", "section": "导入与配置"}, {"line": 18, "code": "}", "explanation": "这是上一条多行结构的收尾符号，用来告诉Python列表、调用或字典到这里结束。", "section": "导入与配置"}, {"line": 21, "code": "def percentile(values, ratio):", "explanation": "这里定义percentile函数；括号里的values, ratio是调用方交进来的输入，下面缩进代码负责处理，return负责把结果交回去。", "section": "percentile()"}, {"line": 22, "code": "    \"\"\"输入延迟列表和比例（0.95就是P95）；用最近名次法输出分位延迟或None。\"\"\"", "explanation": "这是给人看的函数说明：“输入延迟列表和比例（0.95就是P95）；用最近名次法输出分位延迟或None。”。它说明本步骤的输入、处理或输出；Python会保存这段说明，但不会把它当业务步骤执行。", "section": "percentile()"}, {"line": 23, "code": "    if not values:  # 空列表没有P95，明确返回None，不编造0毫秒。", "explanation": "这行真正执行井号左边的代码。它的用途是：空列表没有P95，明确返回None，不编造0毫秒。井号右边只是中文说明，不会参与程序运行。", "section": "percentile()"}, {"line": 24, "code": "        return None", "explanation": "这行结束当前函数，并把后面的结果交回调用它的上一层；后续同级代码不会再执行。", "section": "percentile()"}, {"line": 25, "code": "    ordered = sorted(values)  # 新建从快到慢的列表，不修改调用者的原列表。", "explanation": "这行真正执行井号左边的代码。它的用途是：新建从快到慢的列表，不修改调用者的原列表。井号右边只是中文说明，不会参与程序运行。", "section": "percentile()"}, {"line": 26, "code": "    rank = math.ceil(ratio * len(ordered))  # 例如20条的P95名次=ceil(0.95×20)=19。", "explanation": "输入分位比例和样本数；最近名次法向上取整得到人的名次；例如20条的P95取排好序后的第19条。", "section": "percentile()"}, {"line": 27, "code": "    index = max(0, rank - 1)  # 人的名次从1开始，Python下标从0开始，所以减1。", "explanation": "把从1开始的名次减1换成Python下标，并用max防止小于0；输出index供下一行读取对应延迟。", "section": "percentile()"}, {"line": 28, "code": "    return round(ordered[index], 3)  # 输出毫秒并保留三位小数。", "explanation": "这行真正执行井号左边的代码。它的用途是：输出毫秒并保留三位小数。井号右边只是中文说明，不会参与程序运行。", "section": "percentile()"}, {"line": 31, "code": "def read_jtl(path, label=\"RAG_CHAT\"):", "explanation": "这里定义read_jtl函数；括号里的path, label=\"RAG_CHAT\"是调用方交进来的输入，下面缩进代码负责处理，return负责把结果交回去。", "section": "read_jtl()"}, {"line": 32, "code": "    \"\"\"输入：JTL路径和标签；处理：校验表头并筛选；输出：完整RAG采样记录。\"\"\"", "explanation": "这是给人看的函数说明：“输入：JTL路径和标签；处理：校验表头并筛选；输出：完整RAG采样记录。”。它说明本步骤的输入、处理或输出；Python会保存这段说明，但不会把它当业务步骤执行。", "section": "read_jtl()"}, {"line": 33, "code": "    path = Path(path)  # 字符串路径也统一转成Path，方便Windows和Ubuntu共用。", "explanation": "这行真正执行井号左边的代码。它的用途是：字符串路径也统一转成Path，方便Windows和Ubuntu共用。井号右边只是中文说明，不会参与程序运行。", "section": "read_jtl()"}, {"line": 34, "code": "    with path.open(\"r\", encoding=\"utf-8-sig\", newline=\"\") as handle:", "explanation": "这行打开一个受管理的资源；缩进代码结束后，Python会自动执行关闭或清理。", "section": "read_jtl()"}, {"line": 35, "code": "        reader = csv.DictReader(handle)  # 首行表头自动变成后续每个字典的键。", "explanation": "这行真正执行井号左边的代码。它的用途是：首行表头自动变成后续每个字典的键。井号右边只是中文说明，不会参与程序运行。", "section": "read_jtl()"}, {"line": 36, "code": "        missing = JTL_COLUMNS - set(reader.fieldnames or [])  # 计算必需列与实际列的差集。", "explanation": "这行真正执行井号左边的代码。它的用途是：计算必需列与实际列的差集。井号右边只是中文说明，不会参与程序运行。", "section": "read_jtl()"}, {"line": 37, "code": "        if missing:  # 缺列就无法可靠计算指标，因此立即停止并列出列名。", "explanation": "这行真正执行井号左边的代码。它的用途是：缺列就无法可靠计算指标，因此立即停止并列出列名。井号右边只是中文说明，不会参与程序运行。", "section": "read_jtl()"}, {"line": 38, "code": "            names = \", \".join(sorted(missing))", "explanation": "这行先计算等号右边，再把结果保存到“names”；后面的代码可以继续使用这个值。", "section": "read_jtl()"}, {"line": 39, "code": "            raise ValueError(f\"{path}缺少JTL列：{names}\")", "explanation": "这行主动停止当前流程并抛出错误，让接口把失败原因返回，而不是继续产生错误结果。", "section": "read_jtl()"}, {"line": 40, "code": "        rows = []  # 只收集RAG_CHAT，注册和清历史等准备请求不计入性能。", "explanation": "这行真正执行井号左边的代码。它的用途是：只收集RAG_CHAT，注册和清历史等准备请求不计入性能。井号右边只是中文说明，不会参与程序运行。", "section": "read_jtl()"}, {"line": 41, "code": "        for row in reader:", "explanation": "这行开始循环：每次取出一个元素交给临时变量，再重复执行下面缩进的处理。", "section": "read_jtl()"}, {"line": 42, "code": "            if row[\"label\"] == label:", "explanation": "这行判断冒号前的条件；条件成立才执行下面缩进的代码，否则跳过该分支。", "section": "read_jtl()"}, {"line": 43, "code": "                rows.append(row)", "explanation": "这行调用append函数。括号里的值是输入；函数执行后可能返回结果，或直接更新列表、文件、数据库等对象，随后流程继续向下。", "section": "read_jtl()"}, {"line": 44, "code": "    if not rows:  # 文件可能存在，但标签写错或测试没有真正发出问答请求。", "explanation": "这行真正执行井号左边的代码。它的用途是：文件可能存在，但标签写错或测试没有真正发出问答请求。井号右边只是中文说明，不会参与程序运行。", "section": "read_jtl()"}, {"line": 45, "code": "        raise ValueError(f\"{path}没有标签为{label}的样本\")", "explanation": "这行主动停止当前流程并抛出错误，让接口把失败原因返回，而不是继续产生错误结果。", "section": "read_jtl()"}, {"line": 46, "code": "    return rows", "explanation": "这行结束当前函数，并把后面的结果交回调用它的上一层；后续同级代码不会再执行。", "section": "read_jtl()"}, {"line": 49, "code": "def sample_passed(row):", "explanation": "这里定义sample_passed函数；括号里的row是调用方交进来的输入，下面缩进代码负责处理，return负责把结果交回去。", "section": "sample_passed()"}, {"line": 50, "code": "    \"\"\"输入：一条JTL记录；处理：同时检查HTTP与JMeter断言；输出：成功布尔值。\"\"\"", "explanation": "这是给人看的函数说明：“输入：一条JTL记录；处理：同时检查HTTP与JMeter断言；输出：成功布尔值。”。它说明本步骤的输入、处理或输出；Python会保存这段说明，但不会把它当业务步骤执行。", "section": "sample_passed()"}, {"line": 51, "code": "    http_ok = row[\"responseCode\"] == \"200\"  # 后端必须返回HTTP 200。", "explanation": "这行真正执行井号左边的代码。它的用途是：后端必须返回HTTP 200。井号右边只是中文说明，不会参与程序运行。", "section": "sample_passed()"}, {"line": 52, "code": "    assertions_ok = row[\"success\"].lower() == \"true\"  # answer、sources等断言也要通过。", "explanation": "这行真正执行井号左边的代码。它的用途是：answer、sources等断言也要通过。井号右边只是中文说明，不会参与程序运行。", "section": "sample_passed()"}, {"line": 53, "code": "    return http_ok and assertions_ok  # 200但回答字段为空仍算失败，不能虚报成功。", "explanation": "只有HTTP状态正常且JMeter业务断言也通过才返回True；接口200但answer或sources不合要求仍算失败。", "section": "sample_passed()"}, {"line": 56, "code": "def summarize_jtl(path, label=\"RAG_CHAT\"):", "explanation": "这里定义summarize_jtl函数；括号里的path, label=\"RAG_CHAT\"是调用方交进来的输入，下面缩进代码负责处理，return负责把结果交回去。", "section": "summarize_jtl()"}, {"line": 57, "code": "    \"\"\"输入：一档并发JTL；处理：判成功、算窗口/QPS/延迟；输出：本档指标字典。\"\"\"", "explanation": "这是给人看的函数说明：“输入：一档并发JTL；处理：判成功、算窗口/QPS/延迟；输出：本档指标字典。”。它说明本步骤的输入、处理或输出；Python会保存这段说明，但不会把它当业务步骤执行。", "section": "summarize_jtl()"}, {"line": 58, "code": "    rows = read_jtl(path, label)  # 第一步：读取并筛出完整RAG问答。", "explanation": "这行真正执行井号左边的代码。它的用途是：第一步：读取并筛出完整RAG问答。井号右边只是中文说明，不会参与程序运行。", "section": "summarize_jtl()"}, {"line": 59, "code": "    starts, latencies, passed = [], [], []  # 三个列表按同一顺序保存每条采样数据。", "explanation": "这行真正执行井号左边的代码。它的用途是：三个列表按同一顺序保存每条采样数据。井号右边只是中文说明，不会参与程序运行。", "section": "summarize_jtl()"}, {"line": 60, "code": "    concurrency = 0  # 最终取grpThreads最大值作为本档实际最大并发。", "explanation": "这行真正执行井号左边的代码。它的用途是：最终取grpThreads最大值作为本档实际最大并发。井号右边只是中文说明，不会参与程序运行。", "section": "summarize_jtl()"}, {"line": 61, "code": "    try:", "explanation": "这行开始尝试可能失败的操作；如果发生异常，程序会跳到后面的except分支处理。", "section": "summarize_jtl()"}, {"line": 62, "code": "        for row in rows:  # 逐行转换数值，避免复杂推导式让初学者难跟踪。", "explanation": "这行真正执行井号左边的代码。它的用途是：逐行转换数值，避免复杂推导式让初学者难跟踪。井号右边只是中文说明，不会参与程序运行。", "section": "summarize_jtl()"}, {"line": 63, "code": "            starts.append(int(row[\"timeStamp\"]))  # 请求开始时间，单位毫秒。", "explanation": "这行真正执行井号左边的代码。它的用途是：请求开始时间，单位毫秒。井号右边只是中文说明，不会参与程序运行。", "section": "summarize_jtl()"}, {"line": 64, "code": "            latencies.append(float(row[\"elapsed\"]))  # 完整问答耗时，单位毫秒。", "explanation": "这行真正执行井号左边的代码。它的用途是：完整问答耗时，单位毫秒。井号右边只是中文说明，不会参与程序运行。", "section": "summarize_jtl()"}, {"line": 65, "code": "            concurrency = max(concurrency, int(row[\"grpThreads\"]))", "explanation": "这行先计算等号右边，再把结果保存到“concurrency”；后面的代码可以继续使用这个值。", "section": "summarize_jtl()"}, {"line": 66, "code": "            passed.append(sample_passed(row))  # HTTP和业务断言都通过才记True。", "explanation": "这行真正执行井号左边的代码。它的用途是：HTTP和业务断言都通过才记True。井号右边只是中文说明，不会参与程序运行。", "section": "summarize_jtl()"}, {"line": 67, "code": "    except (TypeError, ValueError) as error:", "explanation": "这行捕获指定类型的异常并执行下面的补救代码，避免原始错误直接暴露给网页。", "section": "summarize_jtl()"}, {"line": 68, "code": "        raise ValueError(f\"{path}包含无效数值字段\") from error", "explanation": "这行主动停止当前流程并抛出错误，让接口把失败原因返回，而不是继续产生错误结果。", "section": "summarize_jtl()"}, {"line": 70, "code": "    successes = sum(passed)  # Python中True等于1，因此求和就是成功数量。", "explanation": "这行真正执行井号左边的代码。它的用途是：Python中True等于1，因此求和就是成功数量。井号右边只是中文说明，不会参与程序运行。", "section": "summarize_jtl()"}, {"line": 71, "code": "    failures = len(rows) - successes  # 总样本减去成功样本得到失败数。", "explanation": "这行真正执行井号左边的代码。它的用途是：总样本减去成功样本得到失败数。井号右边只是中文说明，不会参与程序运行。", "section": "summarize_jtl()"}, {"line": 72, "code": "    end_times = []  # 每个请求的结束时刻等于开始时刻加本次耗时。", "explanation": "这行真正执行井号左边的代码。它的用途是：每个请求的结束时刻等于开始时刻加本次耗时。井号右边只是中文说明，不会参与程序运行。", "section": "summarize_jtl()"}, {"line": 73, "code": "    for index in range(len(rows)):", "explanation": "这行开始循环：每次取出一个元素交给临时变量，再重复执行下面缩进的处理。", "section": "summarize_jtl()"}, {"line": 74, "code": "        end_times.append(starts[index] + latencies[index])", "explanation": "这行调用append函数。括号里的值是输入；函数执行后可能返回结果，或直接更新列表、文件、数据库等对象，随后流程继续向下。", "section": "summarize_jtl()"}, {"line": 75, "code": "    window_seconds = (max(end_times) - min(starts)) / 1000  # 从最早开始到最晚结束，毫秒转秒。", "explanation": "用最晚请求结束时刻减最早请求开始时刻，得到整档真实观测窗口；再把毫秒除以1000变成秒。", "section": "summarize_jtl()"}, {"line": 76, "code": "    qps = len(rows) / window_seconds if window_seconds else None  # QPS=问答总数÷观测秒数，不是1000÷平均延迟。", "explanation": "完整RAG QPS公式：问答请求总数÷整档观测秒数；窗口为0时返回None，不能用1000÷平均延迟冒充并发QPS。", "section": "summarize_jtl()"}, {"line": 78, "code": "    failure_counts = Counter()  # 失败时优先统计JMeter给出的业务断言消息。", "explanation": "这行真正执行井号左边的代码。它的用途是：失败时优先统计JMeter给出的业务断言消息。井号右边只是中文说明，不会参与程序运行。", "section": "summarize_jtl()"}, {"line": 79, "code": "    status_counts = Counter()  # 无论成功失败，都统计HTTP状态码便于排查。", "explanation": "这行真正执行井号左边的代码。它的用途是：无论成功失败，都统计HTTP状态码便于排查。井号右边只是中文说明，不会参与程序运行。", "section": "summarize_jtl()"}, {"line": 80, "code": "    for index, row in enumerate(rows):", "explanation": "这行开始循环：每次取出一个元素交给临时变量，再重复执行下面缩进的处理。", "section": "summarize_jtl()"}, {"line": 81, "code": "        status_counts[row[\"responseCode\"]] += 1", "explanation": "读取status_counts[row[\"responseCode\"]]原来的值，再按“+=”右边的数量更新它；更新结果仍保存回{name}，供本轮统计继续使用。", "section": "summarize_jtl()"}, {"line": 82, "code": "        if not passed[index]:", "explanation": "这行判断冒号前的条件；条件成立才执行下面缩进的代码，否则跳过该分支。", "section": "summarize_jtl()"}, {"line": 83, "code": "            reason = row[\"failureMessage\"].strip() or f\"HTTP {row['responseCode']}\"", "explanation": "这行先计算等号右边，再把结果保存到“reason”；后面的代码可以继续使用这个值。", "section": "summarize_jtl()"}, {"line": 84, "code": "            failure_counts[reason] += 1", "explanation": "读取failure_counts[reason]原来的值，再按“+=”右边的数量更新它；更新结果仍保存回{name}，供本轮统计继续使用。", "section": "summarize_jtl()"}, {"line": 86, "code": "    return {  # 输出字段会写入JSON，也会被markdown函数转成答辩表格。", "explanation": "这行真正执行井号左边的代码。它的用途是：输出字段会写入JSON，也会被markdown函数转成答辩表格。井号右边只是中文说明，不会参与程序运行。", "section": "summarize_jtl()"}, {"line": 87, "code": "        \"source\": str(path), \"target\": rows[0][\"URL\"], \"label\": label,", "explanation": "这是多行文字的一部分，会与相邻内容一起组成提示词或配置文本。", "section": "summarize_jtl()"}, {"line": 88, "code": "        \"concurrency\": concurrency, \"samples\": len(rows),", "explanation": "这是多行文字的一部分，会与相邻内容一起组成提示词或配置文本。", "section": "summarize_jtl()"}, {"line": 89, "code": "        \"successes\": successes, \"failures\": failures,", "explanation": "这是多行文字的一部分，会与相邻内容一起组成提示词或配置文本。", "section": "summarize_jtl()"}, {"line": 90, "code": "        \"error_rate\": round(failures / len(rows), 6),", "explanation": "这是多行文字的一部分，会与相邻内容一起组成提示词或配置文本。", "section": "summarize_jtl()"}, {"line": 91, "code": "        \"success_rate\": round(successes / len(rows), 6),", "explanation": "这是多行文字的一部分，会与相邻内容一起组成提示词或配置文本。", "section": "summarize_jtl()"}, {"line": 92, "code": "        \"window_seconds\": round(window_seconds, 3),", "explanation": "这是多行文字的一部分，会与相邻内容一起组成提示词或配置文本。", "section": "summarize_jtl()"}, {"line": 93, "code": "        \"throughput_qps\": round(qps, 6) if qps is not None else None,  # 所有请求吞吐。", "explanation": "这行真正执行井号左边的代码。它的用途是：所有请求吞吐。井号右边只是中文说明，不会参与程序运行。", "section": "summarize_jtl()"}, {"line": 94, "code": "        # 只有零失败时才叫“成功问答QPS”，否则不拿总请求吞吐掩盖错误。", "explanation": "这是阅读提示：“只有零失败时才叫“成功问答QPS”，否则不拿总请求吞吐掩盖错误”。井号表示本行只给人看，Python不会执行；它帮助你知道接下来进入哪一步。", "section": "summarize_jtl()"}, {"line": 95, "code": "        \"successful_qps\": round(qps, 6) if qps is not None and failures == 0 else None,", "explanation": "只有QPS算得出且这一档零失败，才公布成功问答QPS；只要有失败就输出None，避免用失败请求抬高性能。", "section": "summarize_jtl()"}, {"line": 96, "code": "        \"average_latency_ms\": round(sum(latencies) / len(latencies), 3),", "explanation": "这是多行文字的一部分，会与相邻内容一起组成提示词或配置文本。", "section": "summarize_jtl()"}, {"line": 97, "code": "        \"min_latency_ms\": round(min(latencies), 3),", "explanation": "这是多行文字的一部分，会与相邻内容一起组成提示词或配置文本。", "section": "summarize_jtl()"}, {"line": 98, "code": "        \"p50_latency_ms\": percentile(latencies, 0.50),", "explanation": "这是多行文字的一部分，会与相邻内容一起组成提示词或配置文本。", "section": "summarize_jtl()"}, {"line": 99, "code": "        \"p90_latency_ms\": percentile(latencies, 0.90),", "explanation": "这是多行文字的一部分，会与相邻内容一起组成提示词或配置文本。", "section": "summarize_jtl()"}, {"line": 100, "code": "        \"p95_latency_ms\": percentile(latencies, 0.95),", "explanation": "这是多行文字的一部分，会与相邻内容一起组成提示词或配置文本。", "section": "summarize_jtl()"}, {"line": 101, "code": "        \"p99_latency_ms\": percentile(latencies, 0.99),", "explanation": "这是多行文字的一部分，会与相邻内容一起组成提示词或配置文本。", "section": "summarize_jtl()"}, {"line": 102, "code": "        \"max_latency_ms\": round(max(latencies), 3),", "explanation": "这是多行文字的一部分，会与相邻内容一起组成提示词或配置文本。", "section": "summarize_jtl()"}, {"line": 103, "code": "        \"status_counts\": dict(sorted(status_counts.items())),", "explanation": "这是多行文字的一部分，会与相邻内容一起组成提示词或配置文本。", "section": "summarize_jtl()"}, {"line": 104, "code": "        \"failure_counts\": dict(sorted(failure_counts.items())),", "explanation": "这是多行文字的一部分，会与相邻内容一起组成提示词或配置文本。", "section": "summarize_jtl()"}, {"line": 105, "code": "    }", "explanation": "这是上一条多行结构的收尾符号，用来告诉Python列表、调用或字典到这里结束。", "section": "summarize_jtl()"}, {"line": 108, "code": "def jmeter_report(paths, label=\"RAG_CHAT\"):", "explanation": "这里定义jmeter_report函数；括号里的paths, label=\"RAG_CHAT\"是调用方交进来的输入，下面缩进代码负责处理，return负责把结果交回去。", "section": "jmeter_report()"}, {"line": 109, "code": "    \"\"\"输入：多档JTL路径；处理：每档独立统计再求总数；输出：完整RAG总报告。\"\"\"", "explanation": "这是给人看的函数说明：“输入：多档JTL路径；处理：每档独立统计再求总数；输出：完整RAG总报告。”。它说明本步骤的输入、处理或输出；Python会保存这段说明，但不会把它当业务步骤执行。", "section": "jmeter_report()"}, {"line": 110, "code": "    if not paths:  # 没有原始证据时拒绝生成空报告。", "explanation": "这行真正执行井号左边的代码。它的用途是：没有原始证据时拒绝生成空报告。井号右边只是中文说明，不会参与程序运行。", "section": "jmeter_report()"}, {"line": 111, "code": "        raise ValueError(\"至少需要一个JTL文件\")", "explanation": "这行主动停止当前流程并抛出错误，让接口把失败原因返回，而不是继续产生错误结果。", "section": "jmeter_report()"}, {"line": 112, "code": "    runs = []", "explanation": "这行先计算等号右边，再把结果保存到“runs”；后面的代码可以继续使用这个值。", "section": "jmeter_report()"}, {"line": 113, "code": "    for path in paths:  # 各并发档必须分别算QPS，不能把不同时间窗口混在一起。", "explanation": "这行真正执行井号左边的代码。它的用途是：各并发档必须分别算QPS，不能把不同时间窗口混在一起。井号右边只是中文说明，不会参与程序运行。", "section": "jmeter_report()"}, {"line": 114, "code": "        runs.append(summarize_jtl(path, label))", "explanation": "把当前并发档JTL交给summarize_jtl独立统计，再将结果加入runs；并发1、2、4不会混用一个时间窗口。", "section": "jmeter_report()"}, {"line": 115, "code": "    samples, successes = 0, 0", "explanation": "这行先计算等号右边，再把结果保存到“samples, successes”；后面的代码可以继续使用这个值。", "section": "jmeter_report()"}, {"line": 116, "code": "    for run in runs:  # 总报告只合计样本和成功数，仍保留每档自己的性能指标。", "explanation": "这行真正执行井号左边的代码。它的用途是：总报告只合计样本和成功数，仍保留每档自己的性能指标。井号右边只是中文说明，不会参与程序运行。", "section": "jmeter_report()"}, {"line": 117, "code": "        samples += run[\"samples\"]", "explanation": "读取samples原来的值，再按“+=”右边的数量更新它；更新结果仍保存回{name}，供本轮统计继续使用。", "section": "jmeter_report()"}, {"line": 118, "code": "        successes += run[\"successes\"]", "explanation": "读取successes原来的值，再按“+=”右边的数量更新它；更新结果仍保存回{name}，供本轮统计继续使用。", "section": "jmeter_report()"}, {"line": 119, "code": "    failures = samples - successes", "explanation": "这行先计算等号右边，再把结果保存到“failures”；后面的代码可以继续使用这个值。", "section": "jmeter_report()"}, {"line": 120, "code": "    return {", "explanation": "这行结束当前函数，并把后面的结果交回调用它的上一层；后续同级代码不会再执行。", "section": "jmeter_report()"}, {"line": 121, "code": "        \"kind\": \"jmeter_full_rag\", \"created_at\": datetime.now(timezone.utc).isoformat(),", "explanation": "这是多行文字的一部分，会与相邻内容一起组成提示词或配置文本。", "section": "jmeter_report()"}, {"line": 122, "code": "        \"label\": label, \"runs\": runs, \"samples\": samples,", "explanation": "这是多行文字的一部分，会与相邻内容一起组成提示词或配置文本。", "section": "jmeter_report()"}, {"line": 123, "code": "        \"successes\": successes, \"failures\": failures,", "explanation": "这是多行文字的一部分，会与相邻内容一起组成提示词或配置文本。", "section": "jmeter_report()"}, {"line": 124, "code": "        \"error_rate\": round(failures / samples, 6),", "explanation": "这是多行文字的一部分，会与相邻内容一起组成提示词或配置文本。", "section": "jmeter_report()"}, {"line": 125, "code": "        \"coverage\": \"Redis读取→BGE向量化→Milvus+BM25→RRF→BGE精排→DeepSeek→后处理→Redis写回\",", "explanation": "这行记录压测实际覆盖的完整在线链路，说明测到的是一次RAG问答，而不是只测一个空接口。", "section": "jmeter_report()"}, {"line": 126, "code": "        \"scope\": \"每轮先清空历史，测试完整首轮RAG；不含多轮Query改写；低成本小样本基线\",", "explanation": "这是多行文字的一部分，会与相邻内容一起组成提示词或配置文本。", "section": "jmeter_report()"}, {"line": 127, "code": "    }", "explanation": "这是上一条多行结构的收尾符号，用来告诉Python列表、调用或字典到这里结束。", "section": "jmeter_report()"}, {"line": 130, "code": "def report_paths(output):", "explanation": "这里定义report_paths函数；括号里的output是调用方交进来的输入，下面缩进代码负责处理，return负责把结果交回去。", "section": "report_paths()"}, {"line": 131, "code": "    \"\"\"输入：文件前缀、JSON/MD路径或目录；处理：统一后缀；输出：两个报告路径。\"\"\"", "explanation": "这是给人看的函数说明：“输入：文件前缀、JSON/MD路径或目录；处理：统一后缀；输出：两个报告路径。”。它说明本步骤的输入、处理或输出；Python会保存这段说明，但不会把它当业务步骤执行。", "section": "report_paths()"}, {"line": 132, "code": "    output = Path(output)", "explanation": "这行先计算等号右边，再把结果保存到“output”；后面的代码可以继续使用这个值。", "section": "report_paths()"}, {"line": 133, "code": "    if output.suffix.lower() in {\".json\", \".md\"}:  # 传入某种报告后缀时先去掉它。", "explanation": "这行真正执行井号左边的代码。它的用途是：传入某种报告后缀时先去掉它。井号右边只是中文说明，不会参与程序运行。", "section": "report_paths()"}, {"line": 134, "code": "        stem = output.with_suffix(\"\")", "explanation": "这行先计算等号右边，再把结果保存到“stem”；后面的代码可以继续使用这个值。", "section": "report_paths()"}, {"line": 135, "code": "    elif output.exists() and output.is_dir():  # 传入现有目录时使用固定报告名。", "explanation": "这行真正执行井号左边的代码。它的用途是：传入现有目录时使用固定报告名。井号右边只是中文说明，不会参与程序运行。", "section": "report_paths()"}, {"line": 136, "code": "        stem = output / \"pressure_report\"", "explanation": "这行先计算等号右边，再把结果保存到“stem”；后面的代码可以继续使用这个值。", "section": "report_paths()"}, {"line": 137, "code": "    else:", "explanation": "前面所有条件都不成立时，程序执行这个兜底分支。", "section": "report_paths()"}, {"line": 138, "code": "        stem = output  # 无后缀路径直接当作两个报告共用的文件名前缀。", "explanation": "这行真正执行井号左边的代码。它的用途是：无后缀路径直接当作两个报告共用的文件名前缀。井号右边只是中文说明，不会参与程序运行。", "section": "report_paths()"}, {"line": 139, "code": "    return stem.with_suffix(\".json\"), stem.with_suffix(\".md\")", "explanation": "这行结束当前函数，并把后面的结果交回调用它的上一层；后续同级代码不会再执行。", "section": "report_paths()"}, {"line": 142, "code": "def markdown(report):", "explanation": "这里定义markdown函数；括号里的report是调用方交进来的输入 function fillList(id,values){const list=$(id);list.replaceChildren();(values||[]).forEach(value=>{const item=document.createElement('li');item.textContent=value;list.append(item)})}
function highlight(){document.querySelectorAll('.code-line.active').forEach(node=>node.classList.remove('active'));const button=$('code').children[selected];if(button){button.classList.add('active');button.scrollIntoView({block:'nearest'})}}
function selectLine(index){if(!visibleRows.length)return;selected=clamp(index,0,visibleRows.length-1);const row=visibleRows[selected];highlight();$('jump').value=row.line;if(mode==='block')return;$('selectedCode').classList.remove('hidden');$('lineTag').textContent=`第 ${row.line} 行 / ${lesson.line_count} 行`;$('detailTitle').textContent=row.section||'逐行理解';$('selectedCode').textContent=row.code||'（空行，仅用于排版）';$('explanation').textContent=row.explanation||'这是空行，用于把代码分成容易阅读的段落。';$('speech').textContent='开口练习：先说这行拿到什么，再说做了什么，最后说结果交给谁。';$('tip').textContent='逐行模式是备用查询；答辩主讲先按代码块讲。'}
function renderCode(){const container=$('code');container.replaceChildren();visibleRows.forEach((item,index)=>{const button=document.createElement('button');button.type='button';button.className='code-line';button.setAttribute('aria-label',`第${item.line}行 ${item.code||'空行'}`);const number=document.createElement('span');number.className='num';number.textContent=item.line;const code=document.createElement('span');code.textContent=item.code;button.append(number,code);button.onclick=()=>selectLine(index);container.append(button)});highlight()}
function blockCode(block){return rows.slice(block.start_line-1,block.end_line).map(row=>`${String(row.line).padStart(3,' ')} | ${row.code}`).join('\n')}
function showBlock(index=0){if(!lesson||!lesson.blocks.length)return;blockIndex=clamp(index,0,lesson.blocks.length-1);const block=lesson.blocks[blockIndex];setMode('block');visibleRows=rows.filter(row=>row.line>=block.start_line&&row.line<=block.end_line);selected=0;renderCode();$('selectedCode').classList.add('hidden');$('sectionTitle').textContent=block.label;$('lineTag').textContent=`代码块 ${blockIndex+1}/${lesson.blocks.length} · 第 ${block.start_line}-${block.end_line} 行`;$('detailTitle').textContent=block.label;$('purpose').textContent=block.purpose;$('input').textContent=block.input;fillList('steps',block.steps);fillList('functions',block.functions);$('output').textContent=block.output;$('failure').textContent=block.failure;$('speech').textContent='答辩话术：'+block.speech;$('tip').textContent='先记住这块的输入→处理→输出；需要展开时再点左边具体行。';$('previous').disabled=blockIndex===0;$('next').disabled=blockIndex===lesson.blocks.length-1}
function renderBlocks(){const flow=$('flow');flow.replaceChildren();lesson.blocks.forEach((block,index)=>{const button=document.createElement('button');button.type='button';button.textContent=block.label;button.onclick=()=>showBlock(index);flow.append(button)})}
function openLines(){setMode('line');visibleRows=rows;selected=0;renderCode();$('sectionTitle').textContent='按文件顺序逐行查询（备用）';$('lineTag').textContent='备用模式';$('detailTitle').textContent='选择一行查看解释';$('selectedCode').textContent='';$('tip').textContent='老师点到哪一行，就用右侧解释复述哪一行。';$('previous').disabled=false;$('next').disabled=false;selectLine(0)}
function openStar(){setMode('star');visibleRows=rows;selected=0;renderCode();$('selectedCode').classList.remove('hidden');$('sectionTitle').textContent='45分钟答辩';$('lineTag').textContent='STAR项目法';$('detailTitle').textContent='先痛点，再讲实现和证据';$('selectedCode').textContent='S 背景 → T 目标 → A 四文件实现 → R 实测结果';$('explanation').textContent='S：直接问模型难追溯依据，长指南难查，多轮追问缺上下文。T：做一个本地可演示的医生RAG。A：离线建库、在线问答、评估优化、JMeter压测。R：展示资料来源、检索前后对比和压测证据。';$('speech').textContent='示范开场：我做的是一个先查医学指南，再让DeepSeek依据资料组织回答的医生问答系统。';$('tip').textContent='完整45分钟范围看docs/21；不要把历史两题RAGAS说成当前代码重跑结果。';$('previous').disabled=true;$('next').disabled=true}
function switchLesson(id){lesson=dataset.lessons.find(item=>item.id===id)||dataset.lessons[0];const byNumber=new Map((lesson.lines||[]).map(item=>[item.line,item]));rows=Array.from({length:lesson.line_count},(_,offset)=>{const line=offset+1;return byNumber.get(line)||{line,code:'',explanation:'这是空行，用于把代码分成容易阅读的段落。',section:'排版空行'}});$('fileSelect').value=lesson.id;$('sourcePath').textContent=`当前源码：${lesson.source} · SHA-256 ${lesson.sha256.slice(0,12)}…`;$('jump').max=lesson.line_count;$('count').textContent=`${lesson.line_count}行 / ${lesson.blocks.length}个代码块 / ${lesson.nonempty_count}个非空行`;renderBlocks();showBlock(0)}
dataset.lessons.forEach(item=>{const option=document.createElement('option');option.value=item.id;option.textContent=`${item.title}（${item.line_count}行）`;$('fileSelect').append(option)});$('fileSelect').onchange=event=>switchLesson(event.target.value);
$('blockMode').onclick=()=>showBlock(0);$('lineMode').onclick=openLines;$('starMode').onclick=openStar;$('previous').onclick=()=>mode==='block'?showBlock(blockIndex-1):selectLine(selected-1);$('next').onclick=()=>mode==='block'?showBlock(blockIndex+1):selectLine(selected+1);
$('jumpButton').onclick=()=>{const number=Number($('jump').value);if(!Number.isInteger(number)||number<1||number>lesson.line_count)return;if(mode==='block'){const target=lesson.blocks.findIndex(block=>number>=block.start_line&&number<=block.end_line);if(target<0){openLines()}else if(target!==blockIndex){showBlock(target)}}const index=visibleRows.findIndex(row=>row.line===number);if(index>=0)selectLine(index)};switchLesson(dataset.default_lesson);
</script></body></html>
