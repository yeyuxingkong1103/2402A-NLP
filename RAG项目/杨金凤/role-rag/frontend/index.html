<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>高血压医生 · RAG 角色扮演</title>
<link rel="stylesheet" href="style.css">
<script src="marked.min.js"></script>
<script src="purify.min.js"></script>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🩺</div>
    <div class="titles">
      <h1>高血压医生</h1>
      <p>国家基层高血压防治管理指南</p>
    </div>
  </div>
  <div class="seg" id="seg">
    <button type="button" data-role="高血压医生" class="active">高血压医生</button>
    <button type="button" data-role="心理医生">心理医生</button>
  </div>
  <select id="role" hidden>
    <option value="高血压医生" selected>高血压医生</option>
    <option value="心理医生">心理医生</option>
  </select>
  <button type="button" class="clear" id="clear">🔄 清空会话</button>
</header>
<main id="chat">
  <div class="welcome" id="welcome">
    <div class="welcome-avatar">🩺</div>
    <h2>您好，我是高血压专科医生，有什么可以帮您？</h2>
    <div class="quick">
      <button type="button" data-q="血压多少算高？">血压多少算高？</button>
      <button type="button" data-q="高血压吃什么药？">高血压吃什么药？</button>
      <button type="button" data-q="平时饮食注意什么？">平时饮食注意什么？</button>
    </div>
  </div>
</main>
<footer>
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="向高血压医生提问…"></textarea>
    <button type="button" id="send">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      <span>发送</span>
    </button>
  </div>
  <div class="hint">Enter 发送 · Shift+Enter 换行</div>
</footer>
<script src="app.js"></script>
</body>
</html>
