<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>招股说明书智能问答 · 工单01</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei",sans-serif; background:#f0f2f5; height:100vh; display:flex; flex-direction:column; }
  header { background:linear-gradient(135deg,#1a3a6b,#2563ab); color:#fff; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:18px; font-weight:600; }
  header .meta { font-size:12px; opacity:.85; }
  #chat { flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:16px; max-width:960px; width:100%; margin:0 auto; }
  .msg { max-width:78%; padding:12px 16px; border-radius:12px; line-height:1.7; font-size:14px; white-space:pre-wrap; word-break:break-word; }
  .user { align-self:flex-end; background:#2563ab; color:#fff; border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:#fff; color:#1f2937; border:1px solid #e5e7eb; border-bottom-left-radius:4px; }
  .bot .src { margin-top:10px; padding-top:8px; border-top:1px dashed #e5e7eb; font-size:12px; color:#6b7280; }
  .src .chip { display:inline-block; background:#eff6ff; color:#1d4ed8; border-radius:10px; padding:1px 8px; margin:2px 4px 0 0; font-size:11px; }
  .hint { text-align:center; color:#9ca3af; font-size:12px; }
  footer { background:#fff; border-top:1px solid #e5e7eb; padding:14px 24px; }
  .inputbar { max-width:960px; margin:0 auto; display:flex; gap:10px; }
  .inputbar input { flex:1; border:1px solid #d1d5db; border-radius:10px; padding:11px 14px; font-size:14px; outline:none; }
  .inputbar input:focus { border-color:#2563ab; }
  .inputbar button { background:#2563ab; color:#fff; border:none; border-radius:10px; padding:0 26px; font-size:14px; cursor:pointer; }
  .inputbar button:disabled { background:#93b4e0; cursor:not-allowed; }
  .examples { max-width:960px; margin:8px auto 0; font-size:12px; color:#6b7280; }
  .examples span { display:inline-block; background:#f3f4f6; border-radius:10px; padding:2px 10px; margin:3px 6px 0 0; cursor:pointer; }
  .examples span:hover { background:#e5e7eb; }
</style>
</head>
<body>
<header>
  <h1>📋 招股说明书智能问答（武汉兴图新科）</h1>
  <div class="meta">工单01 · BGE-M3 向量检索 + qwen2.5:7b 本地生成</div>
</header>

<div id="chat">
  <div class="hint">基于《招股说明书1.pdf》的 RAG 问答 · 答案均来自文档原文并附页码</div>
</div>

<footer>
  <div class="inputbar">
    <input id="q" type="text" placeholder="请输入问题，回车发送…" autocomplete="off">
    <button id="send">发送</button>
  </div>
  <div class="examples">试试：
    <span>武汉兴图新科电子股份有限公司注册资本是多少？</span>
    <span>公司参与的哪个工程荣获了国家科技进步一等奖？</span>
    <span>电子信息行业的上游涉及哪些企业？</span>
  </div>
</footer>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('q');
const btn = document.getElementById('send');

function addMsg(cls, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function ask() {
  const q = input.value.trim();
  if (!q || btn.disabled) return;
  input.value = '';
  addMsg('user', q);
  const thinking = addMsg('bot', '正在检索文档并生成答案…');
  btn.disabled = true;
  try {
    const resp = await fetch('/api/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: q})
    });
    const data = await resp.json();
    const srcHtml = '引用：' + data.sources.map(s =>
      `<span class="chip">第${s.page}页 · 相似度${s.score}</span>`).join('');
    thinking.innerHTML = '';
    const ansDiv = document.createElement('div');
    ansDiv.textContent = data.answer;
    const srcDiv = document.createElement('div');
    srcDiv.className = 'src';
    srcDiv.innerHTML = srcHtml + `　耗时 ${data.elapsed}s`;
    thinking.appendChild(ansDiv);
    thinking.appendChild(srcDiv);
  } catch (e) {
    thinking.textContent = '请求失败：' + e.message;
  }
  btn.disabled = false;
  chat.scrollTop = chat.scrollHeight;
}

btn.onclick = ask;
input.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
document.querySelectorAll('.examples span').forEach(s => {
  s.onclick = () => { input.value = s.textContent.replace('试试：','').trim(); input.focus(); };
});
</script>
</body>
</html>
