# 工单编号：人工智能NLP-RAG-实现文档质量评估Skill并集成至智能体工作流
# DocumentQualityAssessmentSkill 的全部可调参数
#
# 验收标准第三条明确要求「所有核心判断逻辑的阈值必须配置化，不硬编码在代码中」，
# 所以凡是「多少算多、多少算少」的地方，都提到这里来。

# ---------- 1. 扫描目录 ----------
scan:
  # 统计哪些扩展名。改这里就能支持新格式
  extensions: [".pdf", ".docx", ".doc", ".md", ".markdown", ".txt", ".xlsx", ".html"]
  # 遍历时跳过的目录名（知识库里常有这些噪音）
  skip_dirs: [".git", "__pycache__", "node_modules", ".ipynb_checkpoints", ".cache"]
  # 单个文件超过这个大小就跳过正文抽取（只统计元信息），避免卡死
  max_parse_mb: 200
  # 并发解析的进程数。0 = 按 CPU 核数自动
  workers: 0

# ---------- 2. PDF 页面类型判定 ----------
pdf_type:
  # 按页判：每页可提取的字符数低于这个值，**且**图片铺满页面，才算「扫描页」
  # 说明：PDF 的文字层常常只有零星几个字符（页码、水印），阈值不能设成 0
  min_chars_per_page: 50
  # 图片面积占页面面积多少算「铺满」。只看字符数会把**附图页**误判成扫描页
  # （专利附图整页只有「图1」几个字），加了这一条才能分开：
  #   扫描页整张位图铺满 ≈ 1.00；附图页的图只占中间一块 ≈ 0.32~0.44
  # 实测 IMDR：取值 0.8 时 298 份误判的「混合型」里有 290 份回归「文字型」。
  scan_cover_ratio: 0.8
  # 扫描页占比超过这个比例 → 整个文件判为「扫描型」
  scanned_ratio: 0.7
  # 低于这个比例 → 「文字型」；中间的算「混合型」
  text_ratio: 0.3
  # 判成分数落在 [text_ratio, scanned_ratio] 之间的，进「待确认」列表让人工看
  # （工单原文：这是一条启发式，不保证严格正确，所以输出待确认列表）
  emit_uncertain: true
  # 只看前 N 页（大文档全扫太慢）。0 = 全扫
  sample_pages: 30

# ---------- 3. 长度分布 ----------
length:
  # 输出这些分位
  percentiles: [25, 50, 75, 90, 99]
  # 长度区间的分界（字符数）。区间标签按相邻两个边界拼
  bins: [0, 500, 2000, 10000, 50000, 200000]
  # 超过这个字符数的算「超长文档」，单独列出来
  too_long: 500000
  # 低于这个字符数的算「过短文档」，通常是解析失败或空文件
  too_short: 50

# ---------- 4. 重复检测 ----------
dedup:
  # 第一层：MD5 精确匹配。完全相同就是完全相同，不需要人工确认
  md5: true
  # 第二层：SimHash 近似匹配（进阶项，工单备注 2 允许只出方案，这里实现了）
  simhash: true
  # SimHash 取多少位（64 位是常规值）
  simhash_bits: 64
  # 中文切 shingle 的滑窗长度。3 是中文的常用取值。
  # 别改成 1（= 按单字切）：单字熵太低，「的/一/是」这种字每份文档都有，
  # 两份毫不相干的专利也会像到 92% —— 实测那一档的准确率只有 38%。
  simhash_shingle: 3
  # 汉明距离 ≤ 这个值就算「高度相似」，进「待确认的版本冲突列表」。
  #
  # **这个数是扫出来的，不是拍的。** 64 位下网上常见取值是 3，照搬会漏。
  # IMDR 1700 份实测（1078 份有正文参与比较，逐对打开首页核著录项，
  # 「同申请人 + 同申请日」判为真阳性）：
  #
  #     阈值   条数   真阳性   误报   准确率
  #      3      6      6      0     100%
  #      6     12     12      0     100%
  #      7     18     17      1      94%    ← 取这个
  #     10     24     23      1      96%
  #     11     34     26      8      76%    ← 断崖，从这里往下一路烂
  #     12     49     27     22      55%
  #
  # 取 7 的理由：高准确率平台是 2~10，7 落在**平台中段**而不是边缘
  # （6 是最后一个零误报的点，贴着边缘，语料稍变就可能翻车），
  # 而且离断崖还隔着 4 档。94% 的准确率对一张「人工复核队列」足够好。
  #
  # ⚠ **换语料必须重扫**：`python 测试/分析.py sweep <报告.json> <最大距离> <路径关键字>`
  # 阈值取决于语料的「模板化程度」。已知反例：年报集合（同一套模板换数据，
  # 不同公司之间也能到距离 4~7）这个默认值会刷出误报，那种语料要往下调。
  simhash_distance: 7
  # 算 SimHash 时从全文取多少字符做样本（全文算太慢）。
  # 取样方式：头 1/2 + 中 1/4 + 尾 1/4。
  # 为什么不只取头部：年报/招股书开头都是封面和目录，全是套话，
  # 只看头部会让两家不同公司的年报比同一份文档的两个版本还像（实测过）。
  simhash_sample_chars: 4000
  # 参与 SimHash 的文件超过这个数就跳过（O(n²) 比较会爆），进报告提示
  simhash_max_files: 3000
  # 正文不足这么多字符的文档不参与 SimHash 比较。
  # 为什么需要：扫描件没有文字层，能抽出的常常只有几行页码/水印。拿这种文本
  # 算出来的指纹，几份**毫不相干**的扫描件之间汉明距离也会很小 ——
  # 比了只会刷出一屏假「版本冲突」，把真正要人工确认的那几条淹掉。
  # 这类文档要先去重（MD5 那层照样有效，它不看内容），或者先 OCR 出正文再比。
  simhash_min_chars: 200

# ---------- 5. 敏感信息检测 ----------
sensitive:
  phone:
    enabled: true
    # 中国大陆手机号
    pattern: "(?<!\\d)1[3-9]\\d{9}(?!\\d)"
  email:
    enabled: true
    pattern: "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
  id_card:
    enabled: true
    # 18 位身份证（末位可能是 X）
    pattern: "(?<!\\d)[1-9]\\d{5}(19|20)\\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\\d|3[01])\\d{3}[\\dXx](?!\\d)"
  bank_card:
    # 工单原文：默认关闭，误报率太高
    enabled: false
    pattern: "(?<!\\d)[1-9]\\d{15,18}(?!\\d)"
  # 每条命中记录前后各截多少字符做上下文（验收要求列表里要带上下文）
  context_chars: 40
  # 同一个文件里同一类敏感信息最多记多少条（防止一份通讯录刷屏）
  max_per_file: 20
  # 命中数超过这个值就把整个文件标红（可能是通讯录/名单，不是文档）
  file_alert_count: 50

# ---------- 6. 文档分类标签 ----------
tags:
  # 判定顺序有讲究：先判最确定的，后面的兜底
  rules:
    # 扫描型：PDF 且扫描页占比高 → 要走 OCR
    - name: Scan_PDF
      when: {pdf_kind: scanned}
      route: ocr
    # 文字型 PDF：可以直接抽文字
    - name: Text_PDF
      when: {pdf_kind: text}
      route: text
    # 混合型：部分页要 OCR
    - name: Mixed_PDF
      when: {pdf_kind: mixed}
      route: hybrid
    # 空/过短：多半是解析失败或占位文件。
    # 必须排除扫描型 —— 扫描件没有文字层，字符数 0 是正常的，
    # 不排除的话 IMDR 那 1700 份扫描专利每份都会被误判成「坏文件」，
    # 而且路由变成「ocr、review」两个，工作流不知道该送哪个解析器。
    - name: Empty_or_Broken
      when: {chars_lt: 50, pdf_kind_not: scanned}
      route: review
    # 超长：切块时要注意，容易超出模型上下文
    - name: Long_Document
      when: {chars_gte: 200000}
      route: chunk_aggressive
    # 非 PDF 的文本类
    - name: Plain_Text
      when: {ext_in: [".md", ".markdown", ".txt"]}
      route: text
    # 表格类
    - name: Tabular
      when: {ext_in: [".xlsx", ".xls", ".csv"]}
      route: table
    # 兜底
    - name: Unclassified
      when: {}
      route: review
  # 一个文档可以有多个标签（比如「扫描型 + 超长」），这里控制上限
  max_tags_per_doc: 3

# ---------- 7. 输出 ----------
output:
  # 报告里每个列表最多列多少条（全量写进 JSON，HTML 简报只列前 N 条）
  html_max_rows: 200
  # 中间结果落盘目录（支持中断恢复）
  workdir: .quality_work
  # 每处理多少份落一次盘
  checkpoint_every: 100
