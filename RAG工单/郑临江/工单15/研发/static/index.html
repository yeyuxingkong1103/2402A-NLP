<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>工业文档工单</title>
<style>body{font:16px/1.7 'Microsoft YaHei';color:#203b45;background:#f0f5f6;margin:0}header{background:#193f45;color:white;padding:25px 6vw}main{max-width:1180px;margin:25px auto;padding:0 20px}.card{background:white;padding:25px;border-radius:10px;margin:20px 0}textarea{width:95%;height:85px;font:inherit;padding:12px}button,select{padding:10px;font:inherit;margin:12px 8px 0 0}pre{white-space:pre-wrap;word-break:break-word}img{max-width:95%;max-height:750px}.muted{color:#647986}#samples button{text-align:left;display:block}</style>
<header><h1 id="title">工业PDF · 验证工作台</h1><span>设计 · 研发 · 测试 · 优化 · 部署</span></header>
<main><div class="card"><p id="status">正在连接</p><p class="muted">本页是附带的工业文档扩展验证界面。完整RAGFlow部署是否验证通过，以测试记录为准。</p><select id="document"><option>CN100342976C.pdf</option><option>CN100347506C.pdf</option></select><label><input type="checkbox" id="optimized" checked>图文优化</label><textarea id="question" placeholder="请输入专利问题，图像问题尽量明确物理页码和图号"></textarea><button id="ask">检索并回答</button><button id="inspect">全量文档质检（工单18）</button><a href="/quality-report" target="_blank">质检简报</a></div><div class="card"><h2>指定问题</h2><div id="samples"></div></div><div class="card"><h2>答案及实际耗时</h2><pre id="answer"></pre><div id="sources"></div></div><div class="card"><h2>实测记录</h2><button id="report">查看本项目实测</button><pre id="reportData"></pre></div></main>
<script>const $=x=>document.getElementById(x);async function refresh(){const h=await(await fetch('/api/health')).json();$('title').textContent='工单'+h.project.number+' · '+h.project.title;$('status').textContent='服务就绪 · 已解析'+h.parsed_pages+'页';$('document').value=h.project.target_document;const r=await(await fetch('/api/report')).json();for(const row of(r.gold||[])){const b=document.createElement('button');b.textContent=row.question;b.onclick=()=>{$('question').value=row.question;$('document').value=row.document};$('samples').append(b)}}refresh();$('ask').onclick=async()=>{$('ask').disabled=true;$('answer').textContent='正在检索及推理…';try{const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:$('question').value,document:$('document').value,optimized:$('optimized').checked})});const d=await r.json();$('answer').textContent=(d.answer||JSON.stringify(d))+'\n\n完整耗时：'+d.elapsed_ms+' ms';$('sources').replaceChildren();for(const s of d.sources||[]){const details=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('pre');summary.textContent=s.document+' · PDF物理第'+s.pdf_page+'页';pre.textContent=s.text;details.append(summary,pre);const im=document.createElement('img');im.src='/pages/'+s.document.replace('.pdf','')+'/'+s.pdf_page;details.append(im);$('sources').append(details)}}catch(e){$('answer').textContent=e.message}finally{$('ask').disabled=false}};$('report').onclick=async()=>{$('reportData').textContent=JSON.stringify(await(await fetch('/api/report')).json(),null,2)};$('inspect').onclick=async()=>{$('reportData').textContent='全库质检中…';const d=await(await fetch('/v1/document/quality-inspection',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})).json();$('reportData').textContent=JSON.stringify({workflow:d.workflow,total_files:d.report?.total_files,labels:d.report?.label_counts,routes:d.routes?.slice(0,5)},null,2)};</script></html>
