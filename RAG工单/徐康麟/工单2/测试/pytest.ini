; =============================================================================
; 工单：人工智能NLP-RAG-基于PDF文档的问答系统优化
; 阶段：测试 / 离线测试套件（T3）
;
; 统一运行命令（工作目录 = E:\gao6gongdan\工单2）：
;   pwsh -NoProfile -File run_py.ps1 -m pytest 测试/离线 -v
; =============================================================================
[pytest]
testpaths = 离线
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    slow: 需要加载嵌入模型 / 向量索引的用例
    llm: 需要本地 Ollama 生成服务（不可用时按降级路径断言）
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
