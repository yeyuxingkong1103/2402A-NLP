# 工单编号：人工智能NLP-RAG-解决API服务并发瓶颈与资源泄漏
# Prometheus 抓取配置
#
# RAGFlow 的指标挂在容器内的 9390 端口（rag/utils/prom_metrics.py），
# 通过 compose 发布到宿主的 9390。Prometheus 自己也在容器里，
# 所以用 host.docker.internal 访问宿主端口。
global:
  scrape_interval: 5s          # 压测只有几分钟，5 秒够密；平时可以放宽到 15s
  evaluation_interval: 5s

scrape_configs:
  - job_name: ragflow
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9390"]
        labels:
          service: ragflow-api

  # Prometheus 自己的运行指标（抓取成功率、耗时），排查「面板没数据」时先看它
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
