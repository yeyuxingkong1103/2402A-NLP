# 工单 16 · 专用 VLM LoRA 微调配置（LLaMA-Factory）
# 基座：Qwen2.5-VL-7B-Instruct（RAGFlow 默认 VLM 同族），工业术语/图纸领域适应
# 数据：convert_to_vlm_dataset.py 生成的 imdr_vlm（JSONL: messages + images）

### model
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
# image_max_pixels: 低分辨率工业 PDF 放大后仍偏小，限制像素避免 OOM
image_max_pixels: 262144         # 512x512 等效
image_min_pixels: 200704         # 448x448
trust_remote_code: true
flash_attn: auto

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8                     # 参照 RAGFlow/LLaMA-Factory 示例，低秩起步
lora_alpha: 16
lora_dropout: 0.05
lora_target: all                 # 视觉塔冻结时仅作用于语言塔注意力/FFN
freeze_vision_tower: true        # 图像塔冻结，只适语言侧理解“术语+图注”

### dataset
dataset: imdr_vlm                # 在 LLaMA-Factory/data/dataset_info.json 注册
dataset_dir: D:/_RAG新工单素材/llamafactory_data
template: qwen2_vl
cutoff_len: 2048
max_samples: 5000
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: D:/_RAG新工单素材/qwen25vl_imdr_lora
logging_steps: 10
save_steps: 200
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8    # 等效 batch 16
learning_rate: 1.0e-4             # LoRA 常用 1e-4（全参用 1e-5）
num_train_epochs: 2
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000

### eval
val_size: 0.02
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 200

### export（融合 adapter，便于独立推理）
# llamafactory-cli export lora_export.yaml  （同目录，见 README）
