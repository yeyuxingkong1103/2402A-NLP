[project]
name = "rag-roleplay-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncmy>=0.2.9",
    "cryptography>=41.0",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "redis>=5.0",
    "pymilvus>=2.4.0,<2.5.0",
    "httpx>=0.27",
    "arq>=0.26",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",
    "PyJWT>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "testcontainers>=4.4",
    "aiosqlite>=0.19",
    "fakeredis>=2.21",
]
ocr = [
    "paddleocr>=2.7",
    "paddlepaddle>=2.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
