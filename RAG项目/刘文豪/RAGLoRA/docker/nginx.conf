# RAGLoRA 反向代理 + 负载均衡
#
# 背景：本项目**原本无法多 worker** —— Qdrant 嵌入式模式对存储目录持有独占文件锁，
# 第二个 worker 打开同一目录会直接失败。切到 **Milvus** 后该限制解除，
# 多 worker + 负载均衡才成为可能（这也是当初做 Milvus 接入的收益之一）。
#
# ⚠️ 前提：`RAGLORA_VECTOR_STORE=milvus`。
#    若切回 qdrant，**不要**启用多 worker —— 第二个 worker 起不来。
#
# 用法：见 docker/docker-compose.nginx.yml 与本文件末尾说明。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # 上游 uvicorn 实例。端口与 backend/run_multi.sh 启动的 worker 对应。
    upstream raglora_backend {
        # 默认轮询（round-robin）
        # ⚠️ 端口要与 run_multi.sh 实际启动的 worker 一致。
        #    这里刻意用 8010/8011 而不是 8000/8001 —— 本机 8000 常被
        #    其它应用（实测酷狗音乐）抢占，nginx 会把请求转给错误的进程。
        server host.docker.internal:8001 max_fails=2 fail_timeout=10s;
        server host.docker.internal:8010 max_fails=2 fail_timeout=10s;

        # 至少保留 2 个可用节点，否则 502（避免把请求打给已挂的实例）
        # 注意：keepalive 需要 nginx 1.15.3+，本机镜像是 latest，满足
        keepalive 32;
    }

    # 压测与调试用日志格式：带上游地址与耗时，便于看负载是否真的分出去了
    log_format upstream_log '$remote_addr - [$time_local] "$request" '
                            '$status $body_bytes_sent '
                            'upstream=$upstream_addr '
                            'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log upstream_log;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;

        # SSE 流式对话专用：必须关缓冲，否则 token 会被 nginx 攒着一起发，
        # 「流式输出」在前端看起来会变成「一次性返回」。
        location /api/chat/stream {
            proxy_pass http://raglora_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 600s;      # LLM 生成长回答可能超过默认 60s
            proxy_send_timeout 600s;
        }

        # 其余接口
        location / {
            proxy_pass http://raglora_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}

# ────────────────────────────────────────────────────────────────
# 使用步骤
#
# 1) 以 milvus 模式起多个 uvicorn worker（占用 8000/8001/8002）：
#       bash backend/run_multi.sh 3
#
# 2) 起 nginx：
#       docker compose -f docker/docker-compose.nginx.yml up -d
#
# 3) 压测（指向 nginx 的 8080，而非某个 worker）：
#       python backend/scripts/loadtest.py --url http://127.0.0.1:8080 \
#              --scenario health --concurrency 20 --duration 15
#
# 4) 确认负载真的分出去了（应看到不同 upstream 地址）：
#       docker logs raglora-nginx 2>&1 | grep upstream= | tail -20
#
# ⚠️ 内存提醒：每个 uvicorn worker 都会**各自加载一份 bge-m3 + 精排**
#    （约 3.4GB/worker）。本机 15.7GB，起 3 个 worker 就是 10GB+，
#    叠加 Milvus（2.5G）会非常紧张。**压测时建议 2 个 worker 以内**，
#    或先把 Dify/模拟器停掉。
# ────────────────────────────────────────────────────────────────
