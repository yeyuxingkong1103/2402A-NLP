<!DOCTYPE html>
<html lang="zh-CN">
<!-- 单文件前端：HTML + CSS + 原生 JS 全在这一个文件里，没有框架也没有构建步骤，
     由后端直接当静态资源返回。改完刷新即生效；代价是没有模块拆分，
     所有可变状态都集中在下文那一处 state 上。 -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG 角色扮演系统</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
  /* 颜色只在这里定义一次：同一种绿被气泡、按钮、角标、光标共用，
     写死在各处的话改主题必然漏掉几处。accent 同时兼任品牌色和状态色。 */
  :root {
    --bg: #eef6f1;
    --panel: #ffffff;
    --panel-2: #f4faf6;
    --border: #d9e9e0;
    --text: #26352e;
    --muted: #74867c;
    --accent: #23b184;
    --accent-dim: #d5f0e4;
    --ok: #3ecf8e;
    --err: #e05555;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  /* 高度得从 html/body 一路传下来，否则下面 main 的 flex:1 拿不到可分配空间，
     会退化成「整个页面滚」而不是「消息区自己滚」 */
  html, body { height: 100%; margin: 0; }
  /* 只用系统自带字体，不引外部字体文件：内网/离线环境拉不到 CDN，缺字体会退化得很难看 */
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    display: flex; flex-direction: column;
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px; border-bottom: 1px solid var(--border);
    background: var(--panel); flex: 0 0 auto;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .spacer { flex: 1; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted);
    border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); }
  .dot.err { background: var(--err); }
  header a { color: var(--muted); font-size: 12px; text-decoration: none; }
  header a:hover { color: var(--accent); }

  /* min-height:0 不能省：flex 子项默认 min-height:auto 会被内容顶开，
     消息一多 #msgs 就不再出现滚动条，而是把整页越撑越高 */
  main { flex: 1; display: flex; min-height: 0; }

  /* ---------- 侧栏 ---------- */
  /* 固定宽度、不参与伸缩：宽度一跳，里面的会话列表排布就会跟着抖 */
  aside {
    width: 280px; flex: 0 0 auto; border-right: 1px solid var(--border);
    background: var(--panel); padding: 16px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 18px;
  }
  .sec-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--muted); margin-bottom: 8px; font-weight: 600;
  }
  select {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font: inherit; font-size: 13px; cursor: pointer;
  }
  select:focus { outline: none; border-color: var(--accent); }

  input[type=text] {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px;
    font: inherit; font-size: 12px;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent); }

  button {
    font: inherit; font-size: 12px; cursor: pointer; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    padding: 7px 12px; transition: border-color .15s, opacity .15s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.block { width: 100%; }

  /* 会话列表 */
  /* 限高 + 自己滚：会话多了不能把侧栏顶长，也不能把下面的知识库挤出视口 */
  .session-list {
    margin-top: 8px; display: flex; flex-direction: column; gap: 6px;
    max-height: 340px; overflow-y: auto;
  }
  /* 右侧 30px 内边距是给绝对定位的删除按钮留位，标题过长时会省略号收尾而不是压到按钮底下 */
  .session-item {
    position: relative; padding: 8px 30px 8px 10px;
    border: 1px solid var(--border); border-radius: 8px;
    cursor: pointer; background: var(--panel-2);
    transition: border-color .15s, background .15s;
  }
  .session-item:hover { border-color: var(--accent-dim); }
  .session-item.active { border-color: var(--accent); background: var(--accent-dim); }
  .session-item .stitle {
    font-size: 12px; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .session-item .smeta { font-size: 10px; color: var(--muted); margin-top: 2px; }
  /* 该会话正在后台生成（切走后仍在跑） */
  .session-item .sbusy {
    display: inline-block; margin-left: 5px; padding: 0 5px;
    font-size: 10px; font-weight: 500; border-radius: 999px;
    color: var(--accent); background: var(--accent-dim);
    vertical-align: 1px;
  }
  .session-item .sdel {
    position: absolute; top: 4px; right: 6px;
    border: none; background: none; color: var(--muted);
    font-size: 15px; line-height: 1; padding: 2px 5px; cursor: pointer;
  }
  .session-item .sdel:hover { color: var(--err); }
  .session-empty { font-size: 12px; color: var(--muted); padding: 8px 4px; }

  /* ---------- 对话区 ---------- */
  /* min-width:0 与上面的 min-height:0 同理，管的是横向：flex 子项默认按内容定宽，
     一条长代码块就能把 .chat 撑宽、把侧栏挤变形 */
  .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #msgs { flex: 1; overflow-y: auto; padding: 24px; }
  .empty { color: var(--muted); text-align: center; margin-top: 18vh; font-size: 13px; }

  /* 780px 与输入区 .composer-inner 保持一致，气泡左右边缘才能和输入框对齐；
     超宽屏下靠 margin auto 居中，不无限拉长行宽（行长过长很难读） */
  .msg { max-width: 780px; margin: 0 auto 20px; display: flex; gap: 10px; }
  .av {
    width: 28px; height: 28px; flex: 0 0 auto; border-radius: 50%;
    display: grid; place-items: center; font-size: 11px; font-weight: 600;
    background: var(--panel-2); border: 1px solid var(--border);
  }
  /* 角色头像 = emoji，放大到接近圆直径；行高 1 避免撑高圆圈 */
  .av.emoji { font-size: 16px; font-weight: 400; line-height: 1; }
  .msg.user .av { background: var(--accent); border-color: var(--accent); color: #fff; }
  .body { min-width: 0; flex: 1; }
  .who { font-size: 11px; color: var(--muted); margin-bottom: 5px; }
  .bubble {
    background: var(--panel); border: 1px solid var(--border);
    /* 用 anywhere 而不是 break-word：模型偶尔吐出超长无空格的串（URL、连续符号），
       只有 anywhere 肯在任意字符处断开，否则会把气泡顶出横向滚动 */
    border-radius: var(--radius); padding: 10px 14px; word-wrap: break-word; overflow-wrap: anywhere;
  }
  .msg.user .bubble { background: var(--panel-2); }
  .bubble code {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 5px; font-family: ui-monospace, Menlo, monospace; font-size: 12px;
  }
  .md-h { font-weight: 700; margin: 6px 0 2px; }
  .md-li { padding-left: 14px; position: relative; }
  .md-li::before { content: "·"; position: absolute; left: 4px; }
  .err-box { color: var(--err); font-size: 13px; }

  /* 流式期间的假光标：纯 CSS 动画而不是 JS 定时器切换，
     否则每个 token 到达都要多跑一次定时器回调和样式重算 */
  .cursor {
    display: inline-block; width: 7px; height: 14px; background: var(--accent);
    vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* 引用区交给原生 <details> 折叠，省掉一份「展开/收起」的 JS 状态。
     副作用：renderMsgs 整体重建 DOM 时展开状态会丢（见 renderMsgs 的说明）。 */
  details.src {
    margin-top: 8px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel-2); font-size: 12px;
  }
  details.src summary {
    cursor: pointer; padding: 6px 11px; color: var(--muted); list-style: none;
  }
  details.src summary::-webkit-details-marker { display: none; }
  details.src summary:hover { color: var(--accent); }
  .src-list { padding: 0 11px 9px; display: flex; flex-direction: column; gap: 7px; }
  .src-item { border-top: 1px dashed var(--border); padding-top: 7px; }
  .src-meta { color: var(--muted); font-size: 11px; margin-bottom: 3px; }
  .src-meta .sc { color: var(--accent); font-family: ui-monospace, Menlo, monospace; }
  .src-text { color: var(--text); opacity: .82; }

  /* ---------- 输入区 ---------- */
  /* flex:0 0 auto：输入区高度可随 textarea 自增高而变，但不能反过来挤压消息区 */
  .composer { flex: 0 0 auto; border-top: 1px solid var(--border); background: var(--panel); padding: 14px 24px 18px; }
  .composer-inner { max-width: 780px; margin: 0 auto; }
  .row { display: flex; gap: 9px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; min-height: 46px; max-height: 180px;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 14px; font: inherit; line-height: 1.5;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .hint { font-size: 11px; color: var(--muted); margin-top: 7px; }

  /* 窄屏直接藏掉整个侧栏，没有抽屉/汉堡菜单做替代：
     手机宽度下将无法换角色、切会话、删会话，只能拉宽窗口 */
  @media (max-width: 720px) {
    aside { display: none; }
    #msgs, .composer { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>
<body>

<!-- 顶栏徽标由 loadHealth 填充；初始文案「连接中…」是占位，
     避免脚本跑起来之前先闪一下「服务不可用」误导用户 -->
<header>
  <h1>RAG 角色扮演系统</h1>
  <span class="badge" id="health"><span class="dot" id="healthDot"></span><span id="healthText">连接中…</span></span>
  <span class="spacer"></span>
  <a href="/docs" target="_blank">API 文档 →</a>
</header>

<main>
  <aside>
    <div>
      <div class="sec-title">角色</div>
      <!-- 选项与 onchange 都由 loadRoles 在数据到位后一起挂上 -->
      <select id="roleSelect"><option>加载中…</option></select>
    </div>
    <div>
      <div class="sec-title">会话</div>
      <button class="primary block" id="btnNew">＋ 新会话</button>
      <div style="margin-top:8px">
        <input type="text" id="sessionSearch" placeholder="搜索会话…" spellcheck="false">
      </div>
      <div id="sessionList" class="session-list"></div>
      <!-- 这里的「20 轮」是服务端短期记忆的窗口，不是前端裁剪：本地存的是完整历史 -->
      <div class="hint" style="margin-top:8px">会话按角色独立，各自保留最近 20 轮上下文。</div>
    </div>
    <div>
      <div class="sec-title">知识库</div>
      <!-- 只读展示当前角色挂了几篇文档；随角色切换由 loadKb 刷新，取值失败时就是这里的「—」 -->
      <div id="kb" style="font-size:12px;color:var(--muted)">—</div>
    </div>
  </aside>

  <section class="chat">
    <div id="msgs">
      <div class="empty" id="empty">选一个角色，然后开始对话</div>
    </div>
    <div class="composer">
      <div class="composer-inner">
        <div class="row">
          <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
          <!-- 停止按钮一直留在 DOM 里、只靠 display 切换，不做节点增删：
               节点上直接挂了 onclick，增删就得跟着反复绑定/解绑 -->
          <button class="primary" id="btnSend">发送</button>
          <button id="btnStop" style="display:none">停止</button>
        </div>
        <!-- 这是脚本启动前的兜底文案，updateHint 跑起来后会被换成按当前角色拼的中性说法 -->
        <div class="hint" id="hint">回答基于检索到的知识库片段，仅供参考，不构成医疗建议。</div>
      </div>
    </div>
  </section>
</main>

<script>
"use strict";

// ---------------- 状态 ----------------
// 没有模块拆分，整个页面共用一个脚本作用域。约定是「state 是唯一真相来源」：
// 渲染函数只读 state 重画 DOM，所以下面每次改完 state 都得显式调一次重绘，
// 漏调不会报错，只会让界面停在旧数据上——这是本文件最容易出问题的写法。
const $ = (id) => document.getElementById(id);
// 缓存节点引用而不是每次现查：流式期间滚动调用非常频繁
const msgs = $("msgs");

const state = {
  // 角色列表来自 /role/list，只用来渲染下拉和取名字/头像，跟权限无关
  roles: [],
  // 记住上次选的角色（刷新后不重置成第一个）；键名固定，见 loadRoles 失效回退
  roleId: localStorage.getItem("rp_role") || "",
  // 刻意不持久化：刷新后由 loadRoles 从该角色的会话列表里挑最近一条，避免存了一个已被删的 id
  sessionId: null,
  sessions: loadSessions(),   // { roleId: [ {id, title, updatedAt} ] }
  // 只活在内存里，不落盘：搜索是临时动作，刷新后回到全量列表
  search: "",
  // 进行中的生成，按会话 id 索引：{ sid: {answer, sources, error, controller, deleted} }
  // 用「会话」而不是全局布尔来记，切角色/切会话时才能让原来那条继续跑完。
  streams: {},
};

// 会话 id 只在前端生成，后端当不透明字符串透传。随机段 + 时间戳两个来源一起用，
// 是为了防同毫秒内连点两次「新会话」撞出同一个 id（撞了就会共用短期记忆和 localStorage 键）。
// "web-" 前缀是给服务端日志/排查用的，能一眼区分网页端与脚本、压测产生的会话。
function newSessionId() {
  return "web-" + Math.random().toString(36).slice(2, 8) + "-" + Date.now().toString(36);
}

// ---------------- 本地持久化（会话列表 + 每条消息） ----------------
// 历史完全存在浏览器里（服务端没有提供会话列表接口），所以换浏览器、清缓存就没了。
// 解析一律 try/catch：localStorage 的内容可能被旧版本格式或手工改坏，
// 而 loadSessions 是在模块初始化时就调用的，一个 JSON 异常会直接把整个页面脚本打断。
function loadSessions() {
  try { return JSON.parse(localStorage.getItem("rp_sessions") || "{}"); }
  catch (_) { return {}; }
}
// 每次整体覆盖写，不做差分：会话列表只有几十条，简单可靠比省这点序列化开销重要
function saveSessions() { localStorage.setItem("rp_sessions", JSON.stringify(state.sessions)); }

// 消息按会话各占一个键：切会话时不必读全量再筛，删会话一次 removeItem 就能清干净
function loadMsgs(sid) {
  try { return JSON.parse(localStorage.getItem("rp_msgs_" + sid) || "[]"); }
  catch (_) { return []; }
}
function saveMsgs(sid, list) { localStorage.setItem("rp_msgs_" + sid, JSON.stringify(list)); }

function roleSessions(roleId) {
  // 先 slice 副本再排：就地排会打乱 state.sessions 里那个数组的顺序，
  // 而 touchSession 还在往同一个数组上 push / find，顺序是它写入时的隐含前提
  const list = (state.sessions[roleId] || []).slice();
  list.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  return list;
}
// 记录/更新会话（首次消息作为标题，之后只刷新时间）
// roleId 必须由调用方显式传入：生成是后台跑的，完成时用户可能已经切到别的角色，
// 再读 state.roleId 会把沉底的会话挂到当前角色的列表下。
function touchSession(roleId, sid, title) {
  const arr = state.sessions[roleId] || (state.sessions[roleId] = []);
  let s = arr.find((x) => x.id === sid);
  // 标题只在首次创建时定下（截 30 字防长问题撑爆条目），后续消息只刷新时间，
  // 否则会话标题会随着每轮对话不停改写，列表变得没法认
  if (!s) arr.push({ id: sid, title: (title || "新会话").slice(0, 30), updatedAt: Date.now() });
  else s.updatedAt = Date.now();
  saveSessions();
}
// 只删除当前角色名下的条目：会话不跨角色，界面上也拿不到别的角色下的会话 id
function removeSession(sid) {
  state.sessions[state.roleId] = (state.sessions[state.roleId] || []).filter((x) => x.id !== sid);
  localStorage.removeItem("rp_msgs_" + sid);
  saveSessions();
}

// ---------------- 工具 ----------------
// 本文件所有注入 innerHTML 的动态文本都要先过这一道。用户输入和模型输出都是不可信内容，
// 直接拼进 HTML 会让其中的标签被当代码执行（气泡内容就是 innerHTML 写入的）。
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

// 极简 markdown：先转义再渲染，只认标题 / 列表 / 粗体 / 行内代码，避免 XSS。
// 不引 marked/markdown-it 之类的库：内网离线环境取不到 CDN，本文件也没有打包步骤。
// 代价是只支持这四个语法、不支持嵌套；正则的先后顺序有依赖，不能随手调换：
// 转义必须排在最前，两个换行替换也必须排在单个换行之前（链式调用，否则段落间距会被拆没）。
function md(s) {
  let h = esc(s);
  h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/^#{1,6}[ \t]+(.*)\n?/gm, '<div class="md-h">$1</div>');
  h = h.replace(/^[ \t]*[-*][ \t]+(.*)\n?/gm, '<div class="md-li">$1</div>');
  h = h.replace(/\n{2,}/g, "<br><br>").replace(/\n/g, "<br>");
  return h;
}

// 直接赋值而不是 smooth 平滑滚动：流式期间每个 token 都会调进来一次，
// 平滑动画会被下一次调用打断，看上去一顿一顿的
function scrollDown() { msgs.scrollTop = msgs.scrollHeight; }

// 只做粗粒度分档、不实时刷新：会话列表是按需重绘的，没有秒级定时器去更新「几分钟前」，
// 所以这个数字只在别的操作触发重绘时才跟着变
function timeAgo(ts) {
  const d = Date.now() - ts;
  if (d < 60000) return "刚刚";
  if (d < 3600000) return Math.floor(d / 60000) + " 分钟前";
  if (d < 86400000) return Math.floor(d / 3600000) + " 小时前";
  return new Date(ts).toLocaleDateString();
}

// SSE 解析器：/chat/stream 是 POST，而浏览器原生 EventSource 只能发 GET，所以自己读流解析。
function createSseParser(onEvent) {
  // buf 是必需的：网络分块的边界和 SSE 帧边界毫无关系，一个 chunk 可能只含半帧，
  // 也可能一口气含好几帧，不缓冲就会出现「JSON 解析到一半」的假错误
  let buf = "";
  return function push(chunk) {
    buf += chunk;
    let idx;
    // 服务端 _sse() 固定用 \n 而不是 \r\n 生成帧，这里才敢只找 "\n\n"
    while ((idx = buf.indexOf("\n\n")) >= 0) {
      const raw = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      let ev = "message", data = "";
      for (const line of raw.split("\n")) {
        if (line.startsWith("event:")) ev = line.slice(6).trim();
        // data 用 += 累加：SSE 规范允许一帧拆成多行 data，语义是拼接
        else if (line.startsWith("data:")) data += line.slice(5).trim();
      }
      // 保活帧/注释帧（只有冒号开头的行）没有 data 字段，不是错误，跳过即可
      if (!data) continue;
      let payload;
      // 单帧坏掉只丢这一帧。若放任它抛出去，会被 send 里那层 catch 当成「请求失败」，
      // 把一条其实还活着的流误判为断了
      try { payload = JSON.parse(data); } catch (_) { continue; }
      onEvent(ev, payload);
    }
  };
}

// 返回整段 HTML 字符串由调用方拼接（而不是自己插进 DOM）：引用区跟着气泡一起重建，
// 不单独维护一份状态。默认折叠，长片段不会一上来就占满屏幕。
// sources 里的文本同样要 esc——它就是知识库原文，来源不可控。
function sourcesHtml(sources) {
  if (!sources || !sources.length) return "";
  const items = sources.map((s) => (
    '<div class="src-item">' +
      // 这个分数是检索排序分（RRF 融合分，或启用 bge 时的重排分），不是相似度百分比
      '<div class="src-meta">' + esc(s.source || "未知来源") +
      ' · 排序分 <span class="sc">' + (typeof s.score === "number" ? s.score.toFixed(3) : esc(s.score)) + "</span></div>" +
      '<div class="src-text">' + esc(s.text || "") + "</div>" +
    "</div>"
  )).join("");
  return '<details class="src"><summary>引用来源（' + sources.length + "）</summary>" +
         '<div class="src-list">' + items + "</div></details>";
}

// 启动时 roles 还是空数组、角色被删过时也会找不到，所以调用方一律要按 null 兜底
function currentRole() {
  return state.roles.find((x) => x.role_id === state.roleId) || null;
}
function currentRoleName() {
  const r = currentRole();
  return r ? r.name : "";
}

// ---------------- 消息渲染 ----------------
// 这一层的分工：addMsgView 造一条气泡，renderMsgs 按 state 重放整段历史，
// paint 只动「正在生成的那一条」。流式的开销控制全靠 paint 不碰其余节点。
function addMsgView(role, textHtml, sources) {
  // 首次发言时清掉「选一个角色」占位；用 ?. 是因为此后它已经不在了
  $("empty")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + role;
  // 名字和头像都是渲染时现取当前角色，而不是存在消息里：
  // 所以角色资料改了之后，历史气泡的外观也会跟着变（这里接受这个副作用）
  const who = role === "user" ? "你" : (currentRoleName() || "助手");
  // 用户侧固定「我」，角色侧优先用角色 emoji，没有则退回文字
  const av = role === "user"
    ? { cls: "", text: "我" }
    : { cls: " emoji", text: currentRole()?.avatar || "AI" };
  el.innerHTML =
    '<div class="av' + av.cls + '">' + esc(av.text) + "</div>" +
    '<div class="body"><div class="who">' + esc(who) + "</div>" +
    '<div class="bubble"></div></div>';
  // textHtml 由调用方保证是已转义/已渲染的可信 HTML；sources 单独拼在这里，
  // 是为了让「引用来源」永远落在气泡最底部，不被正文追加内容挤到中间
  el.querySelector(".bubble").innerHTML = textHtml + (sources ? sourcesHtml(sources) : "");
  msgs.appendChild(el);
  scrollDown();
  // 把气泡节点交出去：流式增量要靠它做定点替换，重新 querySelector 容易拿到别的气泡
  return el.querySelector(".bubble");
}

// 全量重建：清空后按 localStorage 重放一遍。好处是不用维护增量 diff，
// 坏处是每次重画都会丢掉 <details> 的展开状态和文本选区——消息只有几十条，这里认了。
function renderMsgs() {
  msgs.innerHTML = "";
  const list = loadMsgs(state.sessionId);
  const st = state.streams[state.sessionId];
  // 历史为空「且」没有在跑的流，才是真正的空会话；只有一边为空时仍要正常渲染
  if (!list.length && !st) {
    msgs.innerHTML = '<div class="empty">选一个角色，然后开始对话</div>';
    return;
  }
  for (const m of list) {
    // truncated：中途停止/断连保存的下半截回答，得让用户看出来它不是完整回答
    const tail = m.truncated ? '<div class="md-h">（已停止生成，内容不完整；模型也不会记住这一轮）</div>' : "";
    addMsgView(m.role, md(m.text) + tail, m.sources);
  }
  // 正在生成的那条还没落盘（要等 done 才知道服务端清洗后的最终文本），
  // 所以按当前累积内容单独补一个气泡，并打上 data-live 供增量刷新定位。
  // 打 data-live 是给 paint() 当锚点用的选择器；同一会话同时只允许一条流，
  // 所以页面里最多只该存在一个这样的气泡
  if (st) {
    const bubble = addMsgView("assistant", liveHtml(st), null);
    bubble.dataset.live = "1";
  }
}

// 生成中气泡的内容：正常是「已累积文本 + 光标」，出错则显示中断提示
function liveHtml(st) {
  if (st.error) {
    // 出错时不再画光标（后面不会再有内容了），但已经流出来的部分照样留着，
    // 让用户至少能拿到半截答案，而不是整条消失
    return '<span class="err-box">生成中断：' + esc(st.error) + "</span>" + (st.answer ? md(st.answer) : "");
  }
  return (st.answer ? md(st.answer) : "") + '<span class="cursor"></span>';
}

// 增量到达时只刷新当前会话那个气泡，不整表重建（否则每来一个 token 都要重排整个列表）
function paint(sid) {
  const st = state.streams[sid];
  if (!st || sid !== state.sessionId) return;   // 不在当前会话：只累积，不渲染
  // 每次都重新查节点、不缓存引用：renderMsgs 会整块重建 DOM，
  // 早先存下来的节点引用会变成游离节点，往里写内容用户什么也看不到
  const live = msgs.querySelector(".bubble[data-live]");
  if (!live) { renderMsgs(); return; }          // 气泡还没建出来（例如刚切过来）
  live.innerHTML = liveHtml(st);
  scrollDown();
}

// 生成状态变化后刷新界面：当前会话重绘消息区，会话列表角标同步，输入区按钮态同步
// 三件事捆在一个函数里，是因为它们表达的是同一个事实（某会话在不在生成中）：
// 分开调、漏掉任何一处，界面就会出现自相矛盾的组合，比如列表显示生成中而输入框已经解锁
function refreshSession(sid) {
  if (sid === state.sessionId) renderMsgs();
  renderSessions();
  updateComposer();
}

// busy 由 streams 现推、不另存一个布尔标志：切会话时按钮态自动跟着当前会话变，
// 不会出现「切走了输入框还锁着」这类需要手动同步的状态
function updateComposer() {
  const busy = !!state.streams[state.sessionId];
  $("btnSend").disabled = busy;
  $("btnStop").style.display = busy ? "" : "none";
}

// 每次都是「读全量 → push → 整份写回」：没有服务端存储，localStorage 里这个数组就是唯一副本。
// extra 专门用来捎带 truncated 这类附加标记，免得为它再开一个写入函数。
function appendStored(sid, role, text, sources, extra) {
  const list = loadMsgs(sid);
  list.push(Object.assign({ role, text, sources: sources || [] }, extra || {}));
  saveMsgs(sid, list);
}

// ---------------- 会话渲染 ----------------
// 同样是整块重建 + 重新绑定点击。没用事件委托，是因为条目本身和条目里的删除按钮
// 点击语义不同（一个切会话、一个删会话），各绑各的比在委托里判别 target 更不容易写错。
// 搜索在本地过滤、不请求后端：会话数很少，本地 includes 足够快。
function renderSessions() {
  const box = $("sessionList");
  const q = state.search.trim().toLowerCase();
  const list = roleSessions(state.roleId).filter((s) =>
    !q || (s.title || "").toLowerCase().includes(q)
  );
  if (!list.length) {
    box.innerHTML = '<div class="session-empty">' +
      (state.search ? "无匹配会话" : "暂无会话，点「新会话」开始") + "</div>";
    return;
  }
  box.innerHTML = list.map((s) => (
    '<div class="session-item' + (s.id === state.sessionId ? " active" : "") + '" data-id="' + esc(s.id) + '">' +
      // 「生成中」角标的依据是 state.streams 而不是当前会话：
      // 用户切走后仍在后台跑的那些会话，也要在列表里看得出来
      '<div class="stitle">' + esc(s.title || "新会话") +
        (state.streams[s.id] ? '<span class="sbusy">生成中</span>' : "") + "</div>" +
      '<div class="smeta">' + timeAgo(s.updatedAt) + "</div>" +
      '<button class="sdel" data-id="' + esc(s.id) + '" title="删除会话">×</button>' +
    "</div>"
  )).join("");
  box.querySelectorAll(".session-item").forEach((el) => {
    el.onclick = () => switchSession(el.dataset.id);
  });
  box.querySelectorAll(".sdel").forEach((el) => {
    // 必须 stopPropagation：删除按钮叠在条目内部，不拦住就会先触发条目的 onclick，
    // 变成「先切过去再删掉」——删除的是刚被激活的那个会话
    el.onclick = (e) => { e.stopPropagation(); deleteSession(el.dataset.id); };
  });
}

// 切会话/切角色都不再打断正在跑的生成：那条流按 sid 独立活着，回来时接着显示。
// 只做「换指针 + 重画」，既不 abort 也不新建流：流的生死完全由 send 的 finally 负责
function switchSession(sid) {
  state.sessionId = sid;
  renderMsgs();
  renderSessions();
  updateComposer();
}

// 新会话只切指针、不动别人的流，也不立刻写进会话列表——
// 条目要等第一条消息靠 touchSession 落盘，避免连点「新会话」留下一堆空壳
function newSession() {
  state.sessionId = newSessionId();
  renderMsgs();
  renderSessions();
  updateComposer();
  // 桌面端可以纯键盘操作：新建即聚焦，接着打字就能发
  $("input").focus();
}

function deleteSession(sid) {
  // 会话被删了，挂在它上面的生成也要停掉；标记一下，
  // 免得 fetch 的 finally 回头又把半截回答写回已删除的 localStorage 键。
  const st = state.streams[sid];
  // 先落 deleted 标记再 abort：abort 会同步往下走 catch/finally，
  // 顺序反了 finally 就会把半截回答写回刚被清空的 localStorage 键
  if (st) { st.deleted = true; st.controller.abort(); delete state.streams[sid]; }
  removeSession(sid);
  // 只有删的是正在看的会话才需要另找一条顶上；删后台会话不该把用户视线带走
  if (sid === state.sessionId) {
    const list = roleSessions(state.roleId);
    // 该角色一条会话都不剩时回到空态（sessionId 为 null），而不是硬留着已删的 id
    state.sessionId = list.length ? list[0].id : null;
    renderMsgs();
  }
  renderSessions();
  updateComposer();
}

// 切角色不打断上一个角色的生成：它的流仍按自己的 sid 在后台跑
function onRoleChange(roleId) {
  state.roleId = roleId;
  // 记住选择，刷新后 loadRoles 会读回来，不必每次重新挑角色
  localStorage.setItem("rp_role", roleId);
  const list = roleSessions(roleId);
  // 优先回到该角色最近一条会话（roleSessions 已按时间倒序），符合「接着上次聊」的预期
  if (list.length) switchSession(list[0].id);
  else { state.sessionId = null; renderMsgs(); renderSessions(); updateComposer(); }
  // 这两个都读 state.roleId，必须在它更新之后调，否则侧栏还显示上一个角色的知识库
  loadKb();
  updateHint();
}

// ---------------- 加载角色 / 健康 / 知识库 ----------------
async function loadRoles() {
  const sel = $("roleSelect");
  try {
    // fetch 只在网络层失败时 reject，4xx/5xx 照样 resolve，必须自己查 ok
    const res = await fetch("/role/list");
    if (!res.ok) throw new Error("HTTP " + res.status);
    state.roles = await res.json();
  } catch (e) {
    // 请求失败和「列表为空」要分开提示：前者用户该去看服务，后者该去灌数据
    sel.innerHTML = '<option value="">角色加载失败</option>';
    return;
  }
  if (!state.roles.length) {
    sel.innerHTML = '<option value="">暂无角色（先用 scripts/seed.py 灌数据）</option>';
    return;
  }
  // 存下来的角色可能已经不存在（换库、角色被删）：回退到第一个并把新值写回去，
  // 否则 localStorage 里那个坏 id 会一直生效，每次刷新都落到同一个死路上
  if (!state.roles.some((r) => r.role_id === state.roleId)) {
    state.roleId = state.roles[0].role_id;
    localStorage.setItem("rp_role", state.roleId);
  }
  sel.innerHTML = state.roles.map((r) =>
    '<option value="' + esc(r.role_id) + '">' +
    (r.avatar ? esc(r.avatar) + " " : "") + esc(r.name) + "</option>"
  ).join("");
  sel.value = state.roleId;
  // 放在填充 options 之后挂：先挂的话，改 innerHTML 期间可能触发一次多余的 change
  sel.onchange = () => onRoleChange(sel.value);

  // 初始化当前角色的会话
  const list = roleSessions(state.roleId);
  if (list.length) switchSession(list[0].id);
  else { state.sessionId = null; renderMsgs(); renderSessions(); }
  updateHint();
}

// 由启动区的定时器每 30 秒调一次；用轮询而不是 WebSocket/SSE 推送：
// 这不是关键路径，30 秒的滞后足够发现依赖掉线，也不会给后端加负担
async function loadHealth() {
  const dot = $("healthDot"), txt = $("healthText");
  try {
    const res = await fetch("/health");
    const h = await res.json();
    // 判据是「不等于 ok」而不是「等于 error」：将来后端加 degraded/unknown 之类的新状态，
    // 前端不改代码也会把它算成异常，而不是漏报
    const bad = Object.entries(h.components || {}).filter(([, v]) => v !== "ok");
    if (bad.length) {
      dot.className = "dot err";
      // details 里是降级原因（如「Redis 不可达: ...」）。只说「memory=degraded」
      // 用户没法判断要不要处理，把原因一并显示出来。
      const why = (h.details && Object.keys(h.details).length)
        ? "（" + Object.entries(h.details).map(([k, v]) => k + ": " + v).join("；") + "）"
        : "";
      txt.textContent = "异常：" + bad.map(([k, v]) => k + "=" + v).join(", ") + why;
    } else {
      dot.className = "dot ok";
      txt.textContent = "服务正常";
    }
  } catch (e) {
    // 网络断了，或者 /health 返回的不是 JSON——都只能判成不可用，细节无处可取
    dot.className = "dot err";
    txt.textContent = "服务不可用";
  }
}

// /knowledge/list 给的是全库文档，得先按 role_id 过滤——服务端没有「按角色聚合篇数」的口径
async function loadKb() {
  try {
    const res = await fetch("/knowledge/list");
    const d = await res.json();
    const mine = (d.documents || []).filter((x) => x.role_id === state.roleId);
    // 自己把各文档的分块数加起来，而不是取某个 total 字段（total 是全库口径）
    const chunks = mine.reduce((n, x) => n + (x.chunk_count || 0), 0);
    $("kb").textContent = mine.length
      ? "当前角色 " + mine.length + " 篇 / " + chunks + " 个分块"
      : "当前角色暂无文档";
  } catch (e) {
    // 知识库统计只是侧栏的辅助信息，取不到就显示占位符，不弹错、不打断对话
    $("kb").textContent = "—";
  }
}

function updateHint() {
  const r = currentRole();
  const name = (r && r.avatar ? r.avatar + " " : "") + currentRoleName();
  // 用 textContent 而不是 innerHTML：角色名来自后端，不给它留注入的机会。
  // 措辞也刻意保持中性，不说「医疗建议」——模板服务的角色不都是医疗向的
  $("hint").textContent = "当前角色：" + name + " · 回答基于检索到的知识库片段，仅供参考。";
}

// ---------------- 发送（SSE 流式） ----------------
async function send() {
  const input = $("input");
  // 先 trim 再判空：只敲了空格或换行不算一个问题
  const question = input.value.trim();
  // 角色还没加载完时静默不发，比发出去换回一个 404 更干净
  if (!question || !state.roleId) return;
  // 没选会话就直接开一个，让「打开页面 → 打字 → 回车」这条路能走通
  if (!state.sessionId) newSession();

  // 发送时就把「这次生成属于哪个角色/会话」定下来。之后用户随便切角色、切会话，
  // 本次生成都只认这两个快照——否则答案会落到切换后的会话里（串数据）。
  const sid = state.sessionId;
  const roleId = state.roleId;
  if (state.streams[sid]) return;   // 同一会话不允许并发两条，会串了短期记忆

  // 立刻清空并复位高度：一是给出「已经发出去了」的即时反馈（后面 await 可能要等好久），
  // 二是防止等待期间再按一次回车把同一个问题发第二遍
  input.value = "";
  input.style.height = "auto";

  touchSession(roleId, sid, question);   // 首次消息作为会话标题，并记入会话列表
  // 用户消息先落盘再发请求：即使请求失败，问题也留在历史里，重发时还看得到自己问了什么
  appendStored(sid, "user", question, null);

  // done 单独占一个字段、不复用 error：它表达的是「这一轮到底完不完整」，
  // 而不是「出没出错」，落盘时要不要打 truncated 标记全看它
  const st = { answer: "", sources: [], error: "", controller: new AbortController(), deleted: false, done: false };
  state.streams[sid] = st;
  // 三处都要刷：消息区补上实时气泡、会话列表出「生成中」角标、输入区切到停止按钮
  renderMsgs();
  renderSessions();
  updateComposer();

  try {
    const res = await fetch("/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      // 发的是发送那一刻的快照，即使用户随后切了角色也不会串
      body: JSON.stringify({ question: question, role_id: roleId, session_id: sid }),
      // 每个会话一个 controller：停止按钮才能只中断某一条流，而不是一刀切
      signal: st.controller.signal,
    });
    // 后端在流开始前就失败时会返回普通 JSON 错误（未知角色 404、依赖掉线 503），
    // 这种响应没有 body 流，必须先拦下来走异常分支，不能直接进 reader 循环
    if (!res.ok || !res.body) throw new Error("HTTP " + res.status);

    const reader = res.body.getReader();
    // 每个请求新建一个 decoder：它内部带跨 chunk 的多字节状态，复用会串
    const decoder = new TextDecoder("utf-8");
    // 四类事件的处理：sources 只记录不渲染（引用区要跟最终落盘的那条消息一起画）、
    // delta 累积并刷新气泡、done 定稿、error 只记信息不结束循环（让 finally 统一收尾）
    const feed = createSseParser((ev, payload) => {
      if (ev === "sources") st.sources = payload.sources || [];
      // 只对当前会话调 paint：切走的会话照样累积，但不必浪费一次 DOM 写入
      else if (ev === "delta") { st.answer += payload.delta || ""; paint(sid); }
      else if (ev === "done") {
        // 流里吐的是模型原始增量，服务端在 done 里回传清洗后的权威文本
        // （去思维链/去幻觉引用/空白归一），用它覆盖，保证与 /chat 口径一致
        if (payload.answer) st.answer = payload.answer;
        st.done = true;   // 收到 done 才算"完整回答"，中途断的不能当完整答案存
        // 用覆盖而不是拼接：增量里可能夹着思维链和模型自己编的引用，
        // 只有 done.answer 是清洗过的版本，两边拼起来一定会出现重影或残留
      } else if (ev === "error") {
        // 只记消息、不 throw：让循环自然读到流结束，收尾逻辑集中放在 finally 里，
        // 否则「出错」和「正常结束」会走两套落盘路径
        st.error = payload.message || "生成中断";
      }
    });

    for (;;) {
      const { done, value } = await reader.read();
      // 读到流尾就退出：done 事件在这一步之前已经由 feed 处理过了，
      // 所以「流关了」并不等于「答案完整」，完整性只认 st.done
      if (done) break;
      feed(decoder.decode(value, { stream: true }));  // stream:true 处理跨 chunk 截断的多字节
    }
  } catch (e) {
    // 主动点停止不算错误：保留已生成的部分（是否完整由 st.done 决定，见 finally）
    // 按 name 而不是 message 判断：不同浏览器 abort 时的报错文案不一样，
    // 不特判就会把「用户点了停止」显示成「请求失败：The operation was aborted」
    st.error = e.name === "AbortError" ? "" : "请求失败：" + e.message;
  } finally {
    // 会话被删掉了就别再写回，否则会在 localStorage 留下看不见的孤儿键。
    // 没收到 done 就落盘的（中途点停止 / 连接断），内容只是**未清洗的原始增量**——
    // 其它消息存的都是服务端清洗后的权威文本，所以这里必须打上 truncated 标记，
    // 让界面说清"这条不完整"，而不是伪装成一条正常回答（模型那边也没有这一轮：
    // 客户端一断，服务端的生成就中止了，短期记忆里不会有它）。
    if (!st.deleted && st.answer) {
      // 落盘用的是 st.answer（done 到达时已被权威文本覆盖过），不是本地拼的增量
      appendStored(sid, "assistant", st.answer, st.sources, st.done ? null : { truncated: true });
    }
    // 先落盘再摘流：反过来的话，中间任何一次重绘都会让气泡凭空消失一条
    delete state.streams[sid];
    // 刷新的是传进来的 sid、不是当前会话：会话列表角标和输入区按钮态也要跟着一起收
    refreshSession(sid);
    // 用户可能早就切到别的角色/会话去了：这时候别抢焦点、也别拿滚动位置去打断他
    if (sid === state.sessionId) { input.focus(); scrollDown(); }
  }
}

// ---------------- 事件绑定 ----------------
// 直接挂 async 函数：send 内部自带 try/catch/finally，不会漏出未处理的 Promise 拒绝
$("btnSend").onclick = send;
// 点击时才去取「当前会话」的流，而不是绑定时取：按钮代表的是眼下的会话；
// ?. 兜住「生成刚好在这一瞬间结束」的竞态
$("btnStop").onclick = () => state.streams[state.sessionId]?.controller.abort();
$("btnNew").onclick = newSession;

// 不做防抖：会话只有几十条，本地过滤的代价远小于一次计时器往返；
// 加了防抖反而让输入有滞后感，得不偿失
$("sessionSearch").oninput = (e) => { state.search = e.target.value; renderSessions(); };

$("input").addEventListener("keydown", (e) => {
  // isComposing 是中文输入法的必需判断：拼音候选框里的回车同样会冒泡成 keydown，
  // 不排除它就会把半截拼音当成问题发出去（Shift+Enter 换行的例外照旧保留）
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$("input").addEventListener("input", (e) => {
  // 先归零再量 scrollHeight：不置 auto 的话它只会记着历史最大值，
  // 删字时高度不会回落
  e.target.style.height = "auto";
  // 上限 180px 与 CSS max-height 对齐，再长就交给 textarea 自己滚
  e.target.style.height = Math.min(e.target.scrollHeight, 180) + "px";
});

// ---------------- 启动 ----------------
// 健康探测和角色加载互不依赖，不 await 前者：串起来会白等一个网络往返才画出下拉框
loadHealth();
// 知识库统计要按角色过滤，所以必须等角色确定之后再拉
loadRoles().then(loadKb);
// 轮询而不是长连接：这个页面不需要毫秒级的故障感知，30 秒足够，
// 顺带避免了断线重连的一整套状态机
setInterval(loadHealth, 30000);
// 打开即可打字，省掉一次点击
$("input").focus();

// 这里刻意不做「流断了自动重连」：客户端一断，服务端的生成就已经中止，
// 短期记忆里不会留下这一轮，重连上来的回答与前面显示的增量对不上。
// 处理方式是落一条 truncated 标记的半截回答（见 send 的 finally），由用户自己决定要不要再问一次。
</script>
</body>
</html>
