# 工单 15 · 跨模态检索优化配置（所有阈值可外部调整，不硬编码）

retrieval:
  fusion: rrf              # rrf | weighted —— 双路召回(文本/图像增强)融合算法
  rrf_k: 60
  route_weights: [1.0, 1.0]  # [原问题路, 图像增强路]

  # RAGFlow 原生加权混合参数
  vector_similarity_weight: 0.3   # 向量分权重；tkweight = 1 - 该值
  similarity_threshold: 0.2

rerank:
  enabled: true
  limit: 30                # 参与重排的候选数（RAGFlow 内部下限 30）

query_understanding:
  enable_visual_ref: true
  # 视觉引用正则（可扩展）
  patterns:
    figure: '图\s*(\d{1,3})'
    page:   '第\s*(\d{1,4})\s*页'
    part:   '(?:部件|零件|元件|编号)\s*(\d{1,3})'
    illus:  '(图示|附图|图纸|示意图|结构图)'

prompt:
  multimodal_hint: '请结合以下技术图纸的描述进行分析'

pdf_parse:
  # 承接工单14：图像描述必须进入可检索文本
  image2text_model: Qwen-VL          # 知识库绑定的 IMAGE2TEXT 模型
  image_context_size: 2              # 图前后文拼接条数
