# =============================================================================
# 法律 RAG Nginx 反向代理配置（批次 33）
#
# 部署位置：/etc/nginx/sites-available/legal-rag → 软链到 sites-enabled
#           （或复制到 /etc/nginx/conf.d/legal-rag.conf）
# 拓扑：Nginx:80 → 前端 Next.js(3000) + 后端 FastAPI(8000)
#
# 关键点：
# - /api/ 直连后端，绕过 Next.js 运行时反代，SSE 链路少一跳缓冲；
#   /api/v1/chat/stream 是 SSE（text/event-stream），必须关代理缓冲
#   （proxy_buffering off + X-Accel-Buffering no 双保险），读超时给足 300s
# - 上传走 50m 上限（与文档口径一致）
# - 生产建议在此之上叠 HTTPS（certbot）与安全响应头，见部署文档第 12 节
# =============================================================================

upstream rag_backend {
    server 127.0.0.1:8000;
    # 多实例时追加：server 127.0.0.1:8001;
}

upstream rag_frontend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name _;                      # 生产改为实际域名或服务器 IP

    client_max_body_size 50m;

    # ---- 后端 API（含 SSE）----
    location /api/ {
        proxy_pass http://rag_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        # SSE 必需：禁缓冲（响应头再关一层）+ 拉长读超时 + 不用分块缓冲
        proxy_buffering off;
        proxy_set_header X-Accel-Buffering no;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # SSE 长连接不因空闲被掐
        proxy_set_header Connection "";
    }

    # ---- 后端健康检查（内网排障用；生产可限内网访问）----
    location = /health/live { proxy_pass http://rag_backend; }
    location = /health/ready { proxy_pass http://rag_backend; }

    # ---- 前端（Next.js）----
    location / {
        proxy_pass http://rag_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Next.js HMR / Next 14+ 的 WebSocket 端点（开发联动时需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
