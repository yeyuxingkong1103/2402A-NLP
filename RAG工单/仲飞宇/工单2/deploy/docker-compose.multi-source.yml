# 多路召回扩展数据源：Neo4J（图）/ MongoDB（文档）/ ClickHouse（分析）。
# 需求里的「多路召回：从不同数据源查询（Milvus、MySQL、Neo4J、MongoDB、Redis、互联网、ClickHouse）」。
# 本仓库默认只启用「Milvus 稠密 + BM25 关键词」两路；这些容器用于扩展更多召回源，
# 各自连接器见 app/core/retrieve/（新增一个 route 返回 ranked id 列表，交给 rrf_fusion 融合即可）。
#
# 启动：docker compose -f deploy/docker-compose.multi-source.yml up -d
# 注意：与本项目主链路无耦合，可独立启停，不影响在线对话。
services:
  neo4j:
    image: neo4j:5-community
    container_name: rag-neo4j
    environment:
      NEO4J_AUTH: neo4j/ragroleplay
    ports:
      - "7474:7474"   # HTTP
      - "7687:7687"   # Bolt（图查询）
    volumes:
      - neo4j-data:/data

  mongodb:
    image: mongo:7
    container_name: rag-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: rag
      MONGO_INITDB_ROOT_PASSWORD: ragroleplay
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: rag-clickhouse
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # Native
    volumes:
      - clickhouse-data:/var/lib/clickhouse

volumes:
  neo4j-data:
  mongo-data:
  clickhouse-data:
