<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知识库上传 - 法律客服助手</title>
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
  <main class="shell">
    <nav class="topbar" aria-label="主导航">
      <a class="brand" href="../index.html">法助 RAG</a>
      <div class="nav-links">
        <a href="./chat.html">智能咨询</a>
        <a aria-current="page" href="./knowledge-bases.html">知识库上传</a>
        <a href="./profile.html">个人中心</a>
      </div>
    </nav>

    <section class="page-heading">
      <p class="eyebrow">Knowledge Base</p>
      <h1>知识库上传与审核</h1>
      <p>把本地法律材料上传到后端，自动生成快照和待审核材料，然后完成审核与发布。</p>
    </section>

    <section class="dashboard-grid">
      <form id="upload-form" class="panel upload-panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Upload</p>
            <h2>上传本地材料</h2>
          </div>
          <span class="status-pill">单端口 8010</span>
        </div>

        <label class="field">
          <span>材料标题</span>
          <input id="material-title" name="title" type="text" placeholder="例如：民法典合同编重点条文" required>
        </label>

        <div class="field-row">
          <label class="field">
            <span>发布机关</span>
            <input id="material-publisher" name="publisher" type="text" value="本地上传" required>
          </label>
          <label class="field">
            <span>材料类型</span>
            <select id="material-type" name="material_type">
              <option value="law">法律</option>
              <option value="administrative_regulation">行政法规</option>
              <option value="department_rule">部门规章</option>
              <option value="judicial_interpretation">司法解释</option>
              <option value="guiding_case">指导案例</option>
              <option value="typical_case">典型案例</option>
            </select>
          </label>
        </div>

        <label class="dropzone" for="material-file">
          <input id="material-file" type="file" accept=".txt,.md,.html,.htm,.json,.csv">
          <strong>拖入或点击选择文件</strong>
          <span id="file-name">支持 txt、md、html、json、csv，浏览器读取内容后提交。</span>
        </label>

        <label class="field">
          <span>材料正文</span>
          <textarea id="material-content" rows="9" placeholder="也可以直接粘贴材料正文" required></textarea>
        </label>

        <button id="upload-button" class="button primary full" type="submit">上传并提交审核</button>
        <p id="upload-status" class="status-text" role="status"></p>
      </form>

      <section class="panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Workflow</p>
            <h2>处理流程</h2>
          </div>
        </div>
        <ol class="timeline">
          <li><strong>1. 上传</strong><span>生成本地来源白名单和内容快照。</span></li>
          <li><strong>2. 审核</strong><span>材料进入 pending_review，可一键审核通过。</span></li>
          <li><strong>3. 发布</strong><span>发布后变为 searchable，为后续检索做准备。</span></li>
        </ol>
      </section>
    </section>

    <section class="panel material-panel">
      <div class="panel-header">
        <div>
          <p class="eyebrow">Materials</p>
          <h2>材料列表</h2>
        </div>
        <button id="refresh-button" class="button secondary" type="button">刷新列表</button>
      </div>
      <section id="material-list" class="material-list"></section>
      <p id="knowledge-error" class="status-text" role="alert"></p>
    </section>
  </main>
  <script type="module" src="../js/pages/knowledge-bases.js"></script>
</body>
</html>
