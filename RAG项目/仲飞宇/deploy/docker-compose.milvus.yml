# Milvus 独立服务（standalone）：etcd + minio + milvus 三件套。
#
# 为什么需要这个文件：
#   开发默认用 Milvus Lite（`MILVUS_DB_URI=./data/milvus.db`，随应用进程内嵌启动），
#   它**独占数据目录的文件锁**——同一份 db 同时只能有一个进程打开（app / ingest / eval
#   三者只能有一个）。所以「多 uvicorn worker + nginx 负载均衡」这种横向扩展**必须先切
#   到本文件的独立服务**，否则第二个 worker 连不上向量库。
#
#   此前仓库里没有这份定义，`.env.prod` 的 `MILVUS_DB_URI=http://milvus-standalone:19530`
#   只是引用了一个主机名，没有任何地方定义过这个容器——换台机器部署会直接踩空。
#   本文件补上这块，镜像版本与官方 standalone compose 一致（与 Lite 同源，schema 兼容）。
#
# 用法：
#   docker compose -f deploy/docker-compose.milvus.yml up -d
#   # 等 healthy（standalone 首次启动约 30~90 秒）
#   docker compose -f deploy/docker-compose.milvus.yml ps
#   # 让应用指向它（用环境变量覆盖，不必改 .env，见 app/core/config.py:16 的 override=False）
#   MILVUS_DB_URI=http://127.0.0.1:19530 .venv/bin/python scripts/seed.py
#
# 注意：本机（2026-09-20）已有一套同名容器在跑，它们来自
# `/home/zhongfeiyu/milvus/docker-compose.yml`，卷 bind 到 `/home/zhongfeiyu/milvus/volumes/`。
# **别同时用本文件和那一套**——容器名相同会冲突，且两套卷路径不同、数据互相看不见。
# 若要用本文件接管，先 `docker rm -f milvus-standalone milvus-etcd milvus-minio`，
# 再把下面的 MILVUS_VOLUME_DIR 指到既有卷目录以复用数据。
#
# 卷目录（默认在 deploy/ 下，可用环境变量覆盖以免污染仓库）：
#   MILVUS_VOLUME_DIR=/home/zhongfeiyu/milvus/volumes docker compose -f ... up -d

services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${MILVUS_VOLUME_DIR:-./milvus-volumes}/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ${MILVUS_VOLUME_DIR:-./milvus-volumes}/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.4.15
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${MILVUS_VOLUME_DIR:-./milvus-volumes}/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

networks:
  default:
    name: milvus
