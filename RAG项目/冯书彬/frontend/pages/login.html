<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>登录 - 法律客服助手</title><link rel="stylesheet" href="../css/common.css"></head>
<body><main class="app"><h1>法律客服助手</h1><form id="login-form"><label>手机号<input data-testid="phone-input" id="phone-input" type="tel" required></label><div><button data-testid="request-code-button" id="request-code-button" type="button">获取验证码</button><span id="code-status"></span></div><label>验证码<input data-testid="code-input" id="code-input" inputmode="numeric" required></label><label><input id="privacy-checkbox" type="checkbox" required>同意隐私政策</label><label><input id="agreement-checkbox" type="checkbox" required>同意用户服务协议</label><label><input id="adult-checkbox" type="checkbox" required>我已年满18周岁</label><button data-testid="login-button" type="submit">登录</button><p id="error-message" role="alert"></p></form><a href="./register.html">注册说明</a></main><script type="module" src="../js/pages/login.js"></script></body>
</html>
