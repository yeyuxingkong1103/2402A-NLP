<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="960" viewBox="0 0 1360 960" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#334155"/>
    </marker>
    <linearGradient id="gStart" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient>
    <linearGradient id="gProc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f5f9"/></linearGradient>
    <linearGradient id="gDec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7ed"/><stop offset="1" stop-color="#fed7aa"/></linearGradient>
    <linearGradient id="gFix" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0fdf4"/><stop offset="1" stop-color="#bbf7d0"/></linearGradient>
    <linearGradient id="gBad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef2f2"/><stop offset="1" stop-color="#fecaca"/></linearGradient>
  </defs>

  <rect width="1360" height="960" fill="#ffffff"/>
  <text x="680" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">核心请求处理流程与决策图（优化前后对照 · 工单十七）</text>
  <text x="680" y="62" text-anchor="middle" font-size="13" fill="#64748b">工单编号：人工智能 NLP-RAG-解决API服务并发瓶颈与资源泄漏</text>

  <!-- legend -->
  <rect x="40" y="78" width="18" height="18" rx="3" fill="url(#gBad)" stroke="#ef4444"/>
  <text x="66" y="92" font-size="12" fill="#7f1d1d">基线缺陷路径</text>
  <rect x="200" y="78" width="18" height="18" rx="3" fill="url(#gFix)" stroke="#22c55e"/>
  <text x="226" y="92" font-size="12" fill="#14532d">优化后路径</text>
  <rect x="360" y="78" width="18" height="18" rx="3" fill="url(#gDec)" stroke="#f59e0b"/>
  <text x="386" y="92" font-size="12" fill="#78350f">决策点</text>

  <!-- ===== LEFT COLUMN: 问答链路 ===== -->
  <text x="330" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">问答链路（/chat/completions）</text>

  <rect x="210" y="148" width="240" height="52" rx="26" fill="url(#gStart)" stroke="#3b82f6"/>
  <text x="330" y="179" text-anchor="middle" font-size="13" fill="#1e3a8a">并发请求到达（20 用户）</text>

  <rect x="210" y="228" width="240" height="56" rx="10" fill="url(#gDec)" stroke="#f59e0b"/>
  <text x="330" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">决策① 组件是否已初始化？</text>
  <text x="330" y="272" text-anchor="middle" font-size="11" fill="#78350f">单例命中 / 重复初始化</text>

  <!-- baseline branch -->
  <rect x="60" y="318" width="270" height="96" rx="10" fill="url(#gBad)" stroke="#ef4444"/>
  <text x="195" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">基线：每请求 load_kb() 重载</text>
  <text x="195" y="364" text-anchor="middle" font-size="11" fill="#7f1d1d">重读 87MB 向量 + 10MB 切片</text>
  <text x="195" y="384" text-anchor="middle" font-size="11" fill="#7f1d1d">重建 QAEngine（≈2.5s 固定开销）</text>
  <text x="195" y="404" text-anchor="middle" font-size="11" fill="#b91c1c">→ 瓶颈一：初始化延迟 + 资源争用</text>

  <rect x="420" y="318" width="270" height="96" rx="10" fill="url(#gFix)" stroke="#22c55e"/>
  <text x="555" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">优化：进程内单例复用</text>
  <text x="555" y="364" text-anchor="middle" font-size="11" fill="#14532d">ResourceManager 启动预热一次</text>
  <text x="555" y="384" text-anchor="middle" font-size="11" fill="#14532d">请求零重复初始化</text>
  <text x="555" y="404" text-anchor="middle" font-size="11" fill="#15803d">→ 固定开销归零</text>

  <rect x="210" y="440" width="240" height="56" rx="10" fill="url(#gDec)" stroke="#f59e0b"/>
  <text x="330" y="464" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">决策② 会话上下文如何存？</text>
  <text x="330" y="484" text-anchor="middle" font-size="11" fill="#78350f">无界 dict / 有界 LRU+TTL</text>

  <rect x="60" y="522" width="270" height="86" rx="10" fill="url(#gBad)" stroke="#ef4444"/>
  <text x="195" y="546" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">基线：_SESSIONS 全局字典</text>
  <text x="195" y="568" text-anchor="middle" font-size="11" fill="#7f1d1d">只增不减，长跑内存持续上涨</text>
  <text x="195" y="590" text-anchor="middle" font-size="11" fill="#b91c1c">→ 泄漏点一</text>

  <rect x="420" y="522" width="270" height="86" rx="10" fill="url(#gFix)" stroke="#22c55e"/>
  <text x="555" y="546" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">优化：BoundedSessionStore</text>
  <text x="555" y="568" text-anchor="middle" font-size="11" fill="#14532d">容量 512 + TTL 1800s + 后台清理</text>
  <text x="555" y="590" text-anchor="middle" font-size="11" fill="#15803d">→ 内存恒定</text>

  <rect x="210" y="634" width="240" height="56" rx="10" fill="url(#gDec)" stroke="#f59e0b"/>
  <text x="330" y="658" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">决策③ 是否限制在飞并发？</text>
  <text x="330" y="678" text-anchor="middle" font-size="11" fill="#78350f">无限制 / Semaphore 限流</text>

  <rect x="60" y="716" width="270" height="86" rx="10" fill="url(#gBad)" stroke="#ef4444"/>
  <text x="195" y="740" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">基线：同步 def 端点，无队列</text>
  <text x="195" y="762" text-anchor="middle" font-size="11" fill="#7f1d1d">请求堆积、线程阻塞</text>
  <text x="195" y="784" text-anchor="middle" font-size="11" fill="#b91c1c">→ 瓶颈二：P95 飙至 8.3s</text>

  <rect x="420" y="716" width="270" height="86" rx="10" fill="url(#gFix)" stroke="#22c55e"/>
  <text x="555" y="740" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">优化：async + 线程池 + 信号量</text>
  <text x="555" y="762" text-anchor="middle" font-size="11" fill="#14532d">run_in_threadpool 卸载阻塞检索</text>
  <text x="555" y="784" text-anchor="middle" font-size="11" fill="#15803d">→ P95 降至 2s 内</text>

  <rect x="210" y="828" width="240" height="52" rx="10" fill="url(#gStart)" stroke="#3b82f6"/>
  <text x="330" y="852" text-anchor="middle" font-size="12" fill="#1e3a8a">检索 + 重排 + 答案合成</text>
  <text x="330" y="870" text-anchor="middle" font-size="11" fill="#1e3a8a">→ 返回 OpenAI 兼容响应</text>

  <!-- ===== RIGHT COLUMN: 上传链路 ===== -->
  <text x="1030" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">上传解析链路（/documents）</text>

  <rect x="910" y="148" width="240" height="52" rx="26" fill="url(#gStart)" stroke="#3b82f6"/>
  <text x="1030" y="179" text-anchor="middle" font-size="13" fill="#1e3a8a">上传请求到达（5 用户）</text>

  <rect x="910" y="228" width="240" height="56" rx="10" fill="url(#gDec)" stroke="#f59e0b"/>
  <text x="1030" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">决策④ 解析是否异步化？</text>
  <text x="1030" y="272" text-anchor="middle" font-size="11" fill="#78350f">请求内同步 / 入队异步</text>

  <rect x="760" y="318" width="270" height="96" rx="10" fill="url(#gBad)" stroke="#ef4444"/>
  <text x="895" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">基线：请求线程内同步解析</text>
  <text x="895" y="364" text-anchor="middle" font-size="11" fill="#7f1d1d">单文档数十秒，占用请求线程</text>
  <text x="895" y="384" text-anchor="middle" font-size="11" fill="#7f1d1d">解析产物 _PARSE_ARTIFACTS 不释放</text>
  <text x="895" y="404" text-anchor="middle" font-size="11" fill="#b91c1c">→ 瓶颈二 + 泄漏点一叠加</text>

  <rect x="1120" y="318" width="200" height="96" rx="10" fill="url(#gFix)" stroke="#22c55e"/>
  <text x="1220" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">优化：立即入队</text>
  <text x="1220" y="364" text-anchor="middle" font-size="11" fill="#14532d">API 不阻塞</text>
  <text x="1220" y="384" text-anchor="middle" font-size="11" fill="#14532d">返回 task_id</text>
  <text x="1220" y="404" text-anchor="middle" font-size="11" fill="#15803d">→ 毫秒级响应</text>

  <rect x="910" y="440" width="240" height="56" rx="10" fill="#fff7ed" stroke="#fb923c"/>
  <text x="1030" y="464" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">Redis 队列 rag:tasks</text>
  <text x="1030" y="484" text-anchor="middle" font-size="11" fill="#7c2d12">LPUSH 入队 → BRPOP 消费</text>

  <rect x="910" y="522" width="240" height="56" rx="10" fill="url(#gFix)" stroke="#22c55e"/>
  <text x="1030" y="546" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">Task Executor worker 池</text>
  <text x="1030" y="566" text-anchor="middle" font-size="11" fill="#14532d">2 worker + parse_sem=2 限流</text>

  <rect x="910" y="606" width="240" height="56" rx="10" fill="url(#gProc)" stroke="#64748b"/>
  <text x="1030" y="630" text-anchor="middle" font-size="12" fill="#0f172a">解析 PDF → 结构感知切片</text>
  <text x="1030" y="650" text-anchor="middle" font-size="11" fill="#475569">（表格 / 图形语义 / 正文）</text>

  <rect x="910" y="690" width="240" height="56" rx="10" fill="url(#gProc)" stroke="#64748b"/>
  <text x="1030" y="714" text-anchor="middle" font-size="12" fill="#0f172a">向量化 → 追加内存知识库</text>
  <text x="1030" y="734" text-anchor="middle" font-size="11" fill="#475569">vstack 向量 + 倒排 finalize</text>

  <rect x="910" y="774" width="240" height="52" rx="10" fill="url(#gStart)" stroke="#3b82f6"/>
  <text x="1030" y="798" text-anchor="middle" font-size="12" fill="#1e3a8a">任务状态 done（可被检索）</text>
  <text x="1030" y="816" text-anchor="middle" font-size="11" fill="#1e3a8a">/api/v1/tasks/{task_id}</text>

  <rect x="910" y="852" width="240" height="52" rx="10" fill="url(#gBad)" stroke="#ef4444"/>
  <text x="1030" y="876" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">基线：无队列，无异步</text>
  <text x="1030" y="894" text-anchor="middle" font-size="11" fill="#7f1d1d">上传与问答互相拖垮</text>

  <!-- arrows left -->
  <line x1="330" y1="200" x2="330" y2="228" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="290" y1="284" x2="195" y2="318" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="370" y1="284" x2="555" y2="318" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="330" y1="414" x2="330" y2="440" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="290" y1="496" x2="195" y2="522" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="370" y1="496" x2="555" y2="522" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="330" y1="608" x2="330" y2="634" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="290" y1="690" x2="195" y2="716" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="370" y1="690" x2="555" y2="716" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="330" y1="802" x2="330" y2="828" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- arrows right -->
  <line x1="1030" y1="200" x2="1030" y2="228" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="990" y1="284" x2="895" y2="318" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1070" y1="284" x2="1220" y2="318" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1030" y1="414" x2="1030" y2="440" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1030" y1="496" x2="1030" y2="522" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1030" y1="578" x2="1030" y2="606" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1030" y1="662" x2="1030" y2="690" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1030" y1="746" x2="1030" y2="774" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <text x="1235" y="440" font-size="11" fill="#b91c1c">基线无此环节</text>
</svg>