# 工单编号：人工智能NLP-RAG-金融问答系统部署
#
# RTMP 服务配置。
#
# 这个服务的用途是网络连通性验证的对端，不是真的要推流业务，
# 所以配置只求「协议真实、状态可查」：
#   · 1935 端口跑真正的 RTMP 协议（rag-app 容器内做 TCP 连通性探测）
#   · 80 端口给健康检查与状态页

# Alpine 的 nginx-mod-rtmp 是动态模块，必须显式加载
load_module /usr/lib/nginx/modules/ngx_rtmp_module.so;

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;          # 只做连通性验证，不落盘录像
        }
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;

    server {
        listen 80;
        server_name _;

        # 健康检查端点：容器编排和验收测试都探这个
        location /health {
            add_header Content-Type text/plain;
            return 200 "rtmp-server ok\n";
        }

        # RTMP 状态页，能看到当前有哪些流
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }
    }
}
