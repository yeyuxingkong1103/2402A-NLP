# 工单编号：人工智能NLP-RAG-图像内容解析及检索优化
# 文件说明：一键部署。Milvus（含 etcd/minio）+ Redis + backend + frontend(nginx)。
#   注意：本机已常驻 rag-* 容器占用 19530/6379，本地开发请勿执行本文件，直接连本机服务即可；
#   本文件用于干净机器的完整部署。
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.4.9
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports: ["19530:19530", "9091:9091"]
    depends_on: [etcd, minio]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: ["./deploy/redis:/data"]

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    environment:
      # 容器内走服务名；密钥由宿主机环境变量注入，绝不写进镜像
      MILVUS_URI: http://milvus:19530
      REDIS_URL: redis://redis:6379/0
      MILVUS_COLLECTION: gd4_chunks
      DEVICE: ${DEVICE:-cuda}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      # 模型不打包进镜像，改为挂载宿主机的本地权重目录
      EMBED_MODEL_PATH: /models/bge-m3
      RERANK_MODEL_PATH: /models/bge-reranker-v2-m3
      CLIP_MODEL_PATH: /models/chinese-clip-vit-base-patch16
      PADDLEOCR_MODEL_DIR: /paddleocr_models
    volumes:
      - ./data:/app/data                                    # 解析产物、索引与图像，重建索引免于丢失
      - D:/模型/bge-m3:/models/bge-m3:ro                     # 向量模型挂载
      - D:/模型/bge-reranker-v2-m3:/models/bge-reranker-v2-m3:ro   # 重排模型挂载
      - D:/模型/chinese-clip-vit-base-patch16:/models/chinese-clip-vit-base-patch16:ro  # 多模态模型挂载
      - C:/paddleocr_models:/paddleocr_models:ro             # OCR 模型（纯英文路径，规避中文用户名问题）
    ports: ["8000:8000"]
    depends_on: [milvus, redis]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s                                    # 首次启动要加载三个本地模型，给足预热时间

  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro                  # Vue CDN 单文件，静态托管即可
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:80"]
    depends_on: [backend]
