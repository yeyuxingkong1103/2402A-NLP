<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PersonaRAG · 多角色智能顾问系统</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>

<div class="layout">

  <!-- ==================== 左侧边栏 ==================== -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">R</span>
      <div class="brand-text">
        <strong>PersonaRAG</strong>
        <small>混合检索 · 重排 · 多轮记忆</small>
      </div>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-view="chat">对话</button>
      <button class="nav-item" data-view="search">检索台</button>
      <button class="nav-item" data-view="kb">知识库</button>
    </nav>

    <div class="side-title">角色</div>
    <div class="role-list" id="roleList"></div>

    <div class="side-foot">
      <label class="mini-field">
        <span>用户 ID</span>
        <input id="userId" type="number" min="1" value="1">
      </label>
      <div class="status-line">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">连接中…</span>
        <span class="muted" id="onlineText"></span>
      </div>
    </div>
  </aside>

  <!-- ==================== 主区域 ==================== -->
  <main class="main">

    <!-- ---------- 视图一：对话 ---------- -->
    <section class="view active" id="view-chat">
      <header class="view-head">
        <div class="head-role">
          <span class="role-avatar" id="chatAvatar">?</span>
          <div class="head-role-text">
            <h1 id="chatRoleName">请选择角色</h1>
            <p id="chatRoleDesc">从左侧选择角色后开始对话</p>
          </div>
        </div>
        <div class="head-tools">
          <label class="mini-field inline">
            <span>引用条数</span>
            <input id="topK" type="number" min="1" max="20" value="5">
          </label>
          <button class="btn ghost" id="clearBtn">清空记忆</button>
        </div>
      </header>

      <div class="chat-scroll" id="chatScroll">
        <!-- 无消息时的欢迎页 -->
        <div class="empty" id="chatEmpty">
          <div class="empty-icon">
            <svg width="46" height="46" viewBox="0 0 46 46" fill="none">
              <rect x="4" y="7" width="38" height="26" rx="7" stroke="currentColor" stroke-width="2.2"/>
              <path d="M13 20h20M13 26h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              <path d="M23 33v6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
          </div>
          <h2 id="emptyTitle">有什么可以帮你的？</h2>
          <p id="emptySub">选好角色后提问，系统会从该角色的知识库检索资料再作答</p>
          <div class="suggest" id="suggestList"></div>
        </div>

        <div class="messages" id="messages"></div>
      </div>

      <footer class="composer">
        <div class="composer-box">
          <textarea id="input" rows="1" placeholder="输入问题：Enter 发送，Shift + Enter 换行"></textarea>
          <button class="send" id="sendBtn" disabled>发送</button>
          <button class="send stop hidden" id="stopBtn">停止</button>
        </div>
        <div class="composer-hint" id="composerHint"></div>
      </footer>
    </section>

    <!-- ---------- 视图二：检索台 ---------- -->
    <section class="view" id="view-search">
      <header class="view-head">
        <div class="head-role">
          <div class="head-role-text">
            <h1>检索测试台</h1>
            <p>只跑「向量 + BM25 混合召回 → RRF 融合 → CrossEncoder 重排」，不调用大模型</p>
          </div>
        </div>
        <div class="head-tools">
          <span class="chip" id="searchCollection">集合：-</span>
        </div>
      </header>

      <div class="page-scroll">
        <div class="panel">
          <div class="row">
            <input class="input grow" id="searchQuery" placeholder="输入查询，例如：故意伤害 量刑标准">
            <label class="mini-field inline">
              <span>条数</span>
              <input id="searchTopK" type="number" min="1" max="20" value="5">
            </label>
            <button class="btn primary" id="searchBtn">检索</button>
          </div>
          <div class="hint" id="searchHint">检索用的是当前选中的角色知识库</div>
        </div>
        <div class="doc-list" id="searchResults"></div>
      </div>
    </section>

    <!-- ---------- 视图三：知识库 ---------- -->
    <section class="view" id="view-kb">
      <header class="view-head">
        <div class="head-role">
          <div class="head-role-text">
            <h1>知识库管理</h1>
            <p id="kbMeta">集合：-</p>
          </div>
        </div>
        <div class="head-tools">
          <button class="btn ghost" id="kbRefresh">刷新</button>
          <button class="btn danger" id="kbRebuild">全量重建</button>
        </div>
      </header>

      <div class="page-scroll">
        <div class="grid-2">
          <div class="panel">
            <h3>上传文件入库</h3>
            <label class="drop" id="dropZone">
              <input type="file" id="fileInput" multiple hidden
                     accept=".txt,.md,.docx,.wps,.doc,.pdf">
              <strong>点击选择文件</strong>
              <span>或把文件拖进来 · 支持 txt / md / docx / wps / doc / pdf</span>
            </label>
            <div class="file-list" id="fileList"></div>
            <button class="btn primary" id="uploadBtn" disabled>开始入库</button>
          </div>

          <div class="panel">
            <h3>粘贴文本入库</h3>
            <input class="input" id="textSource" placeholder="来源名，例如：刑法笔记.md（.md 会按标题切分）">
            <select class="input" id="textStrategy">
              <option value="paragraph">paragraph · 按段落</option>
              <option value="fixed">fixed · 固定长度</option>
              <option value="sentence">sentence · 按句子</option>
              <option value="markdown">markdown · 按标题</option>
              <option value="semantic">semantic · 语义切分</option>
            </select>
            <textarea class="input" id="textBody" rows="5" placeholder="粘贴正文内容…"></textarea>
            <button class="btn primary" id="textIngestBtn">入库</button>
          </div>
        </div>

        <div class="panel">
          <h3>已有来源 <span class="badge" id="kbTotal">0</span></h3>
          <div class="table" id="sourceTable">
            <div class="table-empty">加载中…</div>
          </div>
        </div>
      </div>
    </section>

  </main>
</div>

<div class="toasts" id="toasts"></div>
<script src="app.js?v=4"></script>
</body>
</html>
