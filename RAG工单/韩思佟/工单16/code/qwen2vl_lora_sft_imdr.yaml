### 工单16 —— Qwen2-VL LoRA 微调配置（LLaMA-Factory）
### 用法（在 LLaMA-Factory 仓库根目录执行）：
###   llamafactory-cli train <本文件路径>
### 参考：RAGFlow 官方微调示例 / LLaMA-Factory examples/train_lora/qwen2vl_lora_sft.yaml

### ---------- 模型 ----------
model_name_or_path: Qwen/Qwen2-VL-7B-Instruct     # 显存不足可换 Qwen/Qwen2-VL-2B-Instruct
trust_remote_code: true

### ---------- 微调方法 ----------
stage: sft
do_train: true
finetuning_type: lora          # LoRA 低秩适配，工业场景数据量小，全参微调易过拟合
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all               # 视觉塔冻结，只训语言侧注意力/FFN

### ---------- 数据集 ----------
dataset: imdr_vlm_sft
dataset_dir: data              # dataset_info.json 所在目录
template: qwen2_vl
cutoff_len: 2048
max_samples: 2000
overwrite_cache: true
preprocessing_num_workers: 4

### ---------- 图像预处理（关键点）----------
image_max_pixels: 602112       # ≈ 768*784，工业图纸细节多，不宜过小
image_min_pixels: 200704       # ≥ 448*448，避免小图 OCR 丢失
video_max_pixels: 16384
image_resize: nearest          # 图纸有细线，nearest 避免插值糊掉线条

### ---------- 训练参数 ----------
output_dir: saves/qwen2vl-7b/lora/imdr
logging_steps: 10
save_steps: 200
plot_loss: true
overwrite_output_dir: true
report_to: none

per_device_train_batch_size: 1   # VLM 显存占用高；6GB 显存建议 1 + 梯度累积
gradient_accumulation_steps: 8   # 等效 batch = 8
learning_rate: 1.0e-4            # LoRA 常用 1e-4；全参用 1e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true                       # 30/40 系以上支持；老卡改 fp16: true
gradient_checkpointing: true     # 用时间换显存，低显存必开
ddp_timeout: 180000000
flash_attn: auto

### ---------- 评估/验证 ----------
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200

