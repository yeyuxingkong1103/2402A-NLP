name: rag-roleplay

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: roleplay
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    volumes: [redis-data:/data]

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    command: minio server /data
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes: [minio-data:/data]

  milvus:
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    depends_on: [etcd, minio]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports: ["19530:19530"]

  bge-m3:
    build: ./services/embed
    environment:
      EMBED_MODEL: /data/bge-m3
    volumes:
      # 请将 BGE-M3 模型放到 ./models/bge-m3（或改回你自己的绝对路径）
      - ./models/bge-m3:/data/bge-m3
    ports: ["8080:80"]

  bge-rerank:
    build: ./services/rerank
    environment:
      RERANK_MODEL: /data/bge-reranker-base
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      # 请将 BGE-reranker 模型放到 ./models/bge-reranker-base（或改回你自己的绝对路径）
      - ./models/bge-reranker-base:/data/bge-reranker-base
    ports: ["8081:8000"]

  api:
    build: ./backend
    depends_on: [mysql, redis, milvus, bge-m3, bge-rerank]
    environment:
      DATABASE_URL: mysql+asyncmy://root:password@mysql:3306/roleplay
      REDIS_URL: redis://redis:6379/0
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      EMBEDDING_BASE_URL: http://bge-m3:80
      RERANK_BASE_URL: http://bge-rerank:8000
      DOC_UPLOAD_DIR: /data/uploads
      LLM_API_KEY: ${DEEPSEEK_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-set-a-long-random-secret}
    volumes: [doc-uploads:/data/uploads]
    ports: ["8000:8000"]

  worker:
    build: ./backend
    command: ["arq", "app.worker.run.WorkerSettings"]
    depends_on: [mysql, redis, milvus, bge-m3, bge-rerank]
    environment:
      DATABASE_URL: mysql+asyncmy://root:password@mysql:3306/roleplay
      REDIS_URL: redis://redis:6379/0
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      EMBEDDING_BASE_URL: http://bge-m3:80
      RERANK_BASE_URL: http://bge-rerank:8000
      DOC_UPLOAD_DIR: /data/uploads
      LLM_API_KEY: ${DEEPSEEK_API_KEY}
    volumes: [doc-uploads:/data/uploads]

volumes:
  mysql-data:
  redis-data:
  minio-data:
  doc-uploads:
