<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>基于PDF文档的问答系统</title>
<link rel="stylesheet" href="style.css?v=1">
<!-- Markdown 渲染：marked.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<div class="app">

  <!-- ==================== 顶部标题栏 ==================== -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">PDF</span>
      <div class="brand-text">
        <strong>基于PDF文档的问答系统</strong>
        <small>RAG · 混合检索 · 重排 · DeepSeek</small>
      </div>
    </div>

    <!-- 两个标签页 -->
    <nav class="tabs">
      <button class="tab active" data-view="chat">问答对话</button>
      <button class="tab" data-view="kb">知识库管理</button>
    </nav>

    <div class="topbar-right">
      <span class="session-badge" id="sessionBadge" title="">新会话</span>
      <button class="btn-icon" id="newChatBtn" title="开启新会话">+</button>
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">未连接</span>
    </div>
  </header>

  <!-- ==================== 视图一：问答对话 ==================== -->
  <section class="view active" id="view-chat">
    <div class="chat-layout">

      <!-- 左侧：问答区 -->
      <div class="chat-main">
        <div class="chat-history" id="chatHistory">
          <div class="chat-empty" id="chatEmpty">
            <div class="empty-icon">
              <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                <rect x="6" y="8" width="36" height="32" rx="4" stroke="currentColor" stroke-width="2.2"/>
                <path d="M16 20h16M16 28h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              </svg>
            </div>
            <h2>有什么可以帮你的？</h2>
            <p>上传 PDF 入库后，输入问题，系统会从知识库检索相关内容并作答。</p>
          </div>
        </div>

        <footer class="composer">
          <div class="composer-box">
            <textarea id="questionInput" rows="1" placeholder="输入你的问题：Enter 发送，Shift + Enter 换行"></textarea>
            <button class="send-btn" id="sendBtn">发送</button>
          </div>
          <div class="composer-hint" id="composerHint"></div>
        </footer>
      </div>

      <!-- 右侧：检索来源展示 -->
      <aside class="chat-sources">
        <div class="sources-head">
          <h3>检索来源</h3>
          <span class="badge" id="sourceCount">0</span>
        </div>
        <div class="sources-list" id="sourcesList">
          <div class="sources-empty">回答后将在此显示引用的文档片段。</div>
        </div>
      </aside>

    </div>
  </section>

  <!-- ==================== 视图二：知识库管理 ==================== -->
  <section class="view" id="view-kb">
    <div class="kb-layout">

      <!-- 上传与入库 -->
      <div class="panel">
        <h3>PDF 上传</h3>
        <label class="drop-zone" id="dropZone">
          <input type="file" id="fileInput" multiple accept=".pdf" hidden>
          <div class="drop-icon">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
              <path d="M20 6v22M12 14l8-8 8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M6 30v4a2 2 0 0 0 2 2h24a2 2 0 0 0 2-2v-4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
          </div>
          <strong>点击选择 PDF 文件</strong>
          <span>或把文件拖进来 · 仅支持 .pdf</span>
        </label>
        <div class="file-list" id="fileList"></div>
        <div class="kb-actions">
          <button class="btn primary" id="uploadBtn" disabled>上传 PDF</button>
          <button class="btn ghost" id="ingestBtn" disabled>入库</button>
        </div>
      </div>

      <!-- 文档数量与状态 -->
      <div class="panel">
        <h3>知识库状态</h3>
        <div class="kb-stat">
          <div class="stat-item">
            <div class="stat-num" id="docCount">-</div>
            <div class="stat-label">已入库文档数</div>
          </div>
          <div class="stat-item">
            <div class="stat-num" id="chunkCount">-</div>
            <div class="stat-label">总切片数</div>
          </div>
        </div>
        <div class="kb-status" id="kbStatus">尚未获取知识库信息。</div>
        <button class="btn ghost" id="refreshBtn">刷新</button>
      </div>

    </div>
  </section>

</div>

<!-- Toast 提示容器 -->
<div class="toasts" id="toasts"></div>
<script src="app.js?v=1"></script>
</body>
</html>
