<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>基于RAG的角色扮演系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f2f5; height: 100vh; }
.container { max-width: 800px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
.header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 16px 24px; text-align: center; }
.header h1 { font-size: 20px; }
.login-box, .character-box { flex: 1; display: flex; align-items: center; justify-content: center; }
.card { background: white; padding: 32px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 360px; }
.card h2 { text-align: center; margin-bottom: 24px; color: #333; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; margin-bottom: 6px; color: #666; font-size: 14px; }
.form-group input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
.btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 8px; }
.btn:hover { opacity: 0.9; }
.btn-secondary { background: #f0f0f0; color: #333; }
.character-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.character-card { padding: 16px; border: 2px solid #e0e0e0; border-radius: 8px; cursor: pointer; text-align: center; transition: all 0.2s; }
.character-card:hover { border-color: #667eea; background: #f8f9ff; }
.character-card.active { border-color: #667eea; background: #f0f2ff; }
.character-card .name { font-weight: bold; font-size: 16px; margin-bottom: 4px; }
.character-card .desc { font-size: 12px; color: #999; }
.chat-area { flex: 1; overflow-y: auto; padding: 16px; background: #f0f2f5; }
.message { margin-bottom: 16px; display: flex; }
.message.user { justify-content: flex-end; }
.message .bubble { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; word-break: break-word; }
.message.user .bubble { background: #667eea; color: white; border-bottom-right-radius: 4px; }
.message.assistant .bubble { background: white; color: #333; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
.input-area { display: flex; padding: 12px 16px; background: white; border-top: 1px solid #e0e0e0; gap: 8px; }
.input-area input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 20px; font-size: 14px; }
.input-area button { padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 20px; cursor: pointer; font-size: 14px; }
.input-area button:disabled { background: #ccc; cursor: not-allowed; }
.info-bar { padding: 8px 16px; background: white; border-bottom: 1px solid #e0e0e0; font-size: 13px; color: #666; display: flex; justify-content: space-between; }
.typing { color: #999; font-style: italic; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="container">
  <div class="header"><h1>基于RAG的角色扮演系统</h1></div>

  <!-- 登录界面 -->
  <div id="loginView" class="login-box">
    <div class="card">
      <h2>用户登录</h2>
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" value="xiaoming">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码" value="123456">
      </div>
      <button class="btn" onclick="login()">登录</button>
    </div>
  </div>

  <!-- 角色选择界面 -->
  <div id="characterView" class="character-box hidden">
    <div class="card" style="width: 480px;">
      <h2>选择角色</h2>
      <div id="characterList" class="character-list"></div>
      <button class="btn" style="margin-top:20px;" onclick="startChat()">开始对话</button>
    </div>
  </div>

  <!-- 聊天界面 -->
  <div id="chatView" class="hidden" style="flex:1; display:flex; flex-direction:column;">
    <div class="info-bar">
      <span>当前角色：<b id="currentChar"></b></span>
      <span>用户：<b id="currentUser"></b> | <a href="#" onclick="logout()" style="color:#667eea;">退出</a></span>
    </div>
    <div id="chatArea" class="chat-area"></div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter')sendMessage()">
      <button id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:8000';
let token = localStorage.getItem('token') || '';
let username = localStorage.getItem('username') || '';
let selectedCharacter = '';
let characters = [];

// 自动登录
if (token) {
  document.getElementById('username').value = username;
  loadCharacters();
}

async function login() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  if (!u || !p) { alert('请输入用户名和密码'); return; }
  try {
    const res = await fetch(`${API}/api/login`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: u, password: p})
    });
    const data = await res.json();
    if (data.code === 0) {
      token = data.data.token;
      username = u;
      localStorage.setItem('token', token);
      localStorage.setItem('username', username);
      loadCharacters();
    } else {
      alert(data.detail || '登录失败');
    }
  } catch(e) { alert('登录失败：' + e.message); }
}

async function loadCharacters() {
  try {
    const res = await fetch(`${API}/api/characters`);
    const data = await res.json();
    characters = data.data;
    const list = document.getElementById('characterList');
    list.innerHTML = characters.map(c => 
      `<div class="character-card" onclick="selectCharacter('${c.name}', this)">
        <div class="name">${c.name}</div><div class="desc">${c.description}</div>
      </div>`
    ).join('');
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('characterView').classList.remove('hidden');
  } catch(e) { alert('加载角色失败：' + e.message); }
}

function selectCharacter(name, el) {
  selectedCharacter = name;
  document.querySelectorAll('.character-card').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}

function startChat() {
  if (!selectedCharacter) { alert('请选择一个角色'); return; }
  document.getElementById('characterView').classList.add('hidden');
  document.getElementById('chatView').classList.remove('hidden');
  document.getElementById('currentChar').textContent = selectedCharacter;
  document.getElementById('currentUser').textContent = username;
  document.getElementById('chatArea').innerHTML = '';
  addMessage('assistant', `你好，我是${selectedCharacter}，有什么可以帮你的吗？`);
}

function addMessage(role, text) {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = `message ${role}`;
  div.innerHTML = `<div class="bubble">${text}</div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return div;
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  document.getElementById('sendBtn').disabled = true;
  addMessage('user', text);
  const msgDiv = addMessage('assistant', '<span class="typing">正在思考...</span>');
  const bubble = msgDiv.querySelector('.bubble');
  
  try {
    const res = await fetch(`${API}/api/chat/stream`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`},
      body: JSON.stringify({character_name: selectedCharacter, query: text})
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';
    let buffer = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (line.startsWith('event: token')) {
          const dataLine = lines[lines.indexOf(line) + 1];
          if (dataLine && dataLine.startsWith('data: ')) {
            const token = dataLine.slice(6);
            fullText += token;
            bubble.textContent = fullText;
            document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
          }
        } else if (line.startsWith('event: done')) {
          const dataLine = lines[lines.indexOf(line) + 1];
          if (dataLine && dataLine.startsWith('data: ')) {
            fullText = dataLine.slice(6);
            bubble.textContent = fullText;
          }
        }
      }
    }
    if (!fullText) bubble.textContent = '（无响应）';
  } catch(e) {
    bubble.textContent = '请求失败：' + e.message;
  }
  document.getElementById('sendBtn').disabled = false;
}

function logout() {
  token = ''; username = ''; selectedCharacter = '';
  localStorage.removeItem('token'); localStorage.removeItem('username');
  document.getElementById('chatView').classList.add('hidden');
  document.getElementById('loginView').classList.remove('hidden');
}
</script>
</body>
</html>
